<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SolarWake — AI Lead Reactivation</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  html,body{margin:0;background:#0B1220;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
  *{box-sizing:border-box}
  .sw-dots i{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:999px;background:#9aa;animation:swb 1.2s infinite}
  .sw-dots i:nth-child(2){animation-delay:.2s}.sw-dots i:nth-child(3){animation-delay:.4s}
  @keyframes swb{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}
  @media(max-width:860px){.sw-grid{grid-template-columns:1fr !important}}
  ::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:#33415c;border-radius:9px}
  select option{background:#1B2740;color:#E7ECF5}
  input::placeholder{color:#8a94a6}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect, useMemo } = React;

// ================== CONFIG ==================
// Model string for the live Anthropic API. Verify/swap at https://docs.claude.com if needed.
// Good options: "claude-sonnet-5" (best conversation) · "claude-haiku-4-5-20251001" (cheaper/faster).
const MODEL = "claude-sonnet-5";

const C = {
  night:"#0B1220", panel:"#131C2E", panel2:"#1B2740", line:"#26324B",
  gold:"#F5B301", goldSoft:"#FFE08A", text:"#E7ECF5", sub:"#8DA0C0", green:"#16A34A",
  waHeader:"#075E54", waWall:"#ECE5DD", waIn:"#FFFFFF", waOut:"#DCF8C6", waTick:"#34B7F1",
};

// ================== CRM DATA (SolarWake's own store) ==================
const COMPANIES = [
  { id:"SW-001", name:"BrightRoof Solar", city:"Munich",   api:"Live" },
  { id:"SW-002", name:"HelioHaus GmbH",   city:"Berlin",   api:"Live" },
  { id:"SW-003", name:"SonnenKraft Nord", city:"Hamburg",  api:"Live" },
  { id:"SW-005", name:"AlpenVolt AG",     city:"Zurich",   api:"Live" },
];
const CONTACTS = [
  {id:"C-1001",co:"SW-001",name:"Michael Weber",seg:"Residential",city:"Munich",kw:8,quote:14200,days:47,status:"Cold",phone:"+491511234567"},
  {id:"C-1002",co:"SW-001",name:"Sofia Klein",seg:"Residential",city:"Munich",kw:6.5,quote:9800,days:62,status:"Contacting",phone:"+491602345678"},
  {id:"C-1003",co:"SW-001",name:"Jonas Braun",seg:"Residential",city:"Augsburg",kw:11,quote:21400,days:38,status:"Warm",phone:"+491703456789"},
  {id:"C-1004",co:"SW-001",name:"Amelie Roth",seg:"Residential",city:"Munich",kw:5.5,quote:12100,days:90,status:"Cold",phone:"+491514567890"},
  {id:"C-1005",co:"SW-001",name:"David Fischer",seg:"Residential",city:"Rosenheim",kw:9.5,quote:17600,days:51,status:"Cold",phone:"+491605678901"},
  {id:"C-1006",co:"SW-001",name:"Bäckerei Hofmann GmbH",seg:"Commercial",city:"Munich",kw:42,quote:48500,days:73,status:"Cold",phone:"+498912345678"},
  {id:"C-1007",co:"SW-001",name:"Weber & Sohn Logistik",seg:"Commercial",city:"Dachau",kw:95,quote:112000,days:44,status:"Warm",phone:"+498131234567"},
  {id:"C-1008",co:"SW-002",name:"Lena Schuster",seg:"Residential",city:"Berlin",kw:7,quote:13100,days:55,status:"Cold",phone:"+491512223344"},
  {id:"C-1009",co:"SW-002",name:"Paul Neumann",seg:"Residential",city:"Potsdam",kw:10,quote:19800,days:29,status:"Contacting",phone:"+491603334455"},
  {id:"C-1010",co:"SW-002",name:"Café Sonnendeck",seg:"Commercial",city:"Berlin",kw:28,quote:36700,days:81,status:"Cold",phone:"+493044556677"},
  {id:"C-1012",co:"SW-003",name:"Erik Hansen",seg:"Residential",city:"Hamburg",kw:8.5,quote:15600,days:67,status:"Cold",phone:"+491515556677"},
  {id:"C-1013",co:"SW-003",name:"Nina Fischer",seg:"Residential",city:"Lübeck",kw:7.5,quote:13900,days:33,status:"Warm",phone:"+491606667788"},
  {id:"C-1014",co:"SW-003",name:"Nordwind Hotel GmbH",seg:"Commercial",city:"Hamburg",kw:60,quote:74000,days:58,status:"Cold",phone:"+494030001122"},
  {id:"C-1019",co:"SW-005",name:"Andreas Meier",seg:"Residential",city:"Zurich",kw:9,quote:22500,days:41,status:"Warm",phone:"+41791234567"},
  {id:"C-1020",co:"SW-005",name:"Claudia Brunner",seg:"Residential",city:"Winterthur",kw:6.5,quote:17800,days:60,status:"Cold",phone:"+41782345678"},
  {id:"C-1021",co:"SW-005",name:"Bergblick Praxis AG",seg:"Commercial",city:"Zug",kw:22,quote:39900,days:53,status:"Contacting",phone:"+41412223344"},
];

const eur = n => "€" + n.toLocaleString("de-DE");
const now = () => new Date().toLocaleTimeString([], { hour:"2-digit", minute:"2-digit" });

function buildSystem(lead, company){
  const biz = lead.seg === "Commercial";
  return `You are SolarWake, an AI reactivation assistant for ${company.name}, following up over WhatsApp as "Lina".
You are messaging ${lead.name}${biz?" (a commercial / business lead)":""}, who was quoted ${eur(lead.quote)} for a ${lead.kw} kW ${biz?"commercial ":""}solar system ${lead.days} days ago in ${lead.city}, then went quiet.
Goal: warmly re-engage, answer briefly, handle objections, create gentle honest urgency (subsidy round closing, install slots before winter${biz?", clear ROI / payback for the business":", bill savings"}), and book a 15-minute call with a human advisor${biz?" or decision-maker":""}.
Style: WhatsApp voice — short 1-2 sentence messages, friendly, an occasional emoji, never pushy.${biz?" Slightly more professional, business tone.":""} Offer specific time slots.
Reply with ONLY valid JSON, no markdown, no backticks: {"message":"<reply>","status":"contacting|warm|booked","appointment":<null or "Day at Time">}
Use "warm" once interest returns; use "booked" and fill "appointment" ONLY once a specific day/time is agreed. Move toward a booking within a few messages.`;
}
const opener = (lead, company) => {
  const biz = lead.seg === "Commercial";
  const who = biz ? "there" : lead.name.split(" ")[0];
  return `Hi ${who}! 👋 It's Lina from ${company.name}. A while back we put together a solar quote for ${biz?"your business":"your home"} — I wanted to reach out before the current subsidy round closes. Are you still thinking about going solar? ☀️`;
};

const QUICK = ["Oh right, I forgot about this","It's honestly a bit expensive","I already got another quote","Does it really lower my bill?","Ok sure — when can we talk?"];

// Scripted fallback so a stage demo never depends on wifi.
const SCRIPT = [
  { message:"So glad you replied! 😊 A lot has changed — there's a subsidy round closing soon that can meaningfully cut your upfront cost. Want me to walk you through the new numbers?", status:"warm", appointment:null },
  { message:"Totally fair. Most customers we reactivate end up cutting their electricity bill 50–70%, and with financing there's often no money upfront. Could I book you a quick 15-min call with an advisor — Thursday 6pm or Friday morning? 🙂", status:"warm", appointment:null },
  { message:"Perfect — you're booked for Thursday at 6:00 PM. You'll get a WhatsApp confirmation shortly. Talk soon! ☀️", status:"booked", appointment:"Thursday 6:00 PM" },
];

function parseAgent(raw){
  let t=(raw||"").trim().replace(/```json/gi,"").replace(/```/g,"").trim();
  const a=t.indexOf("{"), b=t.lastIndexOf("}");
  if(a!==-1&&b>a) t=t.slice(a,b+1);
  try{ const o=JSON.parse(t);
    return { message:o.message||"…", status:["contacting","warm","booked"].includes(o.status)?o.status:"warm", appointment:o.appointment||null };
  }catch{ return { message:raw||"Sorry, could you repeat that?", status:"warm", appointment:null }; }
}

function Icon({d,size=18,color="currentColor",fill="none"}){
  return <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{d}</svg>;
}
const SendI = p => <Icon {...p} d={<><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></>} />;
const PhoneI = p => <Icon {...p} d={<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.81.36 1.6.7 2.34a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.74-1.27a2 2 0 0 1 2.11-.45c.74.34 1.53.57 2.34.7A2 2 0 0 1 22 16.92z"/>} />;

function App(){
  const [leads,setLeads]=useState(CONTACTS);
  const [companyId,setCompanyId]=useState("SW-001");
  const [leadId,setLeadId]=useState("C-1001");
  const [messages,setMessages]=useState([]);
  const [started,setStarted]=useState(false);
  const [status,setStatus]=useState("cold");
  const [appointment,setAppointment]=useState(null);
  const [typing,setTyping]=useState(false);
  const [input,setInput]=useState("");
  const [toast,setToast]=useState(false);
  const [demoMode,setDemoMode]=useState(false);
  const scrollRef=useRef(null);

  const company=COMPANIES.find(c=>c.id===companyId);
  const lead=leads.find(l=>l.id===leadId)||leads.find(l=>l.co===companyId);
  const companyLeads=leads.filter(l=>l.co===companyId);
  const stats=useMemo(()=>{
    const d=companyLeads.filter(l=>l.status!=="Booked");
    return { dormant:d.length, atRisk:d.reduce((s,l)=>s+l.quote,0), booked:companyLeads.filter(l=>l.status==="Booked").length };
  },[leads,companyId]);
  const custTurns=messages.filter(m=>m.role==="customer").length;

  useEffect(()=>{ if(scrollRef.current) scrollRef.current.scrollTop=scrollRef.current.scrollHeight; },[messages,typing]);

  function pickLead(id){ setLeadId(id); setStarted(false); setMessages([]); setStatus("cold"); setAppointment(null); setTyping(false); setInput(""); }
  function pickCompany(id){ setCompanyId(id); const f=leads.filter(l=>l.co===id).sort((a,b)=>a.status==="Cold"?-1:1)[0]; pickLead(f?f.id:""); }
  function start(){ if(started||!lead) return; setStarted(true); setStatus("contacting"); setMessages([{role:"agent",text:opener(lead,company),time:now()}]); }

  async function liveAgent(history){
    const apiMsgs=history.map(m=>({role:m.role==="agent"?"assistant":"user",content:m.text}));
    const res=await fetch("/api/chat",{ method:"POST", headers:{"content-type":"application/json"},
      body:JSON.stringify({ model:MODEL, max_tokens:1000, system:buildSystem(lead,company), messages:apiMsgs }) });
    const data=await res.json();
    if(data.error) throw new Error(data.error.message||data.error);
    const text=(data.content||[]).filter(i=>i.type==="text").map(i=>i.text).join("\n");
    return parseAgent(text);
  }

  async function send(text){
    const clean=(text||"").trim(); if(!clean||typing||!started) return;
    setInput("");
    const history=[...messages,{role:"customer",text:clean,time:now()}];
    setMessages(history); setTyping(true);
    const turn=history.filter(m=>m.role==="customer").length; // 1-based
    let reply;
    try{
      if(demoMode){ await new Promise(r=>setTimeout(r,750)); reply=SCRIPT[Math.min(turn-1,SCRIPT.length-1)]; }
      else{ reply=await liveAgent(history); }
    }catch(e){
      // Auto-fallback to script if the live call fails — the demo keeps going.
      reply=SCRIPT[Math.min(turn-1,SCRIPT.length-1)];
    }
    setTyping(false);
    setMessages(m=>[...m,{role:"agent",text:reply.message,time:now()}]);
    if(reply.status&&reply.status!=="cold") setStatus(reply.status);
    if(reply.status==="booked"&&reply.appointment){
      setAppointment(reply.appointment);
      setLeads(ls=>ls.map(l=>l.id===lead.id?{...l,status:"Booked"}:l));
      setToast(true); setTimeout(()=>setToast(false),4500);
    }
  }

  const sMeta={ cold:{label:"Cold · dormant",color:C.sub,bg:"#1E2A44"},
    contacting:{label:"Contacting…",color:C.goldSoft,bg:"#3A2E12"},
    warm:{label:"Warm · engaged",color:C.gold,bg:"#3A2E12"},
    booked:{label:"Appointment booked",color:"#BBF7D0",bg:"#0F3D22"} }[status];

  const initials=n=>n.split(" ").map(x=>x[0]).slice(0,2).join("");

  return (
    <div style={{minHeight:"100vh",color:C.text}}>
      <div style={{maxWidth:1160,margin:"0 auto",padding:"20px 18px 34px"}}>
        {/* Header */}
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:12,marginBottom:16}}>
          <div style={{display:"flex",alignItems:"center",gap:12}}>
            <div style={{width:42,height:42,borderRadius:12,background:C.gold,display:"grid",placeItems:"center",boxShadow:`0 0 22px ${C.gold}55`,fontSize:22}}>☀️</div>
            <div>
              <div style={{fontSize:22,fontWeight:800,letterSpacing:-0.4}}>Solar<span style={{color:C.gold}}>Wake</span></div>
              <div style={{fontSize:12.5,color:C.sub,marginTop:-2}}>We don't find new leads. We close the ones you already paid for.</div>
            </div>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
            <button onClick={()=>setDemoMode(d=>!d)} title="Toggle scripted demo mode (no network needed)"
              style={{display:"inline-flex",alignItems:"center",gap:7,fontSize:12,fontWeight:700,cursor:"pointer",
                color:demoMode?C.night:C.sub,background:demoMode?C.gold:C.panel,border:`1px solid ${demoMode?C.gold:C.line}`,padding:"7px 12px",borderRadius:999}}>
              <span style={{width:7,height:7,borderRadius:999,background:demoMode?C.night:C.green}}/> {demoMode?"Demo Mode (scripted)":"Live AI"}
            </button>
            <div style={{display:"flex",alignItems:"center",gap:7,fontSize:12,color:C.sub,background:C.panel,border:`1px solid ${C.line}`,padding:"7px 12px",borderRadius:999}}>
              <span style={{width:7,height:7,borderRadius:999,background:C.gold,boxShadow:`0 0 7px ${C.gold}`}}/> Powered by Claude · Anthropic API
            </div>
          </div>
        </div>

        <div className="sw-grid" style={{display:"grid",gridTemplateColumns:"minmax(0,1fr) 380px",gap:18,alignItems:"start"}}>
          {/* LEFT — CRM */}
          <div style={{background:C.panel,border:`1px solid ${C.line}`,borderRadius:18,padding:18}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,marginBottom:14,flexWrap:"wrap"}}>
              <div style={{display:"flex",alignItems:"center",gap:9}}>
                <span style={{fontSize:12,fontWeight:700,color:C.sub,textTransform:"uppercase",letterSpacing:1}}>Solar company</span>
                <select value={companyId} onChange={e=>pickCompany(e.target.value)}
                  style={{background:C.panel2,color:C.text,border:`1px solid ${C.line}`,borderRadius:9,padding:"7px 10px",fontSize:13,fontWeight:600,outline:"none"}}>
                  {COMPANIES.map(c=><option key={c.id} value={c.id}>{c.name} — {c.city}</option>)}
                </select>
              </div>
              <span style={{display:"inline-flex",alignItems:"center",gap:6,fontSize:11.5,color:"#7BE0A6"}}>
                <span style={{width:7,height:7,borderRadius:999,background:C.green,boxShadow:`0 0 7px ${C.green}`}}/> CRM {company.api}
              </span>
            </div>

            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:16}}>
              {[
                {k:"Dormant leads",v:String(stats.dormant),sub:"in this pipeline"},
                {k:"Pipeline at risk",v:eur(stats.atRisk),sub:"already-paid leads"},
                {k:"Appointments booked",v:String(stats.booked),sub:"no new ad spend",hot:true},
              ].map(s=>(
                <div key={s.k} style={{background:C.panel2,border:`1px solid ${C.line}`,borderRadius:12,padding:"12px"}}>
                  <div style={{fontSize:s.v.length>7?18:24,fontWeight:800,color:s.hot?C.gold:C.text}}>{s.v}</div>
                  <div style={{fontSize:11.5,color:C.text,fontWeight:600,lineHeight:1.2,marginTop:2}}>{s.k}</div>
                  <div style={{fontSize:10.5,color:C.sub,marginTop:1}}>{s.sub}</div>
                </div>
              ))}
            </div>

            {lead&&(
              <div style={{background:`linear-gradient(180deg,${C.panel2},${C.panel})`,
                border:`1.5px solid ${status==="booked"?C.green:status==="cold"?C.line:C.gold}`,
                borderRadius:14,padding:16,marginBottom:14,
                boxShadow:status==="booked"?`0 0 24px ${C.green}44`:status!=="cold"?`0 0 20px ${C.gold}22`:"none",transition:"all .45s ease"}}>
                <div style={{display:"flex",alignItems:"center",gap:12}}>
                  <div style={{width:44,height:44,borderRadius:999,background:"#2A3A5C",display:"grid",placeItems:"center",fontWeight:700,fontSize:13,color:C.goldSoft}}>
                    {lead.seg==="Commercial"?"🏢":initials(lead.name)}
                  </div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontWeight:700,fontSize:15,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{lead.name}</div>
                    <div style={{fontSize:12,color:C.sub}}>{lead.seg} · {lead.kw} kW · quoted {eur(lead.quote)} · {lead.days}d ago</div>
                  </div>
                </div>
                <div style={{display:"flex",alignItems:"center",gap:8,marginTop:12,flexWrap:"wrap"}}>
                  <span style={{fontSize:12,fontWeight:700,color:sMeta.color,background:sMeta.bg,padding:"5px 11px",borderRadius:999,transition:"all .4s"}}>
                    {status==="booked"?"✅ ":""}{sMeta.label}
                  </span>
                  {appointment&&(
                    <span style={{display:"inline-flex",alignItems:"center",gap:6,fontSize:12,fontWeight:700,color:"#BBF7D0",background:"#0F3D22",padding:"5px 11px",borderRadius:999}}>
                      📅 {appointment}
                    </span>
                  )}
                  {status==="booked"&&(
                    <span style={{display:"inline-flex",alignItems:"center",gap:5,fontSize:11,fontWeight:700,color:"#9FD0FF"}}>✓ synced to CRM</span>
                  )}
                </div>
              </div>
            )}

            <div style={{fontSize:11.5,color:C.sub,marginBottom:8,letterSpacing:0.4}}>DORMANT LEADS — {company.name} · click one to work it</div>
            <div style={{display:"flex",flexDirection:"column",gap:8,maxHeight:250,overflowY:"auto",paddingRight:2}}>
              {companyLeads.map(l=>{
                const active=l.id===leadId;
                return (
                  <button key={l.id} onClick={()=>pickLead(l.id)}
                    style={{textAlign:"left",display:"flex",alignItems:"center",gap:11,background:active?C.panel2:C.night,
                      border:`1px solid ${active?C.gold:C.line}`,borderRadius:11,padding:"10px 12px",cursor:"pointer",width:"100%"}}>
                    <div style={{width:30,height:30,borderRadius:999,background:"#243352",display:"grid",placeItems:"center",fontSize:14,flexShrink:0}}>
                      {l.seg==="Commercial"?"🏢":"🏠"}
                    </div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:13,fontWeight:600,color:C.text,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{l.name}</div>
                      <div style={{fontSize:11,color:C.sub}}>quoted {eur(l.quote)} · {l.days}d ago</div>
                    </div>
                    <span style={{fontSize:11,fontWeight:700,flexShrink:0,color:l.status==="Booked"?"#7BE0A6":l.status==="Warm"?C.gold:l.status==="Contacting"?C.goldSoft:C.sub}}>
                      {l.status==="Booked"?"✅ ":""}{l.status}
                    </span>
                  </button>
                );
              })}
            </div>
          </div>

          {/* RIGHT — WhatsApp */}
          <div style={{background:"#000",borderRadius:26,padding:8,boxShadow:"0 20px 50px rgba(0,0,0,.5)"}}>
            <div style={{background:C.waWall,borderRadius:20,overflow:"hidden",display:"flex",flexDirection:"column",height:620}}>
              <div style={{background:C.waHeader,color:"#fff",padding:"12px 14px",display:"flex",alignItems:"center",gap:11}}>
                <div style={{width:38,height:38,borderRadius:999,background:"#25D366",display:"grid",placeItems:"center",fontWeight:700,color:"#075E54",fontSize:13}}>
                  {lead&&(lead.seg==="Commercial"?"🏢":initials(lead.name))}
                </div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:600,fontSize:15,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{lead?lead.name:"—"}</div>
                  <div style={{fontSize:11.5,opacity:.85}}>{typing?"typing…":"online"}</div>
                </div>
                <PhoneI size={18} color="#fff"/>
              </div>

              <div ref={scrollRef} style={{flex:1,overflowY:"auto",padding:"14px 12px",display:"flex",flexDirection:"column",gap:8}}>
                {!started&&(
                  <div style={{margin:"auto",textAlign:"center",color:"#667",maxWidth:250}}>
                    <div style={{fontSize:13,marginBottom:14,lineHeight:1.5}}>
                      {lead?<>This {lead.seg.toLowerCase()} lead went cold {lead.days} days ago after a {eur(lead.quote)} quote. Press start to watch SolarWake win them back.</>:"Select a lead to begin."}
                    </div>
                    {lead&&(
                      <button onClick={start} style={{display:"inline-flex",alignItems:"center",gap:8,background:C.waHeader,color:"#fff",border:"none",padding:"11px 20px",borderRadius:999,fontWeight:700,fontSize:14,cursor:"pointer"}}>▶ Start reactivation</button>
                    )}
                  </div>
                )}
                {messages.map((m,i)=>{
                  const mine=m.role==="customer";
                  return (
                    <div key={i} style={{alignSelf:mine?"flex-end":"flex-start",maxWidth:"82%"}}>
                      <div style={{background:mine?C.waOut:C.waIn,color:"#111",padding:"7px 10px 5px",borderRadius:9,
                        borderTopRightRadius:mine?2:9,borderTopLeftRadius:mine?9:2,boxShadow:"0 1px 1px rgba(0,0,0,.12)",fontSize:14,lineHeight:1.4}}>
                        {m.text}
                        <span style={{float:"right",fontSize:10,color:"#8a9",marginLeft:8,marginTop:4}}>{m.time}{mine?" ✓✓":""}</span>
                      </div>
                    </div>
                  );
                })}
                {typing&&(
                  <div style={{alignSelf:"flex-start",background:C.waIn,padding:"10px 14px",borderRadius:9,borderTopLeftRadius:2,boxShadow:"0 1px 1px rgba(0,0,0,.12)"}}>
                    <span className="sw-dots"><i/><i/><i/></span>
                  </div>
                )}
              </div>

              {started&&status!=="booked"&&(
                <div style={{display:"flex",gap:6,overflowX:"auto",padding:"8px 10px 0"}}>
                  {QUICK.map(q=>(
                    <button key={q} onClick={()=>send(q)} disabled={typing}
                      style={{whiteSpace:"nowrap",fontSize:12,background:"#fff",color:C.waHeader,border:`1px solid ${C.waHeader}44`,padding:"6px 11px",borderRadius:999,cursor:typing?"default":"pointer",opacity:typing?.5:1,fontWeight:600}}>{q}</button>
                  ))}
                </div>
              )}

              <div style={{display:"flex",alignItems:"center",gap:8,padding:10,background:"#F0F0F0"}}>
                <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&send(input)}
                  disabled={!started||typing} placeholder={started?"Reply as the customer…":"Press start first"}
                  style={{flex:1,border:"none",borderRadius:999,padding:"10px 14px",fontSize:14,outline:"none",background:"#fff",color:"#111"}}/>
                <button onClick={()=>send(input)} disabled={!started||typing}
                  style={{width:42,height:42,borderRadius:999,background:C.waHeader,border:"none",display:"grid",placeItems:"center",cursor:"pointer",flexShrink:0}}>
                  <SendI size={18} color="#fff"/>
                </button>
              </div>
            </div>
          </div>
        </div>

        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginTop:16,flexWrap:"wrap",gap:10}}>
          <div style={{fontSize:12,color:C.sub}}>⚡ The agent runs live on Anthropic's Claude API. Same lead volume → more booked appointments.</div>
          <button onClick={()=>pickCompany(companyId)} style={{display:"inline-flex",alignItems:"center",gap:7,background:C.panel,color:C.sub,border:`1px solid ${C.line}`,padding:"8px 14px",borderRadius:999,fontSize:13,cursor:"pointer",fontWeight:600}}>↺ Reset demo</button>
        </div>
      </div>

      {toast&&(
        <div style={{position:"fixed",bottom:24,left:"50%",transform:"translateX(-50%)",background:C.green,color:"#fff",padding:"14px 22px",borderRadius:14,fontWeight:700,fontSize:15,boxShadow:"0 12px 30px rgba(0,0,0,.4)",zIndex:50}}>
          ✓ Appointment booked{appointment?` — ${appointment}`:""} 🎉
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
