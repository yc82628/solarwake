// ================== CUSTOMER ARENA: Lina vs. tough customers, scored by code ==================
// Each persona replays a scripted customer against the same reply engine the console uses. Nothing is sent and the
// console's leads are untouched. The checks are plain code, so they hold for the templates and for any future AI.
const arenaInv = (name, milestone) => INITIAL_INVOICES.find(i=>i.name===name&&i.milestone===milestone);
const PERSONAS = [
  { id:"sceptic", emoji:"🤨", name:"The Sceptic", tag:"B2C", kind:"lead", lead:"C-1001", channel:"whatsapp", expect:"booked",
    blurb:"Doesn't believe the savings are real.", lines:["Hmm, how much would I really save?","Sounds too good to be true.","Ok fine — when can we talk?"] },
  { id:"hawk", emoji:"💸", name:"The Price Hawk", tag:"B2C", kind:"lead", lead:"C-1005", channel:"whatsapp", expect:"booked",
    blurb:"Every answer is \"too expensive\".", lines:["It's honestly a bit expensive","Still too much for us","Ok, book me in Friday morning"] },
  { id:"shopper", emoji:"🔍", name:"The Comparison Shopper", tag:"B2C", kind:"lead", lead:"C-1009", channel:"whatsapp", expect:"booked",
    blurb:"Already holding a cheaper quote.", lines:["I already got another quote","The other quote is cheaper","Sure, Thursday works"] },
  { id:"cfo", emoji:"📊", name:"The CFO", tag:"B2B", kind:"lead", lead:"C-1007", channel:"email", expect:"booked",
    blurb:"Wants ROI, payback and a sign-off path.", lines:["Send me the ROI numbers","Our CFO needs to sign off","Wednesday at 14:00 works for us"] },
  { id:"wrong", emoji:"🤷", name:"Wrong Number", tag:"B2C", kind:"lead", lead:"C-1012", channel:"whatsapp", expect:"optout",
    blurb:"Never asked for a quote.", lines:["Sorry, I think you have the wrong person"] },
  { id:"angry", emoji:"😠", name:"The Angry Opt-out", tag:"B2C", kind:"lead", lead:"C-1008", channel:"whatsapp", expect:"optout",
    blurb:"Wants the messages to stop. Now.", lines:["Who gave you my number?","STOP messaging me"] },
  { id:"paid", emoji:"🧾", name:"\"I Already Paid\"", tag:"Billing", kind:"bill", inv:["Huber Metallbau GmbH","Installation"], expect:"paid_claim",
    blurb:"Swears the money went out last week.", lines:["I already paid this last week"] },
  { id:"fix", emoji:"🔧", name:"The Broken Install", tag:"Billing", kind:"bill", inv:["Anna & Jonas Schneider","Installation"], expect:"dispute",
    blurb:"Won't pay until the system works.", lines:["There's a problem with the installation"] },
];
const PUSHY = /\b(last chance|act now|hurry|limited time|don'?t miss out|urgent)\b|!!/i;
const THREATS = /lawyer|court|legal action|collection agenc|inkasso|bailiff|penalt|late fee/i;
const figs = t => (t.match(/€\d[\d.]*/g)||[]).map(s=>s.replace(/\.$/,""));

function arenaRun(p){
  const turns=[], out={ booked:null, optOut:null, intent:null, flag:null };
  let who, allowed, checks;
  if(p.kind==="lead"){
    const l={ ...CONTACTS.find(c=>c.id===p.lead), channel:p.channel }, co=coOf(l), m=solarModel(l,co,{ bill:l.bill });
    who=`${l.dm?dmName(l):l.name} · lead of ${co.name}`;
    turns.push({ role:"agent", text:PLAYBOOKS[l.seg].opener[l.channel](l,co).text });
    for(const line of p.lines){
      turns.push({ role:"customer", text:line });
      const g=leadGuard(l,co,line);
      if(g){ out.optOut=g.reason; turns.push({ role:"agent", text:g.message }); break; }
      const r=leadReply(l,co,turns);
      turns.push({ role:"agent", text:r.message });
      if(r.status==="booked"&&r.appointment){ out.booked=r.appointment; break; }
    }
    allowed=[l.quote,m.savings,m.savings/12,m.net20,l.bill].map(eur);
  } else {
    const inv=arenaInv(...p.inv), co=coOf(inv), step=ladderStep(inv,LADDER)||LADDER[0];
    who=`${inv.contact} · ${inv.id}`;
    turns.push({ role:"agent", text:reminderScript(inv,co,step) });
    for(const line of p.lines){
      turns.push({ role:"customer", text:line });
      out.intent=classifyReply(line); out.flag=INTENT_FLAG[out.intent];
      turns.push({ role:"agent", text:replyScript(inv,co,out.intent) });
    }
    allowed=[inv.amount,inv.amount/2,inv.amount/3].map(eur);
  }
  const lina=turns.filter(t=>t.role==="agent").map(t=>t.text), last=lina[lina.length-1];
  const stray=[...new Set(lina.flatMap(figs).filter(f=>!allowed.includes(f)))];
  const answered=turns.every((t,i)=>t.role!=="customer"||(turns[i+1]&&turns[i+1].role==="agent"));
  const numbers={ k:"Only real numbers", ok:!stray.length, note:stray.length?`Not in the data: ${stray.join(", ")}`:"Every € figure comes from the customer's own data" };
  if(p.expect==="booked") checks=[
    { k:"Booked a call", ok:!!out.booked, note:out.booked?`Booked for ${out.booked}`:"No booking" },
    numbers,
    { k:"Answered every message", ok:answered, note:answered?"No message left hanging":"A message went unanswered" },
    { k:"Never pushy", ok:lina.every(t=>!PUSHY.test(t)), note:"No pressure tactics or fake urgency" },
  ];
  else if(p.expect==="optout") checks=[
    { k:"Respected the no", ok:!!out.optOut&&!out.booked, note:out.optOut?`Removed from the list (${out.optOut})`:"Kept messaging" },
    { k:"Read the room", ok:lina.slice(1).every(t=>!/solarwake\.app|\bbook|\bcall\b/i.test(t)), note:"No sales pitch to someone who is upset or asking why" },
    { k:"Stopped right away", ok:!/solarwake\.app|\bbook|\bcall\b/i.test(last), note:"Final message has no link and no sales pitch" },
    { k:"Never pushy", ok:lina.every(t=>!PUSHY.test(t)), note:"No pressure tactics or fake urgency" },
  ];
  else checks=[
    { k:"Understood the customer", ok:out.intent===p.expect, note:`Read the reply as "${out.intent}"` },
    { k:"Paused the reminders", ok:/Checking payment|Disputed/.test(out.flag||""), note:out.flag||"Reminders would keep going" },
    { k:"No threats", ok:!THREATS.test(lina.join(" ")), note:"No lawyers, fees or collection agencies" },
    p.expect==="dispute"
      ? { k:"Fix first, money later", ok:!/solarwake\.app\/i\//.test(last), note:"No payment link while the installation is broken" }
      : numbers,
  ];
  const passed=checks.filter(c=>c.ok).length;
  return { turns, who, checks, passed, total:checks.length, stars:passed===checks.length?3:passed>=checks.length-1?2:1 };
}
const MEDAL = { 3:"🥇", 2:"🥈", 1:"🥉" };

function ArenaView(){
  const [run,setRun]=useState(null);       // { p, res } on stage
  const [shown,setShown]=useState(0);      // turns revealed so far
  const [typing,setTyping]=useState(false);
  const [results,setResults]=useState({}); // persona id -> result
  const [busy,setBusy]=useState(false);
  const [party,setParty]=useState(null);
  const token=useRef(0);
  const stageRef=useRef(null);
  useEffect(()=>()=>{ token.current++; },[]);
  useEffect(()=>{ if(stageRef.current) stageRef.current.scrollTop=stageRef.current.scrollHeight; },[shown,typing]);

  const cheer=()=>{ if(REDUCED) return; const id=Date.now(); setParty({ id, kind:"booked" }); setTimeout(()=>setParty(x=>x&&x.id===id?null:x),3000); };
  // Plays one persona turn by turn. A newer run cancels this one (returns false).
  async function play(p, speed=1){
    const my=++token.current, res=arenaRun(p);
    setRun({ p, res }); setShown(0); setTyping(false); setBusy(true);
    for(let i=0;i<res.turns.length;i++){
      if(res.turns[i].role==="agent"){ setTyping(true); await sleep(700*speed); }
      else await sleep(550*speed);
      if(token.current!==my) return false;
      setTyping(false); setShown(i+1);
    }
    setResults(r=>({ ...r, [p.id]:res })); setBusy(false);
    if(speed===1&&res.stars===3) cheer();
    return res;
  }
  async function playAll(){
    let all=true;
    for(const p of PERSONAS){ const r=await play(p,.35); if(!r) return; all=all&&r.stars===3; await sleep(300); }
    if(all) cheer();
  }

  const done=Object.values(results), score=done.reduce((s,r)=>s+r.passed,0), max=done.reduce((s,r)=>s+r.total,0);
  const res=run&&run.res, finished=res&&shown===res.turns.length;

  return (
    <>
      <div style={{...panel,marginBottom:14,display:"flex",alignItems:"center",justifyContent:"space-between",gap:14,flexWrap:"wrap"}}>
        <div style={{flex:"1 1 420px"}}>
          <div style={{fontSize:21,fontWeight:800}}>🥊 Customer Arena</div>
          <div style={{fontSize:13,color:C.sub,marginTop:3,lineHeight:1.5}}>Lina vs. eight tough customers. Pick one and watch the conversation play out. Every reply is then checked by code: did she book, did she stick to real numbers, did she respect a no? Runs on the same rule engine as the console; nothing is sent.</div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
          <div style={{textAlign:"right"}}>
            <div style={{fontSize:20,fontWeight:800,color:max&&score===max?C.gold:C.text,fontVariantNumeric:"tabular-nums"}}>{max?`${score} / ${max}`:"—"}</div>
            <div style={{fontSize:11,color:C.sub}}>checks passed · {done.length}/{PERSONAS.length} customers</div>
          </div>
          <button onClick={playAll} style={{background:C.gold,color:C.night,border:"none",borderRadius:11,padding:"10px 16px",fontWeight:800,fontSize:13.5,cursor:"pointer"}}>▶ Run all eight</button>
        </div>
      </div>

      <div className="sw-grid" style={{display:"grid",gridTemplateColumns:"minmax(0,1fr) 430px",gap:18,alignItems:"start"}}>
        <div style={panel}>
          <div style={{...label,marginBottom:10}}>Choose a customer</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(210px,1fr))",gap:10}}>
            {PERSONAS.map(p=>{
              const r=results[p.id], on=run&&run.p.id===p.id;
              return (
                <button key={p.id} onClick={()=>play(p)} aria-pressed={!!on}
                  style={{textAlign:"left",background:on?C.panel2:C.night,border:`1px solid ${on?C.gold:C.line}`,borderRadius:13,padding:"12px 13px",cursor:"pointer",color:C.text,display:"flex",gap:11,alignItems:"flex-start"}}>
                  <span aria-hidden="true" key={r?r.passed:"x"} className={r?"sw-pop":""} style={{fontSize:30,lineHeight:1}}>{p.emoji}</span>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                      <b style={{fontSize:13.5}}>{p.name}</b>
                      <span style={{fontSize:10,fontWeight:800,color:p.tag==="B2B"?C.b2b:p.tag==="B2C"?C.b2c:"#FCA5A5",border:"1px solid currentColor",borderRadius:999,padding:"0 6px",opacity:.85}}>{p.tag}</span>
                    </div>
                    <div style={{fontSize:11.5,color:C.sub,marginTop:2}}>{p.blurb}</div>
                    <div style={{fontSize:12,marginTop:6,fontWeight:700,color:r?(r.stars===3?"#7BE0A6":C.goldSoft):C.sub}}>
                      {r?`${MEDAL[r.stars]} ${"★".repeat(r.stars)}${"☆".repeat(3-r.stars)} · ${r.passed}/${r.total}`:"Not played yet"}
                    </div>
                  </div>
                </button>
              );
            })}
          </div>
        </div>

        <div style={{background:"#fff",borderRadius:16,overflow:"hidden",boxShadow:"0 20px 50px rgba(0,0,0,.5)",color:"#1F2937",display:"flex",flexDirection:"column",height:640}}>
          <div style={{background:"#1E3A8A",color:"#fff",padding:"11px 14px",display:"flex",alignItems:"center",gap:10}}>
            <span style={{fontSize:22}} aria-hidden="true">{run?run.p.emoji:"🥊"}</span>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontWeight:700,fontSize:14}}>{run?`${run.p.name} vs. ☀️ Lina`:"Pick a customer to start"}</div>
              <div style={{fontSize:11.5,opacity:.85,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{run?res.who:"Each match is scored the moment it ends"}</div>
            </div>
            {busy&&<span style={{fontSize:11,fontWeight:700,background:"#ffffff22",padding:"3px 9px",borderRadius:999}}>LIVE</span>}
          </div>
          <div ref={stageRef} aria-live="polite" style={{flex:1,overflowY:"auto",padding:12,display:"flex",flexDirection:"column",gap:8,background:"#F3F4F6"}}>
            {!run&&<div style={{margin:"auto",textAlign:"center",color:"#6B7280",fontSize:13,lineHeight:1.6,maxWidth:280}}>Choose a customer on the left, or press <b>Run all eight</b> to fill the leaderboard.</div>}
            {res&&res.turns.slice(0,shown).map((t,i)=>{
              const cust=t.role==="customer";
              return (
                <div key={i} className="sw-in" style={{alignSelf:cust?"flex-end":"flex-start",maxWidth:"88%",display:"flex",gap:7,flexDirection:cust?"row-reverse":"row",alignItems:"flex-end"}}>
                  <span aria-hidden="true" style={{fontSize:18}}>{cust?run.p.emoji:"☀️"}</span>
                  <div style={{background:cust?"#DCF8C6":"#fff",border:"1px solid #E5E7EB",borderRadius:12,padding:"8px 11px",fontSize:13,lineHeight:1.45,whiteSpace:"pre-wrap",wordBreak:"break-word"}}>
                    <div style={{fontSize:10.5,fontWeight:800,color:"#6B7280",marginBottom:2}}>{cust?run.p.name:"Lina"}</div>
                    {t.text}
                  </div>
                </div>
              );
            })}
            {typing&&<div style={{alignSelf:"flex-start",background:"#fff",border:"1px solid #E5E7EB",borderRadius:12,padding:"9px 12px"}}><span className="sw-dots"><i/><i/><i/></span></div>}
            {finished&&(
              <div className="sw-in" style={{background:"#0B1220",color:C.text,borderRadius:14,padding:14,marginTop:6}}>
                <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:10}}>
                  <span key={run.p.id+shown} className="sw-pop" style={{fontSize:38}} aria-hidden="true">{MEDAL[res.stars]}</span>
                  <div>
                    <div style={{fontSize:18,fontWeight:800,color:C.gold,letterSpacing:2}} aria-label={`${res.stars} of 3 stars`}>{"★".repeat(res.stars)}{"☆".repeat(3-res.stars)}</div>
                    <div style={{fontSize:12.5,color:C.sub}}>{res.passed} of {res.total} checks passed</div>
                  </div>
                </div>
                {res.checks.map(c=>(
                  <div key={c.k} style={{display:"flex",gap:9,fontSize:12.5,padding:"4px 0",lineHeight:1.4}}>
                    <span style={{fontWeight:800,color:c.ok?"#7BE0A6":"#FCA5A5",width:14}}>{c.ok?"✓":"✗"}</span>
                    <div><b>{c.k}</b> <span style={{color:C.sub}}>· {c.note}</span></div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      </div>
      {party&&<Celebration key={party.id} party={party}/>}
    </>
  );
}

// ================== SENDING RULES UI ==================
const linkBtn = { background:"none", border:"none", padding:0, color:"#1D4ED8", fontWeight:700, fontSize:11, cursor:"pointer", textDecoration:"underline", fontFamily:"inherit" };

// Delivery status of an outgoing message, with a staff override for messages held by quiet hours.
function DeliveryNote({ d, onSendNow }){
  if(!d) return null;
  const text={ sent:"📨 Real email delivered to the test inbox", sending:"Sending real email…", error:`⚠ Not sent: ${d.note}`,
    held:`⏰ ${d.note}`, released:`✓ Sent${d.override?" by staff override":" after quiet hours"}`, cancelled:`🚫 ${d.note}` }[d.state]||d.note;
  return (
    <div style={{fontSize:11,fontWeight:700,marginBottom:8,color:{ sent:"#15803D", released:"#15803D", error:"#B91C1C", held:"#92400E", cancelled:"#B91C1C" }[d.state]||"#6B7280"}}>
      {text}{d.state==="held"&&onSendNow&&<> · <button onClick={onSendNow} style={linkBtn}>Send now (staff override)</button></>}
    </div>
  );
}

// What the customer sees at the bottom of every email.
function UnsubFooter({ onUnsub, lang }){
  return (
    <div style={{fontSize:11,color:"#6B7280",marginTop:8,borderTop:"1px dashed #E5E7EB",paddingTop:6}}>
      {lang==="de"?"Keine E-Mails mehr erhalten?":"Don't want these emails?"} <button onClick={onUnsub} style={linkBtn}>{lang==="de"?"Abmelden":"Unsubscribe"}</button>
    </div>
  );
}

function SendingRules({ policy, setPolicy, optOuts, resubscribe, held, sendNow, onClose }){
  const sel={ background:C.panel2, color:C.text, border:`1px solid ${C.line}`, borderRadius:9, padding:"6px 8px", fontSize:13, fontWeight:600 };
  const card={ background:C.night, border:`1px solid ${C.line}`, borderRadius:12, padding:14 };
  const now=new Date();
  const status=seg=>isQuiet(now,seg,policy)?<span style={{color:C.goldSoft}}>closed until {fmtWhen(nextWindow(now,seg,policy))}</span>:<span style={{color:"#7BE0A6"}}>open now</span>;
  const set=(k,v)=>setPolicy(p=>({ ...p, [k]:v }));
  const outs=Object.entries(optOuts);
  const check=(k,t)=>(
    <label style={{display:"flex",alignItems:"center",gap:8,fontSize:13,marginTop:8,cursor:"pointer"}}>
      <input type="checkbox" checked={policy[k]} onChange={e=>set(k,e.target.checked)} style={{accentColor:C.gold,width:16,height:16}}/> {t}
    </label>
  );
  return (
    <section className="sw-in" aria-label="Sending rules" style={{...panel,marginBottom:16}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10,marginBottom:12}}>
        <div>
          <div style={{fontSize:16,fontWeight:800}}>🛡 Sending rules</div>
          <div style={{fontSize:12,color:C.sub,marginTop:2,maxWidth:720}}>Apply to every proactive message (openers, campaigns, reminders) on email and WhatsApp. Replies to a customer's own message are always allowed, unless they unsubscribed. Saved in this browser.</div>
        </div>
        <button onClick={onClose} aria-label="Close sending rules" style={{...sel,cursor:"pointer"}}>✕</button>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(250px,1fr))",gap:12}}>
        <div style={card}>
          <div style={{...label,marginBottom:8}}>Quiet hours</div>
          <div style={{display:"flex",alignItems:"center",gap:8,fontSize:13,flexWrap:"wrap"}}>
            Send between
            <select aria-label="Earliest hour" value={policy.start} onChange={e=>set("start",Math.min(Number(e.target.value),policy.end-1))} style={sel}>{Array.from({length:24},(_,h)=><option key={h} value={h}>{hh(h)}</option>)}</select>
            and
            <select aria-label="Latest hour" value={policy.end} onChange={e=>set("end",Math.max(Number(e.target.value),policy.start+1))} style={sel}>{Array.from({length:24},(_,h)=><option key={h+1} value={h+1}>{hh(h+1)}</option>)}</select>
          </div>
          {check("b2bWeekdays","Businesses: weekdays only")}
          {check("b2cWeekdays","Homeowners: weekdays only")}
          <div style={{fontSize:12,color:C.sub,marginTop:10,lineHeight:1.6}}>Businesses: {status("Commercial")}<br/>Homeowners: {status("Residential")}</div>
          <div style={{fontSize:11,color:C.sub,marginTop:6}}>Messages created outside these hours are held and sent automatically when the window opens.</div>
        </div>
        <div style={card}>
          <div style={{...label,marginBottom:8}}>Sending limit</div>
          <div style={{display:"flex",alignItems:"center",gap:8,fontSize:13,flexWrap:"wrap"}}>
            At most
            <select aria-label="Messages per customer" value={policy.capN} onChange={e=>set("capN",Number(e.target.value))} style={sel}>{[1,2,3,5].map(n=><option key={n} value={n}>{n}</option>)}</select>
            message{policy.capN>1?"s":""} per customer every
            <select aria-label="Days" value={policy.capDays} onChange={e=>set("capDays",Number(e.target.value))} style={sel}>{[1,2,3,7,14].map(n=><option key={n} value={n}>{n} day{n>1?"s":""}</option>)}</select>
          </div>
          <div style={{fontSize:11,color:C.sub,marginTop:10}}>A customer with several open invoices still gets only this many reminders. Messages over the limit are not sent, and the activity feed says when the next one is allowed.</div>
          {held.length>0&&(
            <div style={{marginTop:12}}>
              <div style={{...label,marginBottom:6}}>Held for quiet hours ({held.length})</div>
              {held.map(h=>(
                <div key={h.msg.id} style={{display:"flex",justifyContent:"space-between",gap:8,fontSize:12,padding:"4px 0"}}>
                  <span>{h.target.name} · {fmtWhen(new Date(h.at))}</span>
                  <button onClick={()=>sendNow(h.msg.id)} style={{...linkBtn,color:"#93C5FD",fontSize:12}}>Send now</button>
                </div>
              ))}
            </div>
          )}
        </div>
        <div style={card}>
          <div style={{...label,marginBottom:8}}>Unsubscribed ({outs.length})</div>
          {!outs.length&&<div style={{fontSize:12.5,color:C.sub,lineHeight:1.5}}>Nobody yet. Every email carries an unsubscribe link (and a List-Unsubscribe header), and replying STOP works too.</div>}
          {outs.map(([key,date])=>{
            const c=contactInfo(key);
            return (
              <div key={key} style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,fontSize:12.5,padding:"5px 0",borderBottom:`1px solid ${C.line}`}}>
                <span>{c?c.name:key}{c&&c.org?` · ${c.org}`:""}<br/><span style={{fontSize:11,color:C.sub}}>{c?c.co.name:""} · since {fmtD(date)}</span></span>
                <button onClick={()=>resubscribe(key)} style={{...sel,fontSize:12,cursor:"pointer"}}>Resubscribe</button>
              </div>
            );
          })}
        </div>
      </div>
    </section>
  );
}

// The page behind the unsubscribe link (/?u=<contact id>), in the installer's branding.
function UnsubscribePage({ info, optedOut, onConfirm, onUndo, onBack }){
  const co=info.co;
  return (
    <div className="lp" style={{minHeight:"100vh",background:"#F6F7F9",display:"grid",placeItems:"center",padding:20}}>
      <main style={{background:"#fff",border:"1px solid #E5E7EB",borderRadius:18,maxWidth:470,width:"100%",padding:"28px 26px",textAlign:"center"}}>
        <div style={{display:"inline-flex",alignItems:"center",gap:8,fontWeight:800,marginBottom:18}}>
          <span aria-hidden="true" style={{width:30,height:30,borderRadius:8,background:co.brand,color:"#fff",display:"grid",placeItems:"center"}}>☀</span>{co.name}
        </div>
        {optedOut ? (
          <>
            <div style={{fontSize:36}} aria-hidden="true">✅</div>
            <h1 style={{fontSize:24,margin:"6px 0 10px"}}>You're unsubscribed</h1>
            <p style={{color:"#374151",lineHeight:1.6,margin:"0 0 10px"}}>{info.name}{info.org?` (${info.org})`:""} won't receive any more emails or WhatsApp messages from {co.name} about {info.about}.</p>
            {info.about==="your invoices"&&<p style={{color:"#6B7280",fontSize:13.5,lineHeight:1.5,margin:"0 0 14px"}}>Open invoices stay due. You can still pay any time from your invoice link.</p>}
            <button className="lp-ghost" onClick={onUndo}>Unsubscribed by mistake? Resubscribe</button>
          </>
        ) : (
          <>
            <h1 style={{fontSize:24,margin:"0 0 10px"}}>Unsubscribe from {co.name}?</h1>
            <p style={{color:"#374151",lineHeight:1.6,margin:"0 0 18px"}}>You'll stop receiving emails and WhatsApp messages about {info.about}. This takes effect immediately.</p>
            <button className="lp-btn" onClick={onConfirm}>Unsubscribe</button>
          </>
        )}
        <p style={{color:"#6B7280",fontSize:12,margin:"18px 0 0"}}>Contact: {info.email} (fictional demo contact)</p>
        {onBack&&<button className="lp-link" style={{marginTop:10}} onClick={onBack}>← Back to the installer app</button>}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
