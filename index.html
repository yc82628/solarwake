// Email is the default channel (many businesses ignore vendor WhatsApps); WhatsApp can be chosen per lead.
const INITIAL_LEADS = CONTACTS.map(l=>({ ...l, channel:"email" }));

// Assumptions for the B2B revenue KPIs (shown in the UI so judges can see them).
const ASSUME = { closeRate:0.35, cpa:{ Residential:180, Commercial:650 } }; // cpa = ad cost of one fresh booked appointment

// Simple, transparent solar economics used by the customer page and the agent's facts.
const ECON = {
  yieldKwh:{ DE:950, CH:1050 },                      // kWh per kWp per year
  Residential:{ price:0.36, feedIn:0.08, selfUse:0.30, selfUseBattery:0.60, battery:5500, rate:0.049 },
  Commercial:{ price:0.25, feedIn:0.07, rate:0.055 },
  co2:0.38, inflation:0.02, degradation:0.005, priceLockDays:14,
};

const eur = n => "€" + Math.round(n).toLocaleString("de-DE");
const now = () => new Date().toLocaleTimeString([], { hour:"2-digit", minute:"2-digit" });
const first = n => n.replace(/^Dr\.\s*/,"").split(" ")[0];
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const coOf = l => COMPANIES.find(c=>c.id===l.co);
const portalUrl = (l,co) => `${co.slug}.solarwake.app/p/${l.id}`;
const fmtYears = p => p==null ? "25+ years" : `${p.toFixed(1)} years`;
const hash = s => { let h=7; for(const ch of s) h=(h*31+ch.charCodeAt(0))%100003; return (h%1000)/1000; };

function solarModel(lead, company, { bill, battery=false, dayUse=0.7 }){
  const biz = lead.seg==="Commercial";
  const e = biz ? ECON.Commercial : ECON.Residential;
  const prod = lead.kw * ECON.yieldKwh[company.country];
  const use = bill*12 / e.price;
  const share = biz ? dayUse : (battery ? e.selfUseBattery : e.selfUse);
  const self = Math.min(prod*share, use*0.9);
  const savings = self*e.price + (prod-self)*e.feedIn;
  const cost = lead.quote + (battery && !biz ? e.battery : 0);
  let net=-cost, payback=null, net20=0, s=savings;
  for(let y=1;y<=25;y++){
    const prev=net; net+=s;
    if(payback===null && net>=0) payback = (y-1) + (-prev)/s;
    if(y===20) net20=net;
    s *= (1+ECON.inflation)*(1-ECON.degradation);
  }
  return { prod, use, self, savings, cost, payback, net20, co2:prod*ECON.co2/1000, billCut:Math.min(1, self*e.price/(bill*12)) };
}
const monthly = (principal, rate, years) => { const r=rate/12, n=years*12; return principal*r/(1-Math.pow(1+r,-n)); };

function nextWeekdays(n){
  const out=[], d=new Date(); d.setHours(0,0,0,0);
  while(out.length<n){ d.setDate(d.getDate()+1); if(d.getDay()!==0&&d.getDay()!==6) out.push(new Date(d)); }
  return out;
}
const dayLabel = d => d.toLocaleDateString("en-GB",{ weekday:"short", day:"numeric", month:"short" });

// ================== PLAYBOOKS (B2C homeowner vs B2B business) × CHANNEL (WhatsApp vs email) ==================
const JSON_RULES = `Reply with ONLY valid JSON, no markdown, no backticks: {"message":"<reply>","status":"contacting|warm|booked","appointment":<null or "Day at Time">}
Use "warm" once interest returns; use "booked" and fill "appointment" ONLY once a specific day/time is agreed. Move toward a booking within a few messages.`;

  const m = solarModel(lead, co, { bill:lead.bill });

- The quoted price is held for ${ECON.priceLockDays} more days.
- Personal page with live numbers, financing and self-booking: ${portalUrl(lead,co)}`;
}

// ================== REPLY TEMPLATES (no paid AI needed) ==================
// The agent reads the lead's reply with keyword rules, answers that objection from the playbook,
// and moves toward a booking from the second reply on. With USE_CLAUDE on, Claude writes replies instead.
function classifyLead(text){
  const t=text.toLowerCase();
  if(/\bbook\b|schedule|when can we (talk|meet)|let'?s (talk|meet)|set up a call|call (me|us)\b|works for (me|us)|sounds good|(monday|tuesday|wednesday|thursday|friday)\b.*\b(works|is fine|ok|good)\b|^(ok|okay|sure|yes)[\s,!.—-]*$/.test(t)) return "book";
  if(/expensive|price|cost|afford|too much/.test(t)) return "price";
  if(/another quote|other quote|competitor|compar|cheaper offer/.test(t)) return "competitor";
  if(/\bcfo\b|sign off|sign-off|board|boss|partner|wife|husband|approv/.test(t)) return "decider";
  if(/cash ?flow|budget|tight/.test(t)) return "cashflow";
  if(/save|saving|bill|\broi\b|payback|numbers|figures/.test(t)) return "numbers";
  if(/timing|later|not now|next year|busy|tricky/.test(t)) return "timing";
  if(/forgot|still interested|still on our list|interested|\byes\b/.test(t)) return "interest";
  return "other";
}

    timing:`No rush at all. Your price is held for ${ECON.priceLockDays} more days, so a quick call now just keeps the option open.`,
    interest:`No worries, it happens! I've re-run your numbers with today's prices: about ${eur(m.savings)} a year in savings. Everything's here: ${link}`,
    decider:"Of course, it's a decision to make together. We can do the call when you're both available, and I'll send the numbers beforehand.",
    cashflow:`Totally fair. With financing there's no big upfront payment, so you can start saving straight away: ${link}`,
    other:`Thanks for getting back to me! Your updated numbers, with financing options, are here: ${link}`,
  };
  return A[intent];
}

const slotAsk = l => l.seg==="Commercial"
  ? "Would a 20-minute call with you and your CFO work on Tuesday at 10:00 or Wednesday at 14:00?"
  : "Shall I book you a free 15-minute call with an advisor, Thursday at 18:00 or Friday at 10:00?";
function pickSlot(l, text){
  const t=text.toLowerCase();
  if(l.seg==="Commercial") return /wednesday|14/.test(t)?"Wednesday 14:00":"Tuesday 10:00";
  return /friday|morning|\b10\b/.test(t)?"Friday 10:00":"Thursday 18:00";
}

  let body, status="warm", appointment=null, ask=false;
  if(intent==="book"){
    appointment=pickSlot(l,last); status="booked";

function fmtDate(s, fmt){

const PRESETS = [["week","This week"],["month","This month"],["lastMonth","Last month"],["quarter","This quarter"],["lastQuarter","Last quarter"],
  ["fy","This financial year"],["lastFy","Last financial year"],["last30","Last 30 days"],["last12","Last 12 months"]];
function presetRange(key, s){
  const t=today0(), y=t.getFullYear(), m=t.getMonth();
  const fyY = m>=s.fyStart ? y : y-1;
  const qIndex=Math.floor(((m-s.fyStart+12)%12)/3);
  const qFrom=new Date(fyY, s.fyStart+qIndex*3, 1);
  switch(key){
    case "week": { const d=new Date(t); d.setDate(d.getDate()-((t.getDay()-s.weekStart+7)%7)); return [d,t]; }
    case "month": return [new Date(y,m,1), t];
    case "lastMonth": return [new Date(y,m-1,1), new Date(y,m,0)];
    case "quarter": return [qFrom, t];
    case "lastQuarter": return [new Date(qFrom.getFullYear(), qFrom.getMonth()-3, 1), new Date(qFrom.getFullYear(), qFrom.getMonth(), 0)];
    case "fy": return [new Date(fyY, s.fyStart, 1), t];
    case "lastFy": return [new Date(fyY-1, s.fyStart, 1), new Date(fyY, s.fyStart, 0)];
    case "last30": return [daysFrom(-29), t];
    default: return [daysFrom(-364), t];
  }
}

const SEED_ACTIVITY = [
  { t:now(), text:"🧠 Playbooks loaded: Homeowner (B2C) · Business (B2B)", kind:"sys" },
  { t:now(), text:`🔌 CRM sync complete — ${CONTACTS.length} leads across ${COMPANIES.length} installers`, kind:"sys" },
];

// A link in a real email opens the right page directly: /?p=C-1006 (quote page) or /?i=INV-2026-0102 (pay page).
const QS = (()=>{ try{ return new URLSearchParams(location.search); }catch{ return new URLSearchParams(); } })();
const DEEP_LEAD = CONTACTS.some(c=>c.id===QS.get("p")) ? QS.get("p") : null;
const DEEP_INV = INITIAL_INVOICES.some(i=>i.id===QS.get("i")) ? QS.get("i") : null;
const START_LEAD = CONTACTS.find(c=>c.id===(DEEP_LEAD||FIRST_LEAD));
const START_CO = DEEP_INV ? INITIAL_INVOICES.find(i=>i.id===DEEP_INV).co : START_LEAD.co;
let msgSeq=0;
const msgId = () => ++msgSeq;
// In real emails, in-app page links become links to the deployed site.
const realLinks = text => text.replace(/\S*solarwake\.app\/([pi])\/([A-Za-z0-9-]+)/g, (_,k,id)=>`${location.origin}/?${k}=${id}`);
const firstOpenInvoice = (invoices, co) => (invoices.filter(i=>i.co===co&&!i.paid).sort((a,b)=>invDays(b)-invDays(a))[0] || invoices.find(i=>i.co===co) || {}).id;

const TABS = [
  { id:"console",  t:"Leads",         s:"B2B · quote reactivation" },
  { id:"invoices", t:"Invoices",      s:"B2B · payment reminders" },
  { id:"ledger",   t:"Transactions",  s:"For your accountant" },
  { id:"portal",   t:"Customer Page", s:"B2C · quote & savings" },
  { id:"pay",      t:"Pay Page",      s:"B2C · invoice payment" },
];
const startPage = () => (location.hash.startsWith("#app")||DEEP_LEAD||DEEP_INV) ? "app" : "landing";
const loadLang = () => { try{ return localStorage.getItem("sw-lang")==="de"?"de":"en"; }catch{ return "en"; } };

function App(){
  const [page,setPage]=useState(startPage);
  const [lang,setLangState]=useState(loadLang);
  const [tab,setTab]=useState(DEEP_INV?"pay":DEEP_LEAD?"portal":"console");
  const [leads,setLeads]=useState(INITIAL_LEADS);
  const [companyId,setCompanyId]=useState(START_CO);
  const [invoices,setInvoices]=useState(INITIAL_INVOICES);
  const [invConvos,setInvConvos]=useState({});   // invoiceId -> [{role,text,time,...}]
  const [invId,setInvId]=useState(DEEP_INV||firstOpenInvoice(INITIAL_INVOICES,START_CO));
  const [invTyping,setInvTyping]=useState(null);
  const [ladder,setLadder]=useState(LADDER.map(s=>({ ...s, on:true })));
  const [txns,setTxns]=useState(INITIAL_TXNS);
  const [segFilter,setSegFilter]=useState("All");
  const [leadId,setLeadId]=useState(START_LEAD.id);
  const [convos,setConvos]=useState({});   // leadId -> [{role,text,time}]
  const [briefs,setBriefs]=useState({});   // leadId -> brief | "loading"
  const [activity,setActivity]=useState(SEED_ACTIVITY);
  const [typingId,setTypingId]=useState(null);
  const [input,setInput]=useState("");
  const [toast,setToast]=useState(null);
  const [demoMode,setDemoMode]=useState(false);
  const [campaign,setCampaign]=useState(false);
  const [emailCfg,setEmailCfg]=useState({ enabled:false, inbox:null });
  const mailQueue=useRef(Promise.resolve());
  const busy=useRef(new Set());
  const timers=useRef([]);
  const scrollRef=useRef(null);

  const company=COMPANIES.find(c=>c.id===companyId);
  const companyLeads=leads.filter(l=>l.co===companyId);
  const visibleLeads=companyLeads.filter(l=>segFilter==="All"||l.seg===segFilter);
  const lead=leads.find(l=>l.id===leadId)||companyLeads[0];
  const messages=(lead&&convos[lead.id])||[];
  const started=messages.length>0;
  const typing=lead&&typingId===lead.id;
  const pb=lead?PLAYBOOKS[lead.seg]:PLAYBOOKS.Residential;

  const kpi=useMemo(()=>{
    const v=visibleLeads, booked=v.filter(l=>l.status==="Booked");
    const contacted=v.filter(l=>l.status!=="Cold"), replied=v.filter(l=>l.status==="Warm"||l.status==="Booked");
    return {
      pipeline:v.filter(l=>l.status!=="Booked").reduce((s,l)=>s+l.quote,0),
      dormant:v.filter(l=>l.status!=="Booked").length,
      contacted:contacted.length, replied:replied.length,
      replyRate:contacted.length?Math.round(100*replied.length/contacted.length):0,
      booked:booked.length,
      adSaved:booked.reduce((s,l)=>s+ASSUME.cpa[l.seg],0),
      revenue:booked.reduce((s,l)=>s+l.quote,0)*ASSUME.closeRate,
      funnel:["Cold","Contacting","Warm","Booked"].map(s=>({ s, n:v.filter(l=>l.status===s).length })),
    };
  },[leads,companyId,segFilter]);

  useEffect(()=>{ if(scrollRef.current) scrollRef.current.scrollTop=scrollRef.current.scrollHeight; },[messages.length,typing]);
  useEffect(()=>()=>timers.current.forEach(clearTimeout),[]);
  useEffect(()=>{ fetch("/api/email").then(r=>r.json()).then(d=>setEmailCfg({ enabled:!!d.enabled, inbox:d.inbox||null })).catch(()=>{}); },[]);
  useEffect(()=>{
    const onHash=()=>setPage(location.hash.startsWith("#app")?"app":"landing");
    window.addEventListener("hashchange",onHash); return ()=>window.removeEventListener("hashchange",onHash);
  },[]);
  useEffect(()=>{ document.body.style.background=page==="landing"?"#fff":C.night; document.documentElement.lang=page==="landing"?lang:"en"; },[page,lang]);

  const setLang=l=>{ setLangState(l); try{ localStorage.setItem("sw-lang",l); }catch{} };
  function openApp(t){ setTab(t||"console"); setPage("app"); if(location.hash!=="#app") location.hash="app"; window.scrollTo(0,0); }
  function goHome(){ setPage("landing"); history.replaceState(null,"",location.pathname); window.scrollTo(0,0); }

  // When the open lead's last message is from the customer, the agent answers it.
  useEffect(()=>{
    if(!lead||lead.status==="Booked") return;
    const m=convos[lead.id]||[];
    if(m.length && m[m.length-1].role==="customer") agentReply(lead, m);
  },[leadId, convos]);

  const later=(fn,ms)=>timers.current.push(setTimeout(fn,ms));
  const log=(text,kind="sys")=>setActivity(a=>[{ t:now(), text, kind }, ...a].slice(0,50));
  const flash=(text,color=C.green)=>{ setToast({text,color}); later(()=>setToast(null),4200); };
  const setConvo=(id,fn)=>setConvos(c=>({ ...c, [id]:fn(c[id]||[]) }));
  const setLeadStatus=(id,status,extra={})=>setLeads(ls=>ls.map(l=>l.id!==id||l.status==="Booked"?l:{ ...l, status, ...extra }));

  function pickLead(id){ setLeadId(id); setInput(""); }
  function pickCompany(id){
    setCompanyId(id);
    // Prefer a cold business lead, then any cold lead.
    const rank=l=>(l.status==="Cold"?0:2)+(l.seg==="Commercial"?0:1);
    const f=leads.filter(l=>l.co===id).sort((a,b)=>rank(a)-rank(b))[0];
    if(f) pickLead(f.id);
  }
  function openPortal(id){
    if(id.startsWith("INV-")){ const i=invoices.find(x=>x.id===id); if(i){ setCompanyId(i.co); setInvId(id); } setTab("pay"); return; }
    const l=leads.find(x=>x.id===id); if(l){ setCompanyId(l.co); setLeadId(id); } setTab("portal");
  }

  function setChannel(id,channel){ setLeads(ls=>ls.map(l=>l.id===id?{ ...l, channel }:l)); }
  const openerMsg=l=>{ const o=PLAYBOOKS[l.seg].opener[l.channel](l,coOf(l)); return { id:msgId(), role:"agent", text:o.text, subject:o.subject, time:now() }; };
  const sentLog=l=>`${CHANNELS[l.channel].icon} ${PLAYBOOKS[l.seg].tag} ${l.channel==="email"?"email":"WhatsApp opener"} sent to ${l.name}`;

  // Live email: the agent's emails go out through /api/email (Resend). Leads only have dummy addresses and the
  // server redirects every email to the test inbox. Sends are spaced out to stay under Resend's rate limit.
  function deliver(l, msg){
    if(l.channel!=="email") return;
    mailOut({ to:l.email, subject:msg.subject, text:msg.text, fromName:`Lina · ${coOf(l).name}` }, l.name,
      d=>setConvo(l.id,ms=>ms.map(m=>m.id===msg.id?{ ...m, delivery:d }:m)));
  }
  function mailOut(payload, who, mark){
    if(demoMode||!emailCfg.enabled){ mark({ state:"off", note:demoMode?"Demo mode: not sent":"Live email off: shown in the app only" }); return; }
    mark({ state:"sending" });
    const job=mailQueue.current.then(async()=>{
      const res=await fetch("/api/email",{ method:"POST", headers:{"content-type":"application/json"},
        body:JSON.stringify({ ...payload, text:realLinks(payload.text) }) });
      const data=await res.json().catch(()=>({}));
      if(!res.ok) throw new Error(data.error||`HTTP ${res.status}`);
      return data;
    });
    mailQueue.current=job.catch(()=>{}).then(()=>sleep(600));
    job.then(()=>{ mark({ state:"sent" }); log(`📨 Real email delivered to the test inbox (${who})`,"out"); })
       .catch(e=>{ mark({ state:"error", note:e.message }); log(`⚠ Email for ${who} not sent: ${e.message}`,"sys"); });
  }

  // ---------- Invoices: payment reminders, smart replies, payments ----------
  const setInvConvo=(id,fn)=>setInvConvos(c=>({ ...c, [id]:fn(c[id]||[]) }));
  const patchInv=(id,patch)=>setInvoices(v=>v.map(i=>i.id===id?{ ...i, ...patch }:i));
  const deliverInv=(inv,msg)=>mailOut({ to:inv.email, subject:msg.subject, text:msg.text, fromName:`${coOf(inv).name} Billing` }, inv.name,
    d=>setInvConvo(inv.id,ms=>ms.map(m=>m.id===msg.id?{ ...m, delivery:d }:m)));
  const addTxn=t=>setTxns(v=>[{ id:`TX-L${Date.now()}${Math.floor(Math.random()*1000)}`, date:ymd(today0()), ...t }, ...v]);

  async function sendReminder(inv, step){
    if(busy.current.has(inv.id)) return;
    step=step||ladderStep(inv,ladder)||ladder[0];
    busy.current.add(inv.id); setInvTyping(inv.id);
    const co=coOf(inv);
    let text;
    if(!USE_CLAUDE||demoMode){ await sleep(700); text=reminderScript(inv,co,step); }
    else{
      try{ text=parseBilling(await callClaude(billingSystem(inv,co,step),[{ role:"user", content:`(Write the "${step.name}" email for this invoice now.)` }])).message; }
      catch{ text=reminderScript(inv,co,step); }
    }
    const msg={ id:msgId(), role:"agent", text, subject:reminderSubject(inv,step), time:now(), step:step.name };
    setInvConvo(inv.id,m=>[...m,msg]);
    deliverInv(inv,msg);
    setInvoices(v=>v.map(i=>i.id===inv.id?{ ...i, sent:[...i.sent,{ key:step.key, date:ymd(today0()) }] }:i));
    log(`📨 ${step.name} sent for ${inv.id} (${inv.name})`,"out");
    setInvTyping(t=>t===inv.id?null:t); busy.current.delete(inv.id);
  }

  function sendDueReminders(list){
    if(!list.length){ flash("No reminders are due right now",C.panel2); return; }
    log(`🚀 Sending ${list.length} due reminder${list.length>1?"s":""}`,"sys");
    list.forEach((inv,k)=>later(()=>sendReminder(inv),k*900));
  }

  function invCustomerSend(inv, text){
    const prev=invConvos[inv.id]||[];
    if(busy.current.has(inv.id)||!prev.length) return;
    const cm={ id:msgId(), role:"customer", text:text.trim(), subject:prev[0].subject?`Re: ${prev[0].subject}`:undefined, time:now() };
    const history=[...prev,cm];
    setInvConvo(inv.id,()=>history);
    invAgentReply(inv,history);
  }

  async function invAgentReply(inv, history){
    busy.current.add(inv.id); setInvTyping(inv.id);
    const co=coOf(inv);
    let intent=classifyReply(history[history.length-1].text), text, promise=null;
    if(!USE_CLAUDE||demoMode){ await sleep(800); text=replyScript(inv,co,intent); }
    else{
      try{
        const msgs=[{ role:"user", content:"(Billing thread opened. You sent the first email below.)" },
          ...history.map(m=>({ role:m.role==="agent"?"assistant":"user", content:m.text }))];
        const r=parseBilling(await callClaude(billingSystem(inv,co,ladderStep(inv,ladder)), msgs));
        text=r.message; promise=r.promise_date||null;
        if(Object.prototype.hasOwnProperty.call(INTENT_FLAG,r.intent)) intent=r.intent;
      }catch{ text=replyScript(inv,co,intent); }
    }
    const msg={ id:msgId(), role:"agent", text, subject:history[0].subject?`Re: ${history[0].subject}`:undefined, time:now() };
    setInvConvo(inv.id,()=>[...history,msg]);
    deliverInv(inv,msg);
    const flag=intent==="promise"?`Payment promised${promise?`: ${promise}`:""}`:INTENT_FLAG[intent];
    if(flag) patchInv(inv.id,{ flag });
    log(`💬 ${inv.name} replied on ${inv.id}${flag?` → ${flag}`:""}`,"in");
    setInvTyping(t=>t===inv.id?null:t); busy.current.delete(inv.id);
  }

  function markInvoicePaid(inv, method, via){
    if(inv.paid) return;
    patchInv(inv.id,{ paid:ymd(today0()), method, flag:null });
    addTxn({ co:inv.co, party:inv.name, seg:inv.seg, type:"Payment received", dir:"in", amount:inv.amount, method, ref:inv.id, doc:`Payment-${inv.id}.pdf`, account:"Bank" });
    flash(`✓ ${inv.id} paid — ${eur(inv.amount)}`);
    log(`💶 ${inv.name} paid ${inv.id} (${eur(inv.amount)}) ${via}`,"win");
  }
  function startInstalments(inv){
    const part=Math.round(inv.amount/3);
    patchInv(inv.id,{ flag:"Instalment plan: 1 of 3 paid" });
    addTxn({ co:inv.co, party:inv.name, seg:inv.seg, type:"Instalment received", dir:"in", amount:part, method:"Card", ref:inv.id, doc:`Instalment-1-${inv.id}.pdf`, account:"Bank" });
    flash(`✓ Instalment plan started for ${inv.id} — ${eur(part)} paid`);
    log(`💶 ${inv.name} started a 3-month plan on ${inv.id} (${eur(part)} paid)`,"win");
  }
  function reportProblem(inv){
    patchInv(inv.id,{ flag:"Disputed: reminders paused" });
    flash(`Reminders paused for ${inv.id}; service team notified`,C.panel2);
    log(`⚠ ${inv.name} reported a problem on ${inv.id}: reminders paused, service team notified`,"in");
  }

  function start(){
    if(started||!lead) return;
    const msg=openerMsg(lead);
    setConvo(lead.id,()=>[msg]);
    deliver(lead, msg);
    if(lead.status==="Cold") setLeadStatus(lead.id,"Contacting");
    log(sentLog(lead),"out");
  }

  function send(text){
    const clean=(text||"").trim(); if(!clean||typing||!started||!lead) return;
    setInput("");
    setConvo(lead.id,m=>[...m,{ id:msgId(), role:"customer", text:clean, time:now() }]);
  }

  async function agentReply(l, history){
    if(busy.current.has(l.id)) return;
    busy.current.add(l.id);
    const co=coOf(l), play=PLAYBOOKS[l.seg];
    setTypingId(l.id);
    let reply=null;
    if(USE_CLAUDE&&!demoMode){
      try{ reply=parseAgent(await callClaude(play.system(l,co,l.channel), toApi(history))); }catch{ reply=null; }
    }
    if(!reply){ await sleep(900); reply=leadReply(l,co,history); }
    const subject=history[0].subject?`Re: ${history[0].subject}`:undefined;
    const msg={ id:msgId(), role:"agent", text:reply.message, subject, time:now() };
    const full=[...history,msg];
    setConvo(l.id,()=>full);
    deliver(l, msg);
    setTypingId(t=>t===l.id?null:t);
    busy.current.delete(l.id);
    if(reply.status==="booked"&&reply.appointment) markBooked(l, reply.appointment, `via the ${l.channel==="email"?"email":"WhatsApp"} agent`, full);
    else if(reply.status==="warm") setLeadStatus(l.id,"Warm");
  }

  function markBooked(l, appointment, via, history){
    setLeadStatus(l.id,"Booked",{ appointment, via });
    flash(`✓ ${l.name} booked — ${appointment} 🎉`);
    log(`📅 ${l.name} booked ${appointment} ${via}`,"win");
    makeBrief(l, history, via);
  }

  async function makeBrief(l, history, via){
    const co=coOf(l);
    setBriefs(b=>({ ...b, [l.id]:"loading" }));
    let brief;
    try{
      if(!USE_CLAUDE||demoMode||!history.length) throw new Error("templates");
      const transcript=history.map(m=>`${m.role==="agent"?"Agent":"Lead"}: ${m.text}`).join("\n");
      const raw=await callClaude(BRIEF_SYSTEM,[{ role:"user", content:`Lead: ${l.name} (${l.seg}, ${l.kw} kW, quote ${eur(l.quote)}, stalled on "${l.lost}"${l.dm?`, decision-maker ${l.dm}`:""}). Booked ${via}.\n\nTranscript:\n${transcript}` }]);
      const t=raw.slice(raw.indexOf("{"), raw.lastIndexOf("}")+1);
      brief={ ...JSON.parse(t), ai:true };
    }catch{ brief=heuristicBrief(l, co, history, via); }
    setBriefs(b=>({ ...b, [l.id]:brief }));
    log(`📋 Advisor brief for ${l.name} pushed to CRM`,"sys");
  }

  // Bulk reactivation across every cold lead in the current view (replies are simulated).
  function runCampaign(){
    const targets=visibleLeads.filter(l=>l.status==="Cold");
    if(campaign) return;
    if(!targets.length){ flash("No cold leads left in this view",C.panel2); return; }
    setCampaign(true);
    log(`🚀 Campaign launched — ${targets.length} dormant lead${targets.length>1?"s":""} at ${company.name} (${segFilter==="All"?"B2C + B2B":PLAYBOOKS[segFilter].tag})`,"sys");
    let last=0;
    targets.forEach((l,i)=>{
      const play=PLAYBOOKS[l.seg];
      later(()=>{
        const msg=openerMsg(l);
        setConvo(l.id,m=>m.length?m:[msg]);
        deliver(l, msg);
        setLeadStatus(l.id,"Contacting");
        log(sentLog(l),"out");
      }, 400+i*450);
      if(hash(l.id)<0.6){
        const reply=play.replies[Math.floor(hash(l.id+"r")*play.replies.length)];
        const at=2600+i*700; last=Math.max(last,at);
        later(()=>{
          setConvo(l.id,m=>[...m,{ id:msgId(), role:"customer", text:reply, subject:m[0]&&m[0].subject?`Re: ${m[0].subject}`:undefined, time:now() }]);
          setLeadStatus(l.id,"Warm");
          log(`💬 ${l.name}: "${reply}"`,"in");
        }, at);
      }
    });
    later(()=>{ setCampaign(false); log("✅ Campaign wave sent — open a warm lead to watch the agent pick it up","sys"); }, Math.max(last, 400+targets.length*450)+600);
  }

  function bookFromPortal(l, slot){
    markBooked(l, slot, "via the customer page", convos[l.id]||[]);
  }

  function reset(){
    timers.current.forEach(clearTimeout); timers.current=[]; busy.current.clear();
    setLeads(INITIAL_LEADS); setConvos({}); setBriefs({}); setActivity(SEED_ACTIVITY);
    setTypingId(null); setCampaign(false); setInput(""); setToast(null);
    setSegFilter("All"); setCompanyId("SW-001"); setLeadId(FIRST_LEAD);
    setInvoices(INITIAL_INVOICES); setInvConvos({}); setTxns(INITIAL_TXNS); setInvTyping(null);
    setLadder(LADDER.map(s=>({ ...s, on:true }))); setInvId(firstOpenInvoice(INITIAL_INVOICES,"SW-001"));
  }

  const inv=invoices.find(i=>i.id===invId&&i.co===companyId)||invoices.find(i=>i.id===firstOpenInvoice(invoices,companyId));
  if(page==="landing") return <Landing lang={lang} setLang={setLang} openApp={openApp}/>;

  const sMeta={ Cold:{label:"Cold · dormant",color:C.sub,bg:"#1E2A44"},
    Contacting:{label:"Contacting…",color:C.goldSoft,bg:"#3A2E12"},
    Warm:{label:"Warm · engaged",color:C.gold,bg:"#3A2E12"},
    Booked:{label:"Appointment booked",color:"#BBF7D0",bg:"#0F3D22"} }[lead?lead.status:"Cold"];

  return (
    <div className="sw-app" style={{minHeight:"100vh",color:C.text}}>
      <div style={{maxWidth:1200,margin:"0 auto",padding:"20px 16px 34px"}}>
        {/* Header */}
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:12,marginBottom:14}}>
          <button onClick={goHome} title="Back to the SolarWake homepage" style={{display:"flex",alignItems:"center",gap:12,background:"none",border:"none",color:C.text,cursor:"pointer",textAlign:"left",padding:0}}>
            <div style={{width:42,height:42,borderRadius:12,background:C.gold,display:"grid",placeItems:"center",boxShadow:`0 0 22px ${C.gold}55`,fontSize:22}}>☀️</div>
            <div>
              <div style={{fontSize:22,fontWeight:800,letterSpacing:-0.4}}>Solar<span style={{color:C.gold}}>Wake</span></div>
              <div style={{fontSize:12.5,color:C.sub,marginTop:-2}}>Recover the revenue you've already earned · ← homepage</div>
            </div>
          </button>
          <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
            <button onClick={()=>setDemoMode(d=>!d)} title="Rehearsal mode never sends real emails. Use it to practise the demo."
              style={{display:"inline-flex",alignItems:"center",gap:7,fontSize:12,fontWeight:700,cursor:"pointer",
                color:demoMode?C.night:C.sub,background:demoMode?C.gold:C.panel,border:`1px solid ${demoMode?C.gold:C.line}`,padding:"7px 12px",borderRadius:999}}>
              <span style={{width:7,height:7,borderRadius:999,background:demoMode?C.night:C.green}}/> {demoMode?"Rehearsal: nothing sent":"Live mode"}
            </button>
            <div title={USE_CLAUDE?"Messages are written by Claude, with templates as a fallback":"Messages come from built-in templates; replies are understood with keyword rules. No paid AI needed."}
              style={{display:"flex",alignItems:"center",gap:7,fontSize:12,color:C.sub,background:C.panel,border:`1px solid ${C.line}`,padding:"7px 12px",borderRadius:999}}>
              <span style={{width:7,height:7,borderRadius:999,background:C.gold,boxShadow:`0 0 7px ${C.gold}`}}/> {USE_CLAUDE?"Powered by Claude · Anthropic API":"Smart templates · rule-based replies"}
            </div>
            <div title={emailCfg.enabled?"Agent emails are really sent, redirected to this test inbox (leads are fictional)":"Set RESEND_API_KEY to send real emails"}
              style={{display:"flex",alignItems:"center",gap:7,fontSize:12,color:emailCfg.enabled?"#BBF7D0":C.sub,background:C.panel,border:`1px solid ${emailCfg.enabled?C.green:C.line}`,padding:"7px 12px",borderRadius:999}}>
              ✉️ {emailCfg.enabled?`Live email → ${emailCfg.inbox}`:"Email: in-app only"}
            </div>
          </div>
        </div>

        {/* Tabs */}
        <div role="tablist" aria-label="SolarWake sections" style={{display:"flex",gap:8,marginBottom:16,flexWrap:"wrap"}}>
          {TABS.map(x=>{
            const on=tab===x.id;
            return (
              <button key={x.id} role="tab" aria-selected={on} onClick={()=>setTab(x.id)} style={{textAlign:"left",cursor:"pointer",background:on?C.panel2:"transparent",
                border:`1px solid ${on?C.gold:C.line}`,borderRadius:12,padding:"9px 16px",color:on?C.text:C.sub}}>

// Email channel: an inbox-style thread. You reply as the business; the agent answers by email.
function EmailPane({ lead, messages, started, typing, pb, start, send, openPortal }){
  const co=coOf(lead), biz=lead.seg==="Commercial";
  const [draft,setDraft]=useState("");
  const ref=useRef(null);
  useEffect(()=>{ if(ref.current) ref.current.scrollTop=ref.current.scrollHeight; },[messages.length,typing]);
  const contact=biz&&lead.dm?dmName(lead):lead.name;
  const subject=messages[0]&&messages[0].subject;
  const canReply=started&&!typing&&lead.status!=="Booked";
  const submit=t=>{ if(!canReply||!(t||"").trim()) return; send(t); setDraft(""); };
  const ink="#1F2937", muted="#6B7280", line="#E5E7EB";

  return (
    <div style={{background:"#fff",borderRadius:16,overflow:"hidden",display:"flex",flexDirection:"column",height:656,boxShadow:"0 20px 50px rgba(0,0,0,.5)",color:ink}}>
      <div style={{background:"#1E3A8A",color:"#fff",padding:"11px 14px",display:"flex",alignItems:"center",gap:10}}>
        <span style={{fontSize:18}}>✉️</span>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontWeight:700,fontSize:14}}>Inbox · {agentEmail(co)}</div>
          <div style={{fontSize:11.5,opacity:.85,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{typing?"Lina is drafting a reply…":`Thread with ${contact} <${lead.email}> · fictional test contact`}</div>
        </div>
      </div>
      {subject&&<div style={{padding:"10px 14px",borderBottom:`1px solid ${line}`,fontWeight:800,fontSize:14.5}}>{subject}</div>}

      <div ref={ref} style={{flex:1,overflowY:"auto",padding:12,display:"flex",flexDirection:"column",gap:10,background:"#F3F4F6"}}>
        {!started&&(
          <div style={{margin:"auto",textAlign:"center",color:muted,maxWidth:270}}>
            {lead.status==="Booked" ? (
              <div style={{fontSize:13,lineHeight:1.5}}>✅ {lead.name} booked <b>{lead.appointment}</b> {lead.via||""}. No email needed.</div>
            ) : (
              <>
                <div style={{fontSize:13,marginBottom:14,lineHeight:1.5}}>
                  {biz?"Many businesses ignore vendor WhatsApps, so ":""}SolarWake will reach <b>{contact}</b> by email using the <b>{pb.label.toLowerCase()}</b>.
                </div>
                <button onClick={start} style={{background:"#1E3A8A",color:"#fff",border:"none",padding:"11px 20px",borderRadius:999,fontWeight:700,fontSize:14,cursor:"pointer"}}>✉️ Send reactivation email</button>
              </>
            )}
          </div>
        )}
        {messages.map((m,i)=>{
          const mine=m.role==="customer";
          return (
            <div key={i} className="sw-in" style={{background:"#fff",border:`1px solid ${line}`,borderLeft:`3px solid ${mine?"#9CA3AF":"#1E3A8A"}`,borderRadius:10,padding:"10px 12px"}}>
              <div style={{display:"flex",justifyContent:"space-between",gap:8,fontSize:12,marginBottom:2}}>
                <b style={{whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{mine?contact:`Lina · ${co.name}`}</b>

            ))}

          <div style={{display:"flex",gap:8,alignItems:"flex-end"}}>
            <textarea value={draft} onChange={e=>setDraft(e.target.value)} disabled={!canReply} rows={2}

              placeholder={`Write a reply as ${contact}… (Ctrl+Enter to send)`}
              style={{flex:1,resize:"none",border:`1px solid ${line}`,borderRadius:10,padding:"8px 10px",fontSize:13.5,fontFamily:"inherit",outline:"none",color:ink}}/>

          </div>
        </div>
      )}
    </div>
  );
}

function Slider({label:l, value, set, min, max, step=1, fmt, dark=true}){
  return (
    <label style={{display:"block",marginBottom:12}}>
      <div style={{display:"flex",justifyContent:"space-between",fontSize:12.5,marginBottom:4}}>
        <span style={{color:dark?C.sub:C.pSub}}>{l}</span><b style={{color:dark?C.text:C.pInk}}>{fmt?fmt(value):value}</b>
      </div>
      <input type="range" min={min} max={max} step={step} value={value} onChange={e=>set(Number(e.target.value))}/>
    </label>
  );
}

// Sales tool for pitching SolarWake to an installer: "what is your dead pipeline worth?"

      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginTop:4}}>

          <div key={k} style={{background:C.panel2,borderRadius:11,padding:"10px 11px"}}>

      </div>
    </div>
  );
}

function RangeCalendar({ from, to, onPick, weekStart, counts }){
  const [view,setView]=useState(()=>{ const d=parseYmd(to); return new Date(d.getFullYear(), d.getMonth(), 1); });
  const [pending,setPending]=useState(null);
  useEffect(()=>{ if(!pending){ const d=parseYmd(to); setView(new Date(d.getFullYear(), d.getMonth(), 1)); } },[to]);
  const y=view.getFullYear(), m=view.getMonth();
  const lead=(new Date(y,m,1).getDay()-weekStart+7)%7, days=new Date(y,m+1,0).getDate();
  const cells=[...Array(lead).fill(null), ...Array.from({ length:days },(_,i)=>new Date(y,m,i+1))];
  const names=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], head=[...names.slice(weekStart),...names.slice(0,weekStart)];
  const todayS=ymd(today0());
  const pick=d=>{ const s=ymd(d); if(!pending){ setPending(s); onPick(s,s); } else { const [a,b]=pending<=s?[pending,s]:[s,pending]; onPick(a,b); setPending(null); } };
  const nav=k=>setView(new Date(y,m+k,1));
  const navBtn={ background:C.panel2, color:C.text, border:`1px solid ${C.line}`, borderRadius:8, width:30, height:30, cursor:"pointer", fontSize:15 };
  return (
    <div style={{background:C.night,border:`1px solid ${C.line}`,borderRadius:12,padding:12,width:"100%",maxWidth:330}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
        <button onClick={()=>nav(-1)} aria-label="Previous month" style={navBtn}>‹</button>
        <b style={{fontSize:13.5}} aria-live="polite">{MONTHS[m]} {y}</b>
        <button onClick={()=>nav(1)} aria-label="Next month" style={navBtn}>›</button>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3,textAlign:"center"}}>
        {head.map(h=><div key={h} style={{fontSize:10.5,color:C.sub,fontWeight:700,padding:"2px 0"}}>{h}</div>)}
        {cells.map((d,i)=>{
          if(!d) return <div key={`e${i}`}/>;
          const s=ymd(d), inR=s>=from&&s<=to, edge=s===from||s===to, n=counts[s]||0;
          return (
            <button key={s} onClick={()=>pick(d)} aria-pressed={inR} aria-label={`${d.getDate()} ${MONTHS[m]} ${y}${n?`, ${n} transaction${n>1?"s":""}`:""}`}
              style={{position:"relative",height:32,borderRadius:7,cursor:"pointer",fontSize:12.5,fontWeight:edge?800:500,
                border:s===todayS?`1px solid ${C.gold}`:"1px solid transparent",
                background:edge?C.gold:inR?"#3A2E12":"transparent",color:edge?C.night:s>todayS?"#55627c":C.text}}>
              {d.getDate()}
              {n>0&&<span style={{position:"absolute",bottom:3,left:"50%",transform:"translateX(-50%)",width:4,height:4,borderRadius:99,background:edge?C.night:"#7DD3FC"}}/>}
            </button>
          );
        })}
      </div>
      <div style={{fontSize:11,color:C.sub,marginTop:8}}>{pending?"Now pick the end date.":"Click a start date, then an end date. Dots mark days with transactions."}</div>
    </div>
  );
}

function exportCsv(rows, from, to, fmt){
  const head=["Date","Reference","Installer","Party","Segment","Type","Amount (EUR)","Method","Account","Document"];
  const esc=v=>`"${String(v==null?"":v).replace(/"/g,'""')}"`;
  const lines=[head, ...rows.map(r=>[fmtDate(r.date,fmt), r.ref, COMPANIES.find(c=>c.id===r.co).name, r.party, r.seg, r.type,
    (r.dir==="out"?-r.amount:r.amount).toFixed(2), r.method, r.account, r.doc||"MISSING"])].map(l=>l.map(esc).join(","));
  const blob=new Blob(["﻿"+lines.join("\r\n")],{ type:"text/csv;charset=utf-8" });
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=`solarwake-transactions_${from}_to_${to}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

          <div className="sw-in" style={{display:"flex",gap:14,flexWrap:"wrap",background:C.night,border:`1px solid ${C.line}`,borderRadius:12,padding:12,marginBottom:10}}>
            <label style={{fontSize:12,color:C.sub}}>Financial year starts in<br/>
              <select value={cal.fyStart} onChange={e=>setCal(c=>({ ...c, fyStart:Number(e.target.value) }))} style={{...sel,marginTop:4}}>{MONTHS.map((n,i)=><option key={n} value={i}>{n}</option>)}</select>
            </label>
            <label style={{fontSize:12,color:C.sub}}>Week starts on<br/>
              <select value={cal.weekStart} onChange={e=>setCal(c=>({ ...c, weekStart:Number(e.target.value) }))} style={{...sel,marginTop:4}}><option value={1}>Monday</option><option value={0}>Sunday</option></select>
            </label>
            <label style={{fontSize:12,color:C.sub}}>Date format<br/>
              <select value={cal.fmt} onChange={e=>setCal(c=>({ ...c, fmt:e.target.value }))} style={{...sel,marginTop:4}}>
                <option value="DMY">31.12.2026</option><option value="ISO">2026-12-31</option><option value="MDY">12/31/2026</option>
              </select>
            </label>
            <div style={{fontSize:11.5,color:C.sub,alignSelf:"flex-end",maxWidth:260}}>Quarters and financial years follow your year start. Saved in this browser.</div>
          </div>
        )}
        <div style={{display:"flex",gap:14,flexWrap:"wrap",alignItems:"flex-start"}}>
          <RangeCalendar from={from} to={to} onPick={setCustom} weekStart={cal.weekStart} counts={counts}/>
          <div style={{flex:"1 1 300px"}}>
            <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:12}} role="group" aria-label="Quick periods">
              {PRESETS.map(([k,t])=>{
                const on=preset===k;
                return <button key={k} onClick={()=>applyPreset(k)} aria-pressed={on} style={{fontSize:12,fontWeight:700,cursor:"pointer",padding:"6px 11px",borderRadius:999,
                  background:on?C.gold:C.panel2,color:on?C.night:C.sub,border:`1px solid ${on?C.gold:C.line}`}}>{t}</button>;
              })}
            </div>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              <select aria-label="Installer" value={co} onChange={e=>setCo(e.target.value)} style={sel}><option value="All">All installers</option>{COMPANIES.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select>
              <select aria-label="Direction" value={dir} onChange={e=>setDir(e.target.value)} style={sel}><option value="All">Money in & out</option><option value="in">Money in</option><option value="out">Money out</option><option value="none">Invoices issued</option></select>
              <select aria-label="Type" value={type} onChange={e=>setType(e.target.value)} style={sel}><option value="All">All types</option>{TXN_TYPES.map(t=><option key={t}>{t}</option>)}</select>
              <input aria-label="Search" value={q} onChange={e=>setQ(e.target.value)} placeholder="Search party, reference, account…" style={{...sel,flex:"1 1 200px",fontWeight:500}}/>
              <label style={{display:"flex",alignItems:"center",gap:7,fontSize:12.5,fontWeight:700,color:missingOnly?"#FCA5A5":C.sub,cursor:"pointer"}}>
                <input type="checkbox" checked={missingOnly} onChange={e=>setMissingOnly(e.target.checked)} style={{accentColor:"#F87171",width:16,height:16}}/> Missing documents only
              </label>
            </div>
          </div>
        </div>
      </div>

      <div className="sw-kpi" style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:10,marginBottom:14}}>
        {[["Money in",`+${eur(moneyIn)}`,"#7BE0A6"],["Money out",`−${eur(moneyOut)}`,"#FCA5A5"],["Net cash",`${moneyIn-moneyOut<0?"−":"+"}${eur(Math.abs(moneyIn-moneyOut))}`,C.text],["Invoiced",eur(invoiced),C.text],["Missing documents",String(missing),missing?"#FCA5A5":"#7BE0A6"]].map(([k,v,c])=>(
          <button key={k} onClick={k==="Missing documents"?()=>setMissingOnly(s=>!s):undefined} style={{textAlign:"left",background:C.panel,border:`1px solid ${k==="Missing documents"&&missingOnly?"#FCA5A5":C.line}`,borderRadius:14,padding:"12px 14px",color:C.text,cursor:k==="Missing documents"?"pointer":"default"}}>
            <div style={{fontSize:v.length>10?17:21,fontWeight:800,color:c}}>{v}</div>
            <div style={{fontSize:12,fontWeight:600,marginTop:2}}>{k}</div>
            <div style={{fontSize:10.5,color:C.sub}}>{k==="Missing documents"?"click to filter":`${fmtDate(from,cal.fmt)} – ${fmtDate(to,cal.fmt)}`}</div>
          </button>
        ))}
      </div>

      <div style={panel}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,flexWrap:"wrap",marginBottom:10}}>
          <div style={label}>{rows.length} transaction{rows.length===1?"":"s"} in this period</div>
          <button onClick={()=>exportCsv(rows,from,to,cal.fmt)} disabled={!rows.length} style={{background:C.gold,color:C.night,border:"none",borderRadius:10,padding:"8px 14px",fontWeight:800,fontSize:13,cursor:"pointer",opacity:rows.length?1:.5}}>⬇ Export CSV for accountant</button>
        </div>
        <div style={{overflowX:"auto",maxHeight:520,overflowY:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:12.5,minWidth:860}}>
            <thead>
              <tr style={{position:"sticky",top:0,background:C.panel,textAlign:"left",color:C.sub}}>
                {["Date","Reference","Party","Type","Amount","Method","Account","Document"].map(h=><th key={h} scope="col" style={{padding:"8px 8px",fontSize:11,textTransform:"uppercase",letterSpacing:.5,borderBottom:`1px solid ${C.line}`,textAlign:h==="Amount"?"right":"left"}}>{h}</th>)}
              </tr>
            </thead>
            <tbody>
              {rows.map(t=>(
                <tr key={t.id} style={{borderBottom:`1px solid ${C.line}`}}>
                  <td style={{padding:"8px",whiteSpace:"nowrap",fontVariantNumeric:"tabular-nums"}}>{fmtDate(t.date,cal.fmt)}</td>
                  <td style={{padding:"8px",whiteSpace:"nowrap",color:C.sub}}>{t.ref}</td>
                  <td style={{padding:"8px"}}>{t.party}{co==="All"&&<div style={{fontSize:10.5,color:C.sub}}>{COMPANIES.find(c=>c.id===t.co).name}</div>}</td>
                  <td style={{padding:"8px",whiteSpace:"nowrap"}}>{t.type}</td>
                  <td style={{padding:"8px",textAlign:"right",fontWeight:800,whiteSpace:"nowrap",fontVariantNumeric:"tabular-nums",color:t.dir==="in"?"#7BE0A6":t.dir==="out"?"#FCA5A5":C.sub}}>
                    {t.dir==="in"?"+":t.dir==="out"?"−":""}{eur(t.amount)}
                  </td>
                  <td style={{padding:"8px",whiteSpace:"nowrap",color:C.sub}}>{t.method}</td>
                  <td style={{padding:"8px",color:C.sub}}>{t.account}</td>
                  <td style={{padding:"8px",whiteSpace:"nowrap"}}>
                    {t.doc ? <span style={{color:C.text}}>📎 {t.doc}</span>
                      : requested[t.id] ? <span style={{color:C.goldSoft,fontWeight:700}}>⏳ Requested</span>
                      : <button onClick={()=>setRequested(r=>({ ...r, [t.id]:true }))} style={{background:"#3B1D1D",color:"#FCA5A5",border:"1px solid #7F1D1D",borderRadius:8,padding:"3px 8px",fontSize:11.5,fontWeight:700,cursor:"pointer"}}>⚠ Missing · request</button>}
                  </td>
                </tr>
              ))}
              {!rows.length&&<tr><td colSpan={8} style={{padding:16,color:C.sub,textAlign:"center"}}>No transactions in this period. Try a wider range.</td></tr>}
            </tbody>
          </table>
        </div>
      </div>
    </>
  );
}

        <section id="trust" style={{maxWidth:1200,margin:"0 auto",padding:"70px 20px"}}>
          <h2 style={{fontSize:32,margin:"0 0 22px",fontWeight:800}}>{t.trustTitle}</h2>
          <ul className="lp-cols" style={{listStyle:"none",padding:0,margin:0,display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
            {t.trust.map(x=><li key={x} style={{display:"flex",gap:10,fontSize:15,color:"#374151",lineHeight:1.5}}><span aria-hidden="true" style={{color:"#15803D",fontWeight:800}}>✓</span>{x}</li>)}
          </ul>
        </section>

        <section style={{padding:"0 20px 70px"}}>
          <div style={{maxWidth:1200,margin:"0 auto",background:"#111827",color:"#fff",borderRadius:24,padding:"44px 34px",display:"flex",alignItems:"center",justifyContent:"space-between",gap:20,flexWrap:"wrap"}}>
            <div><h2 style={{margin:"0 0 6px",fontSize:28}}>{t.ctaTitle}</h2><p style={{margin:0,color:"#D1D5DB"}}>{t.ctaSub}</p></div>
            <button className="lp-btn" onClick={()=>openApp("invoices")}>{t.cta} <span aria-hidden="true">→</span></button>
          </div>
        </section>
      </main>
      <footer style={{borderTop:"1px solid #E5E7EB",padding:"22px 20px",textAlign:"center",color:"#6B7280",fontSize:13}}>{t.footer}</footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
