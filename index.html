const hash = s => { let h=7; for(const ch of s) h=(h*31+ch.charCodeAt(0))%100003; return (h%1000)/1000; };

function solarModel(lead, company, { bill, battery=false, dayUse=0.7 }){
  const biz = lead.seg==="Commercial";
  const e = biz ? ECON.Commercial : ECON.Residential;
  const prod = lead.kw * ECON.yieldKwh[company.country];
  const use = bill*12 / e.price;
  const share = biz ? dayUse : (battery ? e.selfUseBattery : e.selfUse);
  const self = Math.min(prod*share, use*0.9);
  const savings = self*e.price + (prod-self)*e.feedIn;
  const cost = lead.quote + (battery && !biz ? e.battery : 0);
  let net=-cost, payback=null, net20=0, s=savings;
  for(let y=1;y<=25;y++){
    const prev=net; net+=s;
    if(payback===null && net>=0) payback = (y-1) + (-prev)/s;
    if(y===20) net20=net;
    s *= (1+ECON.inflation)*(1-ECON.degradation);
  }
  return { prod, use, self, savings, cost, payback, net20, co2:prod*ECON.co2/1000, billCut:Math.min(1, self*e.price/(bill*12)) };
}
const monthly = (principal, rate, years) => { const r=rate/12, n=years*12; return principal*r/(1-Math.pow(1+r,-n)); };

}

function parseAgent(raw){
  let t=(raw||"").trim().replace(/```json/gi,"").replace(/```/g,"").trim();
  const a=t.indexOf("{"), b=t.lastIndexOf("}");
  if(a!==-1&&b>a) t=t.slice(a,b+1);
  try{ const o=JSON.parse(t);
    return { message:o.message||"…", status:["contacting","warm","booked"].includes(o.status)?o.status:"warm", appointment:o.appointment||null };
  }catch{ return { message:raw||"Sorry, could you repeat that?", status:"warm", appointment:null }; }
}

async function callClaude(system, messages, max_tokens=2000){
  const res=await fetch("/api/chat",{ method:"POST", headers:{"content-type":"application/json"},
    body:JSON.stringify({ model:MODEL, max_tokens, system, messages, output_config:{ effort:"low" } }) });
  const data=await res.json();
  if(data.error) throw new Error(data.error.message||data.error);
  return (data.content||[]).filter(i=>i.type==="text").map(i=>i.text).join("\n");
}

const BRIEF_SYSTEM = `You write handoff briefs for solar sales advisors who are about to call a lead that an AI agent just re-engaged.
Reply with ONLY valid JSON, no markdown: {"summary":"<2 sentences>","interest":"high|medium|low","objections":["<short>"],"talking_points":["<short>","<short>","<short>"],"next_step":"<1 sentence>"}`;

function heuristicBrief(lead, co, messages, via){
  const said = messages.filter(m=>m.role==="customer").map(m=>m.text.toLowerCase()).join(" ");
  const rules = [[/expens|price|cost|afford/,"Upfront cost"],[/another quote|other quote|competitor/,"Has a competing quote"],
    [/bill|save|saving|roi|payback|numbers/,"Wants proof of savings / ROI"],[/cfo|sign off|board|boss|partner/,"Needs decision-maker sign-off"],
    [/cash flow|budget|tight/,"Cash-flow / budget timing"],[/forgot/,"Lost track — timing, not rejection"]];
  const objections = rules.filter(([re])=>re.test(said)).map(([,t])=>t);
  const m = solarModel(lead, co, { bill:lead.bill });
  const biz = lead.seg==="Commercial";
  return {
    summary:`${lead.name} (${biz?"business":"homeowner"}) re-engaged ${via} after ${lead.days} days of silence. Quote: ${eur(lead.quote)} for ${lead.kw} kW; originally stalled on "${lead.lost.toLowerCase()}".`,
    interest: messages.length>=5 || via.includes("page") ? "high" : "medium",

    next_step: biz ? `Bring a one-page ROI summary for ${lead.dm||"the decision-maker"}; confirm the approval timeline.` : "Walk through the savings page together and compare cash vs. financing.",
  };
}

  const log=(text,kind="sys")=>setActivity(a=>[{ t:now(), text, kind }, ...a].slice(0,50));
  const flash=(text,color=C.green)=>{ setToast({text,color}); later(()=>setToast(null),4200); };
  const setConvo=(id,fn)=>setConvos(c=>({ ...c, [id]:fn(c[id]||[]) }));
  const setLeadStatus=(id,status,extra={})=>setLeads(ls=>ls.map(l=>l.id!==id||l.status==="Booked"?l:{ ...l, status, ...extra }));

  function pickLead(id){ setLeadId(id); setInput(""); }
  function pickCompany(id){
    setCompanyId(id);
    const f=leads.filter(l=>l.co===id).sort((a,b)=>(a.status==="Cold"?0:1)-(b.status==="Cold"?0:1))[0];
    if(f) pickLead(f.id);
  }
  function openPortal(id){ const l=leads.find(x=>x.id===id); if(l){ setCompanyId(l.co); setLeadId(id); } setTab("portal"); }

  function start(){
    if(started||!lead) return;
    const co=coOf(lead);
    setConvo(lead.id,()=>[{ role:"agent", text:PLAYBOOKS[lead.seg].opener(lead,co), time:now() }]);
    if(lead.status==="Cold") setLeadStatus(lead.id,"Contacting");
    log(`📤 ${PLAYBOOKS[lead.seg].tag} opener sent to ${lead.name}`,"out");
  }

  function send(text){
    const clean=(text||"").trim(); if(!clean||typing||!started||!lead) return;
    setInput("");
    setConvo(lead.id,m=>[...m,{ role:"customer", text:clean, time:now() }]);
  }

  async function agentReply(l, history){
    if(busy.current.has(l.id)) return;
    busy.current.add(l.id);
    const co=coOf(l), play=PLAYBOOKS[l.seg];
    setTypingId(l.id);
    const turn=history.filter(m=>m.role==="customer").length;
    const script=play.script(l,co);
    let reply;
    try{
      if(demoMode){ await sleep(800); reply=script[Math.min(turn-1,script.length-1)]; }
      else reply=parseAgent(await callClaude(play.system(l,co), toApi(history)));
    }catch(e){
      // Auto-fallback to script if the live call fails — the demo keeps going.
      reply=script[Math.min(turn-1,script.length-1)];
    }
    const full=[...history,{ role:"agent", text:reply.message, time:now() }];
    setConvo(l.id,()=>full);
    setTypingId(t=>t===l.id?null:t);
    busy.current.delete(l.id);
    if(reply.status==="booked"&&reply.appointment) markBooked(l, reply.appointment, "via the WhatsApp agent", full);
    else if(reply.status==="warm") setLeadStatus(l.id,"Warm");
  }

  function markBooked(l, appointment, via, history){
    setLeadStatus(l.id,"Booked",{ appointment, via });
    flash(`✓ ${l.name} booked — ${appointment} 🎉`);
    log(`📅 ${l.name} booked ${appointment} ${via}`,"win");
    makeBrief(l, history, via);
  }

  async function makeBrief(l, history, via){
    const co=coOf(l);
    setBriefs(b=>({ ...b, [l.id]:"loading" }));
    let brief;
    try{
      if(demoMode||!history.length) throw new Error("offline");
      const transcript=history.map(m=>`${m.role==="agent"?"Agent":"Lead"}: ${m.text}`).join("\n");
      const raw=await callClaude(BRIEF_SYSTEM,[{ role:"user", content:`Lead: ${l.name} (${l.seg}, ${l.kw} kW, quote ${eur(l.quote)}, stalled on "${l.lost}"${l.dm?`, decision-maker ${l.dm}`:""}). Booked ${via}.\n\nTranscript:\n${transcript}` }]);
      const t=raw.slice(raw.indexOf("{"), raw.lastIndexOf("}")+1);
      brief={ ...JSON.parse(t), ai:true };
    }catch{ brief=heuristicBrief(l, co, history, via); }
    setBriefs(b=>({ ...b, [l.id]:brief }));
    log(`📋 Advisor brief for ${l.name} pushed to CRM`,"sys");
  }

  // Bulk reactivation across every cold lead in the current view (replies are simulated).
  function runCampaign(){
    const targets=visibleLeads.filter(l=>l.status==="Cold");
    if(campaign) return;
    if(!targets.length){ flash("No cold leads left in this view",C.panel2); return; }
    setCampaign(true);
    log(`🚀 Campaign launched — ${targets.length} dormant lead${targets.length>1?"s":""} at ${company.name} (${segFilter==="All"?"B2C + B2B":PLAYBOOKS[segFilter].tag})`,"sys");
    let last=0;
    targets.forEach((l,i)=>{
      const play=PLAYBOOKS[l.seg], co=coOf(l);
      later(()=>{
        setConvo(l.id,m=>m.length?m:[{ role:"agent", text:play.opener(l,co), time:now() }]);
        setLeadStatus(l.id,"Contacting");
        log(`📤 ${play.tag} opener sent to ${l.name}`,"out");
      }, 400+i*450);
      if(hash(l.id)<0.6){
        const reply=play.replies[Math.floor(hash(l.id+"r")*play.replies.length)];
        const at=2600+i*700; last=Math.max(last,at);
        later(()=>{
          setConvo(l.id,m=>[...m,{ role:"customer", text:reply, time:now() }]);
          setLeadStatus(l.id,"Warm");
          log(`💬 ${l.name}: "${reply}"`,"in");
        }, at);
      }
    });
    later(()=>{ setCampaign(false); log("✅ Campaign wave sent — open a warm lead to watch the agent pick it up","sys"); }, Math.max(last, 400+targets.length*450)+600);
  }

  function bookFromPortal(l, slot){
    markBooked(l, slot, "via the customer page", convos[l.id]||[]);
  }

  function reset(){
    timers.current.forEach(clearTimeout); timers.current=[]; busy.current.clear();
    setLeads(CONTACTS); setConvos({}); setBriefs({}); setActivity(SEED_ACTIVITY);
    setTypingId(null); setCampaign(false); setInput(""); setToast(null);
    setSegFilter("All"); setCompanyId("SW-001"); setLeadId("C-1001");
  }

  const sMeta={ Cold:{label:"Cold · dormant",color:C.sub,bg:"#1E2A44"},
    Contacting:{label:"Contacting…",color:C.goldSoft,bg:"#3A2E12"},
    Warm:{label:"Warm · engaged",color:C.gold,bg:"#3A2E12"},
    Booked:{label:"Appointment booked",color:"#BBF7D0",bg:"#0F3D22"} }[lead?lead.status:"Cold"];

  return (
    <div style={{minHeight:"100vh",color:C.text}}>
      <div style={{maxWidth:1200,margin:"0 auto",padding:"20px 16px 34px"}}>
        {/* Header */}
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:12,marginBottom:14}}>
          <div style={{display:"flex",alignItems:"center",gap:12}}>
            <div style={{width:42,height:42,borderRadius:12,background:C.gold,display:"grid",placeItems:"center",boxShadow:`0 0 22px ${C.gold}55`,fontSize:22}}>☀️</div>
            <div>
              <div style={{fontSize:22,fontWeight:800,letterSpacing:-0.4}}>Solar<span style={{color:C.gold}}>Wake</span></div>
              <div style={{fontSize:12.5,color:C.sub,marginTop:-2}}>We don't find new leads. We close the ones you already paid for.</div>
            </div>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
            <button onClick={()=>setDemoMode(d=>!d)} title="Toggle scripted demo mode (no network needed)"
              style={{display:"inline-flex",alignItems:"center",gap:7,fontSize:12,fontWeight:700,cursor:"pointer",
                color:demoMode?C.night:C.sub,background:demoMode?C.gold:C.panel,border:`1px solid ${demoMode?C.gold:C.line}`,padding:"7px 12px",borderRadius:999}}>
              <span style={{width:7,height:7,borderRadius:999,background:demoMode?C.night:C.green}}/> {demoMode?"Demo Mode (scripted)":"Live AI"}
            </button>
            <div style={{display:"flex",alignItems:"center",gap:7,fontSize:12,color:C.sub,background:C.panel,border:`1px solid ${C.line}`,padding:"7px 12px",borderRadius:999}}>
              <span style={{width:7,height:7,borderRadius:999,background:C.gold,boxShadow:`0 0 7px ${C.gold}`}}/> Powered by Claude · Anthropic API
            </div>
          </div>
        </div>

        {/* Tabs */}
        <div style={{display:"flex",gap:8,marginBottom:16,flexWrap:"wrap"}}>
          {[{id:"console",t:"Installer Console",s:"B2B · for solar companies"},{id:"portal",t:"Customer Page",s:"B2C · what the lead sees"}].map(x=>{
            const on=tab===x.id;
            return (
              <button key={x.id} onClick={()=>setTab(x.id)} style={{textAlign:"left",cursor:"pointer",background:on?C.panel2:"transparent",
                border:`1px solid ${on?C.gold:C.line}`,borderRadius:12,padding:"9px 16px",color:on?C.text:C.sub}}>
                <div style={{fontWeight:800,fontSize:14}}>{x.t}</div>
                <div style={{fontSize:11,color:on?C.gold:C.sub}}>{x.s}</div>
              </button>
            );
          })}
        </div>

        {tab==="console" ? (
          <Console {...{company,companyId,pickCompany,segFilter,setSegFilter,kpi,lead,leadId,pickLead,visibleLeads,messages,started,typing,pb,sMeta,
            start,send,input,setInput,scrollRef,briefs,activity,campaign,runCampaign,openPortal}} />
        ) : (
          <Portal key={lead?lead.id:"none"} lead={lead} company={company} companyLeads={companyLeads} pickLead={pickLead}
            pickCompany={pickCompany} onBook={bookFromPortal} backToConsole={()=>setTab("console")} />
        )}

        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginTop:16,flexWrap:"wrap",gap:10}}>
          <div style={{fontSize:12,color:C.sub}}>⚡ The agent runs live on Anthropic's Claude API. Same lead volume → more booked appointments.</div>
          <button onClick={reset} style={{display:"inline-flex",alignItems:"center",gap:7,background:C.panel,color:C.sub,border:`1px solid ${C.line}`,padding:"8px 14px",borderRadius:999,fontSize:13,cursor:"pointer",fontWeight:600}}>↺ Reset demo</button>
        </div>
      </div>

      {toast&&(
        <div className="sw-in" style={{position:"fixed",bottom:24,left:"50%",transform:"translateX(-50%)",background:toast.color,color:"#fff",padding:"14px 22px",borderRadius:14,fontWeight:700,fontSize:15,boxShadow:"0 12px 30px rgba(0,0,0,.4)",zIndex:50,maxWidth:"calc(100% - 32px)"}}>
          {toast.text}
        </div>
      )}
    </div>
  );
}

                const mine=m.role==="customer";
                return (
                  <div key={i} className="sw-in" style={{alignSelf:mine?"flex-end":"flex-start",maxWidth:"84%"}}>
                    <div style={{background:mine?C.waOut:C.waIn,color:"#111",padding:"7px 10px 5px",borderRadius:9,
                      borderTopRightRadius:mine?2:9,borderTopLeftRadius:mine?9:2,boxShadow:"0 1px 1px rgba(0,0,0,.12)",fontSize:14,lineHeight:1.4}}>
                      <ChatText text={m.text} onPortal={openPortal}/>
                      <span style={{float:"right",fontSize:10,color:"#8a9",marginLeft:8,marginTop:4}}>{m.time}{mine?" ✓✓":""}</span>
                    </div>
                  </div>
                );
              })}
              {typing&&(
                <div style={{alignSelf:"flex-start",background:C.waIn,padding:"10px 14px",borderRadius:9,borderTopLeftRadius:2,boxShadow:"0 1px 1px rgba(0,0,0,.12)"}}>
                  <span className="sw-dots"><i/><i/><i/></span>
                </div>
              )}
            </div>

            {started&&lead.status!=="Booked"&&(
              <div style={{display:"flex",gap:6,overflowX:"auto",padding:"8px 10px 0"}}>
                {pb.quick.map(q=>(
                  <button key={q} onClick={()=>send(q)} disabled={typing}
                    style={{whiteSpace:"nowrap",fontSize:12,background:"#fff",color:C.waHeader,border:`1px solid ${C.waHeader}44`,padding:"6px 11px",borderRadius:999,cursor:typing?"default":"pointer",opacity:typing?.5:1,fontWeight:600}}>{q}</button>
                ))}
              </div>
            )}

            <div style={{display:"flex",alignItems:"center",gap:8,padding:10,background:"#F0F0F0"}}>
              <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&send(input)}
                disabled={!started||typing||lead.status==="Booked"} placeholder={started?`Reply as the ${lead.seg==="Commercial"?"business":"homeowner"}…`:"Press start first"}
                style={{flex:1,border:"none",borderRadius:999,padding:"10px 14px",fontSize:14,outline:"none",background:"#fff",color:"#111"}}/>
              <button onClick={()=>send(input)} disabled={!started||typing}
                style={{width:42,height:42,borderRadius:999,background:C.waHeader,border:"none",display:"grid",placeItems:"center",cursor:"pointer",flexShrink:0}}>
                <SendI size={18} color="#fff"/>
              </button>
            </div>
          </div>
        </div>
      </div>

      {/* Activity + ROI */}
      <div className="sw-2col" style={{display:"grid",gridTemplateColumns:"minmax(0,1fr) minmax(0,1fr)",gap:18,marginTop:18}}>
        <div style={panel}>
          <div style={{...label,marginBottom:10}}>Live activity</div>
          <div style={{display:"flex",flexDirection:"column",gap:6,maxHeight:290,overflowY:"auto"}}>
            {activity.map((a,i)=>(
              <div key={activity.length-i} className="sw-in" style={{display:"flex",gap:10,fontSize:12.5,lineHeight:1.4,padding:"6px 8px",borderRadius:8,
                background:a.kind==="win"?"#0F3D22":a.kind==="in"?"#1E2A44":"transparent"}}>
                <span style={{color:C.sub,fontVariantNumeric:"tabular-nums",flexShrink:0}}>{a.t}</span>
                <span style={{color:a.kind==="win"?"#BBF7D0":C.text}}>{a.text}</span>
              </div>
            ))}
          </div>
        </div>
        <ROICalc/>
      </div>
    </>
  );
}

function Slider({label:l, value, set, min, max, step=1, fmt, dark=true}){
  return (
    <label style={{display:"block",marginBottom:12}}>
      <div style={{display:"flex",justifyContent:"space-between",fontSize:12.5,marginBottom:4}}>
        <span style={{color:dark?C.sub:C.pSub}}>{l}</span><b style={{color:dark?C.text:C.pInk}}>{fmt?fmt(value):value}</b>
      </div>
      <input type="range" min={min} max={max} step={step} value={value} onChange={e=>set(Number(e.target.value))}/>
    </label>
  );
}

// Sales tool for pitching SolarWake to an installer: "what is your dead pipeline worth?"
function ROICalc(){
  const [n,setN]=useState(400), [avg,setAvg]=useState(16000), [book,setBook]=useState(10), [close,setClose]=useState(30);
  const bookings=Math.round(n*book/100), installs=Math.round(bookings*close/100);
  return (
    <div style={panel}>
      <div style={{...label,marginBottom:2}}>ROI calculator · for installers</div>
      <div style={{fontSize:16,fontWeight:800,marginBottom:12}}>What is your dead pipeline worth?</div>
      <Slider label="Dormant quotes in your CRM" value={n} set={setN} min={50} max={3000} step={50}/>
      <Slider label="Average quote value" value={avg} set={setAvg} min={6000} max={80000} step={1000} fmt={eur}/>
      <Slider label="Reactivated → booked call" value={book} set={setBook} min={2} max={25} fmt={v=>v+"%"}/>
      <Slider label="Booked call → signed install" value={close} set={setClose} min={10} max={60} fmt={v=>v+"%"}/>
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginTop:4}}>
        {[["Booked calls",bookings],["Signed installs",installs],["Recovered revenue",eur(installs*avg)]].map(([k,v],i)=>(
          <div key={k} style={{background:C.panel2,borderRadius:11,padding:"10px 11px"}}>
            <div style={{fontSize:i===2?17:22,fontWeight:800,color:i===2?C.gold:C.text}}>{v}</div>
            <div style={{fontSize:11,color:C.sub}}>{k}</div>
          </div>
        ))}
      </div>
      <div style={{fontSize:11,color:C.sub,marginTop:10}}>
        Replacing those calls with paid ads would cost ≈ <b style={{color:C.text}}>{eur(bookings*ASSUME.cpa.Residential)}</b> (at {eur(ASSUME.cpa.Residential)} per booked appointment). Rates are illustrative assumptions — plug in the installer's own numbers.
      </div>
    </div>
  );
}

// ================== B2C: CUSTOMER PAGE ==================
// The white-labelled page the agent links to on WhatsApp. Business leads get a business-case variant.
function Portal({ lead, company, companyLeads, pickLead, pickCompany, onBook, backToConsole }){
  if(!lead) return <div style={panel}>Select a lead first.</div>;
  const co=coOf(lead), biz=lead.seg==="Commercial", brand=co.brand;
  const [bill,setBill]=useState(lead.bill);
  const [battery,setBattery]=useState(false);
  const [dayUse,setDayUse]=useState(70);
  const [term,setTerm]=useState(biz?10:15);
  const [slot,setSlot]=useState(null);
  const m=solarModel(lead, co, { bill, battery, dayUse:dayUse/100 });
  const e=biz?ECON.Commercial:ECON.Residential;
  const pay=monthly(m.cost, e.rate, term), save=m.savings/12, netMonthly=pay-save;
  const days=useMemo(()=>nextWeekdays(5),[]);
  const times=biz?["09:00","10:30","14:00","16:00"]:["09:00","11:30","16:00","18:00"];
  const booked=lead.status==="Booked";

  const card={ background:"#fff", border:`1px solid ${C.pLine}`, borderRadius:14, padding:16 };
  const stat=(k,v,s)=>(
    <div style={{...card,padding:"13px 14px"}}>
      <div style={{fontSize:22,fontWeight:800,color:C.pInk}}>{v}</div>
      <div style={{fontSize:12,fontWeight:700,color:C.pInk}}>{k}</div>
      {s&&<div style={{fontSize:11,color:C.pSub,marginTop:1}}>{s}</div>}
    </div>
  );

  return (
    <>
      <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap",marginBottom:12}}>
        <span style={label}>Preview page for</span>
        <select value={lead.co} onChange={e=>pickCompany(e.target.value)}
          style={{background:C.panel2,color:C.text,border:`1px solid ${C.line}`,borderRadius:9,padding:"7px 10px",fontSize:13,fontWeight:600,outline:"none"}}>
          {COMPANIES.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
        </select>
        <select value={lead.id} onChange={e=>pickLead(e.target.value)}
          style={{background:C.panel2,color:C.text,border:`1px solid ${C.line}`,borderRadius:9,padding:"7px 10px",fontSize:13,fontWeight:600,outline:"none"}}>
          {companyLeads.map(l=><option key={l.id} value={l.id}>{PLAYBOOKS[l.seg].icon} {l.name}</option>)}
        </select>
        <span style={{fontSize:12,color:C.sub}}>White-labelled for each installer · sent by the agent on WhatsApp</span>
      </div>

      {/* Browser frame */}
      <div className="sw-portal" style={{"--brand":brand,background:"#fff",borderRadius:16,overflow:"hidden",boxShadow:"0 20px 50px rgba(0,0,0,.5)"}}>
        <div style={{background:"#E9ECF1",padding:"9px 12px",display:"flex",alignItems:"center",gap:10}}>
          <span style={{display:"flex",gap:5}}>{["#FF5F57","#FEBC2E","#28C840"].map(c=><i key={c} style={{width:10,height:10,borderRadius:99,background:c,display:"block"}}/>)}</span>
          <div style={{flex:1,background:"#fff",borderRadius:8,padding:"5px 10px",fontSize:12,color:"#475569",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>🔒 {portalUrl(lead,co)}</div>
        </div>

        <div style={{background:C.pBg,color:C.pInk,padding:"0 0 22px"}}>
          {/* Installer header */}
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"14px 22px",background:"#fff",borderBottom:`1px solid ${C.pLine}`,flexWrap:"wrap",gap:8}}>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <div style={{width:34,height:34,borderRadius:9,background:brand,display:"grid",placeItems:"center",color:"#fff",fontSize:17}}>☀</div>
              <div><div style={{fontWeight:800}}>{co.name}{biz?" · Business Energy":""}</div><div style={{fontSize:11,color:C.pSub}}>{co.city} · certified installer</div></div>
            </div>
            <div style={{fontSize:12,color:C.pSub}}>Your advisor: <b style={{color:C.pInk}}>Lina</b> · 💬 WhatsApp</div>
          </div>

          {/* Hero */}
          <div style={{padding:"22px 22px 6px"}}>
            <div style={{display:"inline-block",fontSize:11.5,fontWeight:800,color:brand,background:`${brand}18`,padding:"4px 10px",borderRadius:999,marginBottom:10}}>
              ⏳ Your quoted price is held for {ECON.priceLockDays} more days
            </div>
            <div style={{fontSize:26,fontWeight:800,letterSpacing:-0.5,lineHeight:1.2}}>
              {biz?`The solar business case for ${lead.name}`:`${first(lead.name)}, your solar plan is still reserved.`}
            </div>
            <div style={{fontSize:14,color:C.pSub,marginTop:6}}>
              {lead.kw} kW rooftop system · {lead.city} · quoted {eur(lead.quote)}{biz&&lead.dm?` · prepared for ${lead.dm}`:""}
            </div>
          </div>

          <div className="sw-pgrid" style={{display:"grid",gridTemplateColumns:"320px minmax(0,1fr)",gap:16,padding:"16px 22px 0"}}>
            {/* Inputs */}
            <div style={card}>
              <div style={{fontWeight:800,marginBottom:12}}>{biz?"Your operation":"Your home"}</div>
              <Slider dark={false} label={biz?"Monthly electricity cost":"Monthly electricity bill"} value={bill} set={setBill}
                min={biz?300:50} max={biz?8000:350} step={biz?50:5} fmt={eur}/>
              {biz ? (
                <Slider dark={false} label="Power used during daylight" value={dayUse} set={setDayUse} min={40} max={90} fmt={v=>v+"%"}/>
              ) : (
                <label style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,fontSize:13,padding:"10px 12px",background:C.pBg,borderRadius:10,cursor:"pointer",marginBottom:12}}>
                  <span><b>Add a home battery</b><br/><span style={{fontSize:11.5,color:C.pSub}}>+{eur(ECON.Residential.battery)} · use ~60% of your own power</span></span>
                  <input type="checkbox" checked={battery} onChange={e=>setBattery(e.target.checked)} style={{width:18,height:18,accentColor:brand}}/>
                </label>
              )}
              <div style={{fontSize:12.5,color:C.pSub,marginBottom:6}}>Financing term</div>
              <div style={{display:"flex",gap:6}}>
                {[10,15,20].map(t=>(
                  <button key={t} onClick={()=>setTerm(t)} style={{flex:1,padding:"7px 0",borderRadius:9,fontWeight:700,fontSize:13,cursor:"pointer",
                    border:`1.5px solid ${term===t?brand:C.pLine}`,background:term===t?`${brand}14`:"#fff",color:C.pInk}}>{t} yrs</button>
                ))}
              </div>
            </div>

            {/* Results */}
            <div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:10}}>
                {stat("Saved per year",eur(m.savings),`≈ ${eur(m.savings/12)} per month`)}
                {stat("Pays for itself in",fmtYears(m.payback),`on ${eur(m.cost)} total`)}
                {stat("20-year net gain",eur(m.net20),"after paying for the system")}
                {biz ? stat("CO₂ avoided / year",`${m.co2.toFixed(1)} t`,"ready for your ESG report")
                     : stat("Of your bill covered",`${Math.round(m.billCut*100)}%`,`${m.co2.toFixed(1)} t CO₂ avoided per year`)}
              </div>
              <div style={{...card,marginTop:10}}>
                <div style={{display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:8,fontSize:13}}>
                  <span>Financed over {term} yrs at {(e.rate*100).toFixed(1)}%: <b>{eur(pay)}/mo</b></span>
                  <span>Savings: <b style={{color:"#15803D"}}>−{eur(save)}/mo</b></span>
                </div>
                <div style={{marginTop:8,fontSize:14,fontWeight:800,color:netMonthly<=0?"#15803D":C.pInk}}>
                  {netMonthly<=0?`✅ Cash-positive from month one (+${eur(-netMonthly)}/mo)`:`Effective cost while financing: ${eur(netMonthly)}/mo — then ${eur(save)}/mo saved, free and clear`}
                </div>
                {biz&&<div style={{marginTop:6,fontSize:12.5,color:C.pSub}}>Linear depreciation: ≈ <b style={{color:C.pInk}}>{eur(lead.quote/20)}/yr</b> over 20 years (confirm with your tax advisor).</div>}
              </div>
            </div>
          </div>

          {/* Booking */}
          <div style={{...card,margin:"16px 22px 0"}}>
            {booked ? (
              <div style={{textAlign:"center",padding:"10px 0"}}>
                <div style={{fontSize:30}}>🎉</div>
                <div style={{fontSize:18,fontWeight:800}}>You're booked: {lead.appointment}</div>
                <div style={{fontSize:13,color:C.pSub,marginTop:4}}>A {biz?"commercial ":""}advisor from {co.name} will call you. Confirmation sent on WhatsApp.</div>
                <button onClick={backToConsole} style={{marginTop:12,fontSize:12,fontWeight:700,background:C.pInk,color:"#fff",border:"none",borderRadius:999,padding:"8px 14px",cursor:"pointer"}}>See it land in the installer console →</button>
              </div>
            ) : (
              <>
                <div style={{fontWeight:800,marginBottom:2}}>{biz?"Book a 20-minute call with our commercial advisor":"Book your free 15-minute advisor call"}</div>
                <div style={{fontSize:12.5,color:C.pSub,marginBottom:12}}>{biz?"Bring your CFO or decision-maker — we'll walk through the numbers together.":"No obligation. We'll go through your numbers and answer every question."}</div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(150px,1fr))",gap:10}}>
                  {days.map(d=>(
                    <div key={d.toISOString()}>
                      <div style={{fontSize:12,fontWeight:800,marginBottom:6}}>{dayLabel(d)}</div>
                      <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
                        {times.map(t=>{
                          const v=`${dayLabel(d)} at ${t}`, on=slot===v;
                          return <button key={t} onClick={()=>setSlot(v)} style={{fontSize:12,fontWeight:700,padding:"5px 8px",borderRadius:8,cursor:"pointer",
                            border:`1.5px solid ${on?brand:C.pLine}`,background:on?brand:"#fff",color:on?"#fff":C.pInk}}>{t}</button>;
                        })}
                      </div>
                    </div>
                  ))}
                </div>
                <button onClick={()=>slot&&onBook(lead,slot)} disabled={!slot}
                  style={{marginTop:14,width:"100%",padding:"12px 0",borderRadius:11,border:"none",fontWeight:800,fontSize:15,cursor:slot?"pointer":"default",
                    background:slot?brand:"#CBD5E1",color:"#fff"}}>
                  {slot?`Confirm ${slot}`:"Pick a time above"}
                </button>
              </>
            )}
          </div>

          <div style={{fontSize:11,color:C.pSub,padding:"14px 22px 0",lineHeight:1.5}}>
            Estimates use {ECON.yieldKwh[co.country]} kWh/kWp per year, {Math.round(e.price*100)} ct/kWh grid price rising {ECON.inflation*100}%/yr, {Math.round(e.feedIn*100)} ct/kWh feed-in and {ECON.degradation*100}%/yr panel degradation. Example financing rate. Your advisor will confirm exact figures.
          </div>
        </div>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
