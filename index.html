  {id:"C-1020",co:"SW-005",name:"Claudia Brunner",seg:"Residential",city:"Winterthur",kw:6.5,quote:17800,days:60,consent:true,status:"Cold",phone:"+41782345678",email:"claudia.brunner@example.com",bill:100,src:"Google Ads",lost:"Unsure about savings"},
  {id:"C-1021",co:"SW-005",name:"Bergblick Praxis AG",seg:"Commercial",city:"Zug",kw:22,quote:39900,days:53,consent:true,status:"Contacting",phone:"+41412223344",email:"sabine.graf@example.com",bill:820,src:"Referral",lost:"Cash flow",dm:"Dr. Sabine Graf (Partner)"},
];

// Email is the default channel (many businesses ignore vendor WhatsApps); WhatsApp can be chosen per lead.
const INITIAL_LEADS = CONTACTS.map(l=>({ ...l, channel:"email" }));
const FIRST_LEAD = "C-1006"; // open on a cold business lead so the email inbox shows first

// Assumptions for the B2B revenue KPIs (shown in the UI so judges can see them).
const ASSUME = { closeRate:0.35, cpa:{ Residential:180, Commercial:650 } }; // cpa = ad cost of one fresh booked appointment

// Simple, transparent solar economics used by the customer page and the agent's facts.
const ECON = {
  yieldKwh:{ DE:950, CH:1050 },                      // kWh per kWp per year
  Residential:{ price:0.36, feedIn:0.08, selfUse:0.30, selfUseBattery:0.60, battery:5500, rate:0.049 },
  Commercial:{ price:0.25, feedIn:0.07, rate:0.055 },
  co2:0.38, inflation:0.02, degradation:0.005, priceLockDays:14,
};

const eur = n => "€" + Math.round(n).toLocaleString("de-DE");
const now = () => new Date().toLocaleTimeString([], { hour:"2-digit", minute:"2-digit" });
const first = n => n.replace(/^Dr\.\s*/,"").split(" ")[0];
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const coOf = l => COMPANIES.find(c=>c.id===l.co);
const portalUrl = (l,co) => `${co.slug}.solarwake.app/p/${l.id}`;
const fmtYears = p => p==null ? "25+ years" : `${p.toFixed(1)} years`;
const hash = s => { let h=7; for(const ch of s) h=(h*31+ch.charCodeAt(0))%100003; return (h%1000)/1000; };

function solarModel(lead, company, { bill, battery=false, dayUse=0.7 }){
  const biz = lead.seg==="Commercial";
  const e = biz ? ECON.Commercial : ECON.Residential;
  const prod = lead.kw * ECON.yieldKwh[company.country];
  const use = bill*12 / e.price;
  const share = biz ? dayUse : (battery ? e.selfUseBattery : e.selfUse);
  const self = Math.min(prod*share, use*0.9);
  const savings = self*e.price + (prod-self)*e.feedIn;
  const cost = lead.quote + (battery && !biz ? e.battery : 0);
  let net=-cost, payback=null, net20=0, s=savings;
  for(let y=1;y<=25;y++){
    const prev=net; net+=s;
    if(payback===null && net>=0) payback = (y-1) + (-prev)/s;
    if(y===20) net20=net;
    s *= (1+ECON.inflation)*(1-ECON.degradation);
  }
  return { prod, use, self, savings, cost, payback, net20, co2:prod*ECON.co2/1000, billCut:Math.min(1, self*e.price/(bill*12)) };
}
const monthly = (principal, rate, years) => { const r=rate/12, n=years*12; return principal*r/(1-Math.pow(1+r,-n)); };

function nextWeekdays(n){
  const out=[], d=new Date(); d.setHours(0,0,0,0);
  while(out.length<n){ d.setDate(d.getDate()+1); if(d.getDay()!==0&&d.getDay()!==6) out.push(new Date(d)); }
  return out;
}
const dayLabel = d => d.toLocaleDateString("en-GB",{ weekday:"short", day:"numeric", month:"short" });

// ================== PLAYBOOKS (B2C homeowner vs B2B business) × CHANNEL (WhatsApp vs email) ==================
const JSON_RULES = `Reply with ONLY valid JSON, no markdown, no backticks: {"message":"<reply>","status":"contacting|warm|booked","appointment":<null or "Day at Time">}
Use "warm" once interest returns; use "booked" and fill "appointment" ONLY once a specific day/time is agreed. Move toward a booking within a few messages.`;

function leadFacts(lead, co){
  const m = solarModel(lead, co, { bill:lead.bill });
  return `Facts you may use (do not invent other figures, subsidies or prices):
- Quote: ${eur(lead.quote)} for a ${lead.kw} kW system in ${lead.city}, sent ${lead.days} days ago. Lead source: ${lead.src}. Why it stalled: ${lead.lost}.
- Estimated savings: ${eur(m.savings)} per year, simple payback about ${fmtYears(m.payback)}, 20-year net gain about ${eur(m.net20)}, ${m.co2.toFixed(1)} t CO2 avoided per year.
- The quoted price is held for ${ECON.priceLockDays} more days.
- Personal page with live numbers, financing and self-booking: ${portalUrl(lead,co)}`;
}

const CHANNELS = {
  whatsapp:{ label:"WhatsApp", icon:"💬" },
  email:{ label:"Email", icon:"✉️" },
};
const agentEmail = co => `lina@${co.slug}.solarwake.app`;
const dmName = l => l.dm ? l.dm.replace(/\s*\(.*\)$/,"") : l.name;
// Lead conversations are written in the language stamped on the lead when Lina starts (`lead.lang`: "en" | "de").
const de = l => l.lang==="de";
const deNum = n => String(n).replace(".",",");
const kwOf = l => de(l) ? deNum(l.kw) : l.kw;
const yearsOf = (l, p) => !de(l) ? fmtYears(p) : p==null ? "über 25 Jahren" : `${deNum(p.toFixed(1))} Jahren`;
const signoff = (co, biz, lang="en") => `${lang==="de"?"Mit freundlichen Grüßen":"Kind regards,"}\nLina\n${co.name}${biz?" Business Energy":""}`;
const greet = l => l.seg==="Commercial" ? `${de(l)?"Guten Tag":"Dear"} ${dmName(l)}` : de(l) ? `Guten Tag ${l.name}` : `Hi ${first(l.name)}`;

const CHANNEL_STYLE = {
  whatsapp:biz=>`Channel: WhatsApp. Short messages (${biz?"1-3 sentences, no emoji":"1-2 sentences, an occasional emoji"}).`,

};

    },

    },

      whatsapp:(l,co)=>({ text:de(l)

        : `Hi ${first(l.name)}! 👋 It's Lina from ${co.name}. A while back we put together a solar quote for your home — your price is still held for ${ECON.priceLockDays} more days, so I wanted to check in. Are you still thinking about going solar? ☀️` }),

        text:`${greet(l)},\n\nvor einigen Wochen haben wir für Ihr Haus ein Angebot über eine ${kwOf(l)}-kW-Solaranlage erstellt. Ihr Preis ist noch ${ECON.priceLockDays} Tage reserviert, deshalb melde ich mich, bevor er ausläuft.\n\nIst Solar für Sie noch ein Thema? Gerne rechne ich die Zahlen mit den aktuellen Strompreisen neu.\n\n${signoff(co,false,"de")}` })
        : ({ subject:`Your solar quote for ${l.city} — price still held`,

${JSON_RULES}`,

  Commercial: {
    tag:"B2B", label:"Business playbook", color:C.b2b, icon:"🏢",

    quick:{

      de:["Ja, steht noch auf unserer Liste. Wie wäre die Amortisation?","Schicken Sie gern die aktualisierten Zahlen","Zeitlich schwierig, aber erzählen Sie mal"],
    },
    opener:{
      whatsapp:(l,co)=>({ text:de(l)
        ? `Guten Tag${l.dm?` ${dmName(l)}`:""}, hier ist Lina von ${co.name} Business Energy. Wir haben vor einigen Wochen ein Angebot für eine ${kwOf(l)}-kW-Dachanlage für ${l.name} erstellt. Mit den aktuellen Strompreisen hat sich die Wirtschaftlichkeit verbessert. Steht das Thema Energiekosten dieses Jahr noch auf Ihrer Agenda?`

function classifyLead(text){
  const t=text.toLowerCase();
  if(/who gave you|how did you get (my|this|our)|leave (me|us) alone|\bspam\b|annoy|harass|woher haben sie|wer hat ihnen|lassen sie (mich|uns) in ruhe|belästig/.test(t)) return "upset";
  if(/\bbook\b|schedule|when can we (talk|meet)|let'?s (talk|meet)|set up a call|call (me|us)\b|works for (me|us)|sounds good|(monday|tuesday|wednesday|thursday|friday)\b.*\b(works|is fine|ok|good)\b|^(ok|okay|sure|yes)[\s,!.—-]*$/.test(t)) return "book";
  if(/\bbuchen\b|\btermin\b|wann können wir (sprechen|telefonieren|reden)|passt (mir|uns)|(montag|dienstag|mittwoch|donnerstag|freitag)\b.*\b(passt|geht|ok|gut)\b|^(ja|gut|gerne|einverstanden)[\s,!.—-]*$/.test(t)) return "book";
  if(/expensive|price|cost|afford|too much|teuer|preis|kosten|zu viel|leisten/.test(t)) return "price";
  if(/another quote|other quote|competitor|compar|cheaper offer|anderes angebot|anderen angebot|konkurren|vergleich|günstiger/.test(t)) return "competitor";
  if(/\bcfo\b|sign off|sign-off|board|boss|partner|wife|husband|approv|zustimm|freigabe|geschäftsführ|vorstand|\bchef|meine frau|mein mann/.test(t)) return "decider";
  if(/cash ?flow|budget|tight|liquidität|knapp/.test(t)) return "cashflow";
  if(/save|saving|bill|\broi\b|payback|numbers|figures|spar|rechnung|amortis|zahlen|rendite/.test(t)) return "numbers";
  if(/timing|later|not now|next year|busy|tricky|später|nicht jetzt|nächstes jahr|keine zeit|zeitlich/.test(t)) return "timing";
  if(/forgot|still interested|still on our list|interested|\byes\b|vergessen|interess|\bja\b/.test(t)) return "interest";
  return "other";
}

           : "Shall I book you a free 15-minute call with an advisor, Thursday at 18:00 or Friday at 10:00?");
function pickSlot(l, text){
  const t=text.toLowerCase(), d=de(l);
  if(l.seg==="Commercial") return /wednesday|mittwoch|14/.test(t)?(d?"Mittwoch 14:00":"Wednesday 14:00"):(d?"Dienstag 10:00":"Tuesday 10:00");
  return /friday|freitag|morning|vormittag|\b10\b/.test(t)?(d?"Freitag 10:00":"Friday 10:00"):(d?"Donnerstag 18:00":"Thursday 18:00");
}

function leadReply(l, co, history){
  const last=history[history.length-1].text, intent=classifyLead(last), biz=l.seg==="Commercial", email=l.channel==="email";
  const turn=history.filter(m=>m.role==="customer").length;
  let body, status="warm", appointment=null, ask=false;
  if(intent==="book"){
    appointment=pickSlot(l,last); status="booked";
    body=de(l)
      ? (biz?`Bestätigt: ${appointment} mit unserem Berater für Gewerbekunden. Ich sende Ihnen vorab eine Kalendereinladung und eine einseitige ROI-Zusammenfassung für Ihren CFO.`
            :`Perfekt, Ihr Termin ist gebucht: ${appointment}. ${email?"Eine Kalendereinladung ist unterwegs.":"Sie erhalten gleich eine Bestätigung. Bis bald! ☀️"}`)
      : (biz?`Confirmed: ${appointment} with our commercial advisor. I'll send a calendar invitation and a one-page ROI summary for your CFO beforehand.`
            :`Perfect, you're booked for ${appointment}. ${email?"A calendar invitation is on its way.":"You'll get a confirmation shortly. Talk soon! ☀️"}`);
  } else if(intent==="upset"){ body=leadAnswer(l,co,intent); status="contacting"; }   // no pitch, no slot ask
  else { body=leadAnswer(l,co,intent); ask=turn>=2; }
  const message = email
    ? `${greet(l)},\n\n${body}${ask?`\n\n${slotAsk(l)}`:""}\n\n${signoff(co,biz,l.lang)}`
    : `${body}${ask?` ${slotAsk(l)}${biz?"":" 🙂"}`:""}`;
  return { message, status, appointment };
}

function parseAgent(raw){
  let t=(raw||"").trim().replace(/```json/gi,"").replace(/```/g,"").trim();
  const a=t.indexOf("{"), b=t.lastIndexOf("}");
  if(a!==-1&&b>a) t=t.slice(a,b+1);
  try{ const o=JSON.parse(t);
    return { message:o.message||"…", status:["contacting","warm","booked"].includes(o.status)?o.status:"warm", appointment:o.appointment||null };
  }catch{ return { message:raw||"Sorry, could you repeat that?", status:"warm", appointment:null }; }
}

  return (data.content||[]).filter(i=>i.type==="text").map(i=>i.text).join("\n");
}

const invDays = inv => daysBetween(parseYmd(inv.due), today0()); // > 0 means overdue by that many days
function invStatus(inv){

// The reminder ladder: each step fires `offset` days after the due date (negative = before).
// `mood` is how the step reads to the customer: firmer each time, never rude.
const LADDER = [
  { key:"pre",   offset:-3, name:"Friendly heads-up", mood:"😊", tone:"friendly: a light heads-up that the invoice is due soon" },
  { key:"due",   offset:0,  name:"Due today",         mood:"🙂", tone:"friendly: the invoice is due today" },
  { key:"r1",    offset:7,  name:"Polite reminder",   mood:"😐", tone:"polite: the payment may have slipped through, easy to fix" },
  { key:"r2",    offset:14, name:"Firm reminder",     mood:"😬", tone:"firm but respectful: ask for payment or a date within 7 days" },
  { key:"final", offset:30, name:"Final notice",      mood:"🫡", tone:"final notice: clear and serious, pay or contact us within 7 days, still courteous" },
];
function ladderStep(inv, steps){
  if(inv.paid) return null;
  const d=invDays(inv); let s=null;
  for(const st of steps) if(st.on&&d>=st.offset) s=st;
  return s;
}
const reminderDue = (inv, steps) => { const st=ladderStep(inv,steps); return !!st && !inv.flag && !inv.sent.some(s=>s.key===st.key); };

function parseBilling(raw){
  let t=(raw||"").trim().replace(/```json/gi,"").replace(/```/g,"").trim();
  const a=t.indexOf("{"), b=t.lastIndexOf("}");
  if(a!==-1&&b>a) t=t.slice(a,b+1);
  const o=JSON.parse(t);
  if(!o.message) throw new Error("empty");
  return o;
}

const PRESETS = [["week","This week"],["month","This month"],["lastMonth","Last month"],["quarter","This quarter"],["lastQuarter","Last quarter"],
  ["fy","This financial year"],["lastFy","Last financial year"],["last30","Last 30 days"],["last12","Last 12 months"]];
function presetRange(key, s){
  const t=today0(), y=t.getFullYear(), m=t.getMonth();
  const fyY = m>=s.fyStart ? y : y-1;
  const qIndex=Math.floor(((m-s.fyStart+12)%12)/3);
  const qFrom=new Date(fyY, s.fyStart+qIndex*3, 1);
  switch(key){
    case "week": { const d=new Date(t); d.setDate(d.getDate()-((t.getDay()-s.weekStart+7)%7)); return [d,t]; }
    case "month": return [new Date(y,m,1), t];
    case "lastMonth": return [new Date(y,m-1,1), new Date(y,m,0)];
    case "quarter": return [qFrom, t];
    case "lastQuarter": return [new Date(qFrom.getFullYear(), qFrom.getMonth()-3, 1), new Date(qFrom.getFullYear(), qFrom.getMonth(), 0)];
    case "fy": return [new Date(fyY, s.fyStart, 1), t];
    case "lastFy": return [new Date(fyY-1, s.fyStart, 1), new Date(fyY, s.fyStart, 0)];
    case "last30": return [daysFrom(-29), t];
    default: return [daysFrom(-364), t];
  }
}

const STOP_WORDS = /\b(stopp?|unsubscribe|opt[ -]?out|abmelden)\b|remove (me|us) from|keine (nachrichten|e-?mails) mehr|nehmen sie (mich|uns) (von|aus)/i;

// Rules that run before any reply is written, and always win: STOP and wrong person end the conversation.
function leadGuard(l, co, text){
  const reason=STOP_WORDS.test(text)?"replied STOP":WRONG_PERSON.test(text)?"wrong person":null;
  if(!reason) return null;
  const biz=l.seg==="Commercial", wrong=reason==="wrong person";
  const body=de(l)
    ? (wrong?"Entschuldigen Sie die Verwechslung, und danke für den Hinweis. Wir haben diesen Kontakt aus unserer Liste entfernt und schreiben Ihnen nicht mehr."
            :"Verstanden. Sie wurden abgemeldet und hören zu diesem Thema nicht mehr von uns. Alles Gute!")
    : (wrong?"Sorry for the mix-up, and thanks for letting us know. We've removed this contact from our list and won't message you again."
            :"Understood. You've been unsubscribed and won't hear from us again about this. All the best!");
  const hi=wrong?(de(l)?"Guten Tag":"Hello"):greet(l);
  return { reason, message:l.channel==="email"?`${hi},\n\n${body}\n\n${signoff(co,biz,l.lang)}`:body };
}

function useCountUp(target, ms=1100){
  const [v,setV]=useState(target);
  const from=useRef(target);
  useEffect(()=>{
    if(REDUCED){ setV(target); from.current=target; return; }
    const t0=performance.now(), a=from.current; let raf;
    const tick=t=>{ const k=Math.min(1,(t-t0)/ms), x=a+(target-a)*(1-Math.pow(1-k,3)); setV(x); from.current=x; if(k<1) raf=requestAnimationFrame(tick); };
    raf=requestAnimationFrame(tick);
    return ()=>cancelAnimationFrame(raf);
  },[target]);
  return v;
}

  const [ladder,setLadder]=useState(LADDER.map(s=>({ ...s, on:true })));
  const [txns,setTxns]=useState(INITIAL_TXNS);
  const [segFilter,setSegFilter]=useState("All");
  const [leadId,setLeadId]=useState(START_LEAD.id);
  const [convos,setConvos]=useState({});   // leadId -> [{role,text,time}]
  const [briefs,setBriefs]=useState({});   // leadId -> brief | "loading"
  const [activity,setActivity]=useState(SEED_ACTIVITY);
  const [typingId,setTypingId]=useState(null);
  const [input,setInput]=useState("");
  const [toast,setToast]=useState(null);
  const [party,setParty]=useState(null);   // { id, kind:"booked"|"paid" } while a celebration plays
  const [agentLang,setAgentLangState]=useState(()=>loadJSON("sw-agent-lang","en")==="de"?"de":"en");   // language for new conversations
  const [demoMode,setDemoMode]=useState(false);
  const [campaign,setCampaign]=useState(false);
  const [emailCfg,setEmailCfg]=useState({ enabled:false, inbox:null });
  const [policy,setPolicy]=useState(()=>({ ...POLICY_DEFAULT, ...loadJSON("sw-policy",{}) }));
  const [optOuts,setOptOuts]=useState(()=>loadJSON("sw-optouts",{}));   // contact key -> date unsubscribed
  const [held,setHeld]=useState([]);                                     // messages waiting for quiet hours to end
  const [showRules,setShowRules]=useState(false);
  const [unsub,setUnsub]=useState(DEEP_UNSUB?{ key:DEEP_UNSUB, fromApp:false }:null);
  const outboxRef=useRef({});   // contact key -> timestamps of proactive messages (for the sending limit)
  const heldRef=useRef([]);
  const mailQueue=useRef(Promise.resolve());
  const busy=useRef(new Set());
  const timers=useRef([]);
  const scrollRef=useRef(null);

  const company=COMPANIES.find(c=>c.id===companyId);
  const companyLeads=leads.filter(l=>l.co===companyId);
  const visibleLeads=companyLeads.filter(l=>segFilter==="All"||l.seg===segFilter);
  const lead=leads.find(l=>l.id===leadId)||companyLeads[0];
  const messages=(lead&&convos[lead.id])||[];
  const started=messages.length>0;
  const typing=lead&&typingId===lead.id;
  const pb=lead?PLAYBOOKS[lead.seg]:PLAYBOOKS.Residential;

  const kpi=useMemo(()=>{
    const v=visibleLeads, booked=v.filter(l=>l.status==="Booked");
    const contacted=v.filter(l=>l.status!=="Cold"), replied=v.filter(l=>l.status==="Warm"||l.status==="Booked");
    return {
      pipeline:v.filter(l=>l.status!=="Booked").reduce((s,l)=>s+l.quote,0),
      dormant:v.filter(l=>l.status!=="Booked").length,
      contacted:contacted.length, replied:replied.length,
      replyRate:contacted.length?Math.round(100*replied.length/contacted.length):0,
      booked:booked.length,
      adSaved:booked.reduce((s,l)=>s+ASSUME.cpa[l.seg],0),
      revenue:booked.reduce((s,l)=>s+l.quote,0)*ASSUME.closeRate,
      funnel:["Cold","Contacting","Warm","Booked"].map(s=>({ s, n:v.filter(l=>l.status===s).length })),
    };
  },[leads,companyId,segFilter]);
  // Session-only money for the header counter: live transactions have ids starting "TX-L".
  const woken=useMemo(()=>({
    booked:leads.filter(l=>l.status==="Booked").reduce((s,l)=>s+l.quote,0),
    collected:txns.filter(t=>t.id.startsWith("TX-L")&&t.dir==="in").reduce((s,t)=>s+t.amount,0),
  }),[leads,txns]);

  useEffect(()=>{ if(scrollRef.current) scrollRef.current.scrollTop=scrollRef.current.scrollHeight; },[messages.length,typing]);
  useEffect(()=>()=>timers.current.forEach(clearTimeout),[]);
  useEffect(()=>{ fetch("/api/email").then(r=>r.json()).then(d=>setEmailCfg({ enabled:!!d.enabled, inbox:d.inbox||null })).catch(()=>{}); },[]);
  useEffect(()=>{
    const onHash=()=>setPage(location.hash.startsWith("#app")?"app":"landing");
    window.addEventListener("hashchange",onHash); return ()=>window.removeEventListener("hashchange",onHash);
  },[]);
  useEffect(()=>{ document.body.style.background=page==="landing"||unsub?"#fff":C.night; document.documentElement.lang=page==="landing"&&!unsub?lang:"en"; },[page,lang,unsub]);
  useEffect(()=>saveJSON("sw-policy",policy),[policy]);
  // An unsubscribe in another tab of this browser (e.g. the link in a real email) updates this one.
  useEffect(()=>{
    const onStore=e=>{ if(e.key==="sw-optouts") setOptOuts(loadJSON("sw-optouts",{})); };
    window.addEventListener("storage",onStore); return ()=>window.removeEventListener("storage",onStore);
  },[]);
  // Release messages held for quiet hours once the sending window opens.
  useEffect(()=>{
    const t=setInterval(()=>{ const now=Date.now(); heldRef.current.filter(h=>h.at<=now).forEach(h=>releaseHeld(h,false)); },20000);
    return ()=>clearInterval(t);
  },[demoMode,emailCfg,optOuts]);

  const setLang=l=>{ setLangState(l); try{ localStorage.setItem("sw-lang",l); }catch{} };
  const setAgentLang=l=>{ setAgentLangState(l); saveJSON("sw-agent-lang",l); };
  // A conversation keeps the language it started in.
  const stampLang=ids=>setLeads(ls=>ls.map(x=>ids.includes(x.id)?{ ...x, lang:agentLang }:x));
  function openApp(t){ setTab(t||"console"); setPage("app"); if(location.hash!=="#app") location.hash="app"; window.scrollTo(0,0); }
  function goHome(){ setPage("landing"); history.replaceState(null,"",location.pathname); window.scrollTo(0,0); }

  // When the open lead's last message is from the customer, the agent answers it.
  useEffect(()=>{
    if(!lead||lead.status==="Booked") return;
    const m=convos[lead.id]||[];
    if(m.length && m[m.length-1].role==="customer") agentReply(lead, m);
  },[leadId, convos]);

  const later=(fn,ms)=>timers.current.push(setTimeout(fn,ms));
  const log=(text,kind="sys")=>setActivity(a=>[{ t:now(), text, kind }, ...a].slice(0,50));
  const flash=(text,color=C.green)=>{ setToast({text,color}); later(()=>setToast(null),4200); };
  const celebrate=kind=>{
    if(REDUCED) return;
    const id=Date.now()+Math.random();
    setParty({ id, kind }); later(()=>setParty(p=>p&&p.id===id?null:p),3000);
  };
  const setConvo=(id,fn)=>setConvos(c=>({ ...c, [id]:fn(c[id]||[]) }));
  const setLeadStatus=(id,status,extra={})=>setLeads(ls=>ls.map(l=>l.id!==id||l.status==="Booked"?l:{ ...l, status, ...extra }));

  function pickLead(id){ setLeadId(id); setInput(""); }
  function pickCompany(id){
    setCompanyId(id);
    // Prefer a cold business lead, then any cold lead.
    const rank=l=>(l.status==="Cold"?0:2)+(l.seg==="Commercial"?0:1);
    const f=leads.filter(l=>l.co===id).sort((a,b)=>rank(a)-rank(b))[0];
    if(f) pickLead(f.id);
  }
  function openPortal(id){
    if(id.startsWith("INV-")){ const i=invoices.find(x=>x.id===id); if(i){ setCompanyId(i.co); setInvId(id); } setTab("pay"); return; }
    const l=leads.find(x=>x.id===id); if(l){ setCompanyId(l.co); setLeadId(id); } setTab("portal");
  }

  function setChannel(id,channel){ setLeads(ls=>ls.map(l=>l.id===id?{ ...l, channel }:l)); }
  const openerMsg=l=>{ const o=PLAYBOOKS[l.seg].opener[l.channel](l,coOf(l)); return { id:msgId(), role:"agent", text:o.text, subject:o.subject, time:now() }; };
  const sentLog=l=>`${CHANNELS[l.channel].icon} ${PLAYBOOKS[l.seg].tag} ${l.channel==="email"?"email":"WhatsApp opener"} sent to ${l.name}`;

  // Live email: the agent's emails go out through /api/email (Resend). Leads only have dummy addresses and the
  // server redirects every email to the test inbox. Sends are spaced out to stay under Resend's rate limit.
  function deliver(l, msg){
    if(l.channel!=="email") return;
    mailOut({ to:l.email, subject:msg.subject, text:msg.text, fromName:`Lina · ${coOf(l).name}`, contactId:l.id, company:coOf(l).name, lang:l.lang||"en" }, l.name,
      d=>setConvo(l.id,ms=>ms.map(m=>m.id===msg.id?{ ...m, delivery:d }:m)));
  }
  function mailOut(payload, who, mark){
    if(demoMode||!emailCfg.enabled){ mark({ state:"off", note:demoMode?"Demo mode: not sent":"Live email off: shown in the app only" }); return; }
    mark({ state:"sending" });
    const job=mailQueue.current.then(async()=>{
      const res=await fetch("/api/email",{ method:"POST", headers:{"content-type":"application/json"},
        body:JSON.stringify({ ...payload, text:realLinks(payload.text) }) });
      const data=await res.json().catch(()=>({}));
      if(!res.ok) throw new Error(data.error||`HTTP ${res.status}`);
      return data;
    });
    mailQueue.current=job.catch(()=>{}).then(()=>sleep(600));
    job.then(()=>{ mark({ state:"sent" }); log(`📨 Real email delivered to the test inbox (${who})`,"out"); })
       .catch(e=>{ mark({ state:"error", note:e.message }); log(`⚠ Email for ${who} not sent: ${e.message}`,"sys"); });
  }

  // ---------- Sending rules: unsubscribes, sending limit, quiet hours ----------
  // Returns null when a message may go out now, otherwise why not (quiet hours also say when).
  function sendRule(target, proactive){
    const key=contactKey(target);
    if(optOuts[key]) return { kind:"optout", text:`${target.name} unsubscribed on ${fmtD(optOuts[key])}: nothing sent` };
    if(!proactive) return null;
    if(target.consent===false) return { kind:"consent", text:`No marketing consent on file for ${target.name}: in Germany, follow-up marketing to leads needs prior opt-in (UWG §7, GDPR), so nothing was sent` };
    const now=Date.now(), win=policy.capDays*864e5;
    const recent=(outboxRef.current[key]||[]).filter(t=>now-t<win);
    if(recent.length>=policy.capN) return { kind:"cap", text:`Sending limit (${policy.capN} per ${policy.capDays} day${policy.capDays>1?"s":""}) reached for ${target.name}: next allowed ${fmtWhen(new Date(Math.min(...recent)+win))}` };
    if(isQuiet(new Date(),target.seg,policy)){ const at=nextWindow(new Date(),target.seg,policy); return { kind:"quiet", at, text:`Quiet hours: scheduled for ${fmtWhen(at)}` }; }
    return null;
  }
  const noteSent=key=>{ outboxRef.current={ ...outboxRef.current, [key]:[...(outboxRef.current[key]||[]), Date.now()] }; };
  const markMsg=(kind,id,mid,d)=>(kind==="lead"?setConvo:setInvConvo)(id,ms=>ms.map(m=>m.id===mid?{ ...m, delivery:d }:m));
  function holdMsg(kind, target, msg, at){
    heldRef.current=[...heldRef.current,{ kind, id:target.id, key:contactKey(target), target, msg, at:at.getTime() }];
    setHeld(heldRef.current);
  }
  function releaseHeld(h, override){
    heldRef.current=heldRef.current.filter(x=>x.msg.id!==h.msg.id); setHeld(heldRef.current);
    noteSent(h.key);
    markMsg(h.kind,h.id,h.msg.id,{ state:"released", override });
    if(h.kind==="lead") deliver(h.target,h.msg); else deliverInv(h.target,h.msg);
    log(`⏰ ${override?"Staff override: sent":"Quiet hours over: sent"} the held message to ${h.target.name}`,"out");
  }
  function sendNow(mid){ const h=heldRef.current.find(x=>x.msg.id===mid); if(h) releaseHeld(h,true); }
  function optOut(key, how){
    setOptOuts(o=>{ if(o[key]) return o; const n={ ...o, [key]:ymd(today0()) }; saveJSON("sw-optouts",n); return n; });
    heldRef.current.filter(h=>h.key===key).forEach(h=>markMsg(h.kind,h.id,h.msg.id,{ state:"cancelled", note:"Cancelled: contact unsubscribed" }));
    heldRef.current=heldRef.current.filter(h=>h.key!==key); setHeld(heldRef.current);
    const c=contactInfo(key); log(`🚫 ${c?c.name:key} unsubscribed (${how}): all messages stopped`,"in");
  }
  function resubscribe(key){
    setOptOuts(o=>{ const n={ ...o }; delete n[key]; saveJSON("sw-optouts",n); return n; });
    const c=contactInfo(key); log(`✓ ${c?c.name:key} resubscribed`,"sys");
  }
  function openUnsub(key){ setUnsub({ key, fromApp:true }); window.scrollTo(0,0); }

  // ---------- Invoices: payment reminders, smart replies, payments ----------
  const setInvConvo=(id,fn)=>setInvConvos(c=>({ ...c, [id]:fn(c[id]||[]) }));
  const patchInv=(id,patch)=>setInvoices(v=>v.map(i=>i.id===id?{ ...i, ...patch }:i));
  const deliverInv=(inv,msg)=>mailOut({ to:inv.email, subject:msg.subject, text:msg.text, fromName:`${coOf(inv).name} Billing`, contactId:inv.cid, company:coOf(inv).name }, inv.name,
    d=>setInvConvo(inv.id,ms=>ms.map(m=>m.id===msg.id?{ ...m, delivery:d }:m)));
  const addTxn=t=>setTxns(v=>[{ id:`TX-L${Date.now()}${Math.floor(Math.random()*1000)}`, date:ymd(today0()), ...t }, ...v]);

  async function sendReminder(inv, step){
    if(busy.current.has(inv.id)) return;
    const rule=sendRule(inv,true);
    if(rule&&rule.kind!=="quiet"){ flash(rule.text,C.panel2); log(`🛡 ${inv.id}: ${rule.text}`,"sys"); return; }
    step=step||ladderStep(inv,ladder)||ladder[0];
    busy.current.add(inv.id); setInvTyping(inv.id);
    const co=coOf(inv);
    let text;
    if(!USE_CLAUDE||demoMode){ await sleep(700); text=reminderScript(inv,co,step); }
    else{
      try{ text=parseBilling(await callClaude(billingSystem(inv,co,step),[{ role:"user", content:`(Write the "${step.name}" email for this invoice now.)` }])).message; }
      catch{ text=reminderScript(inv,co,step); }
    }
    const msg={ id:msgId(), role:"agent", text, subject:reminderSubject(inv,step), time:now(), step:step.name,
      delivery:rule?{ state:"held", note:rule.text }:undefined };
    setInvConvo(inv.id,m=>[...m,msg]);
    if(rule){ holdMsg("inv",inv,msg,rule.at); log(`⏰ ${step.name} for ${inv.id}: ${rule.text}`,"sys"); }
    else{ noteSent(inv.cid); deliverInv(inv,msg); log(`📨 ${step.name} sent for ${inv.id} (${inv.name})`,"out"); }
    setInvoices(v=>v.map(i=>i.id===inv.id?{ ...i, sent:[...i.sent,{ key:step.key, date:ymd(today0()) }] }:i));
    setInvTyping(t=>t===inv.id?null:t); busy.current.delete(inv.id);
  }

  function sendDueReminders(list){
    if(!list.length){ flash("No reminders are due right now",C.panel2); return; }
    log(`🚀 Sending ${list.length} due reminder${list.length>1?"s":""}`,"sys");
    list.forEach((inv,k)=>later(()=>sendReminder(inv),k*900));
  }

  function invCustomerSend(inv, text){
    const prev=invConvos[inv.id]||[];
    if(busy.current.has(inv.id)||!prev.length) return;
    const cm={ id:msgId(), role:"customer", text:text.trim(), subject:prev[0].subject?`Re: ${prev[0].subject}`:undefined, time:now() };
    const history=[...prev,cm];
    setInvConvo(inv.id,()=>history);
    invAgentReply(inv,history);
  }

  async function invAgentReply(inv, history){
    const co=coOf(inv), last=history[history.length-1].text;
    if(STOP_WORDS.test(last)&&!optOuts[inv.cid]){
      optOut(inv.cid,"replied STOP");
      setInvConvo(inv.id,()=>[...history,{ id:msgId(), role:"agent", time:now(), subject:history[0].subject?`Re: ${history[0].subject}`:undefined,
        text:`${billHi(inv)}\n\nUnderstood. We've stopped all reminder emails to you. ${inv.id} stays payable whenever suits you:\n${payUrl(inv,co)}\n\n${billSign(co)}`,
        delivery:{ state:"off", note:"Confirmation of the unsubscribe; no further emails" } }]);
      return;
    }
    if(optOuts[inv.cid]){ log(`🚫 ${inv.name} is unsubscribed: no reply sent`,"sys"); return; }
    busy.current.add(inv.id); setInvTyping(inv.id);
    let intent=classifyReply(history[history.length-1].text), text, promise=null;
    if(!USE_CLAUDE||demoMode){ await sleep(800); text=replyScript(inv,co,intent); }
    else{
      try{
        const msgs=[{ role:"user", content:"(Billing thread opened. You sent the first email below.)" },
          ...history.map(m=>({ role:m.role==="agent"?"assistant":"user", content:m.text }))];
        const r=parseBilling(await callClaude(billingSystem(inv,co,ladderStep(inv,ladder)), msgs));
        text=r.message; promise=r.promise_date||null;
        if(Object.prototype.hasOwnProperty.call(INTENT_FLAG,r.intent)) intent=r.intent;
      }catch{ text=replyScript(inv,co,intent); }
    }
    const msg={ id:msgId(), role:"agent", text, subject:history[0].subject?`Re: ${history[0].subject}`:undefined, time:now() };
    setInvConvo(inv.id,()=>[...history,msg]);
    deliverInv(inv,msg);
    const flag=intent==="promise"?`Payment promised${promise?`: ${promise}`:""}`:INTENT_FLAG[intent];
    if(flag) patchInv(inv.id,{ flag });
    log(`💬 ${inv.name} replied on ${inv.id}${flag?` → ${flag}`:""}`,"in");
    setInvTyping(t=>t===inv.id?null:t); busy.current.delete(inv.id);
  }

  function markInvoicePaid(inv, method, via){
    if(inv.paid) return;
    patchInv(inv.id,{ paid:ymd(today0()), method, flag:null });
    addTxn({ co:inv.co, party:inv.name, seg:inv.seg, type:"Payment received", dir:"in", amount:inv.amount, method, ref:inv.id, doc:`Payment-${inv.id}.pdf`, account:"Bank" });
    flash(`✓ ${inv.id} paid — ${eur(inv.amount)}`);
    celebrate("paid");
    log(`💶 ${inv.name} paid ${inv.id} (${eur(inv.amount)}) ${via}`,"win");
  }
  function startInstalments(inv){
    const part=Math.round(inv.amount/3);
    patchInv(inv.id,{ flag:"Instalment plan: 1 of 3 paid" });
    addTxn({ co:inv.co, party:inv.name, seg:inv.seg, type:"Instalment received", dir:"in", amount:part, method:"Card", ref:inv.id, doc:`Instalment-1-${inv.id}.pdf`, account:"Bank" });
    flash(`✓ Instalment plan started for ${inv.id} — ${eur(part)} paid`);
    celebrate("paid");
    log(`💶 ${inv.name} started a 3-month plan on ${inv.id} (${eur(part)} paid)`,"win");
  }
  function reportProblem(inv){
    patchInv(inv.id,{ flag:"Disputed: reminders paused" });
    flash(`Reminders paused for ${inv.id}; service team notified`,C.panel2);
    log(`⚠ ${inv.name} reported a problem on ${inv.id}: reminders paused, service team notified`,"in");
  }

  function start(){
    if(started||!lead) return;
    const rule=sendRule(lead,true);
    if(rule&&rule.kind!=="quiet"){ flash(rule.text,C.panel2); log(`🛡 ${rule.text}`,"sys"); return; }
    const l={ ...lead, lang:agentLang }; stampLang([l.id]);
    const msg={ ...openerMsg(l), delivery:rule?{ state:"held", note:rule.text }:undefined };
    setConvo(l.id,()=>[msg]);
    if(l.status==="Cold") setLeadStatus(l.id,"Contacting");
    if(rule){ holdMsg("lead",l,msg,rule.at); log(`⏰ ${l.name}: ${rule.text}`,"sys"); return; }
    noteSent(l.id); deliver(l, msg);
    log(sentLog(l),"out");
  }

  function send(text){
    const clean=(text||"").trim(); if(!clean||typing||!started||!lead) return;
    setInput("");
    setConvo(lead.id,m=>[...m,{ id:msgId(), role:"customer", text:clean, time:now() }]);
  }

  async function agentReply(l, history){
    if(busy.current.has(l.id)) return;
    const co=coOf(l), play=PLAYBOOKS[l.seg], last=history[history.length-1].text;
    const guard=leadGuard(l,co,last);
    if(guard&&!optOuts[l.id]){
      optOut(l.id,guard.reason);
      setConvo(l.id,()=>[...history,{ id:msgId(), role:"agent", time:now(), subject:history[0].subject?`Re: ${history[0].subject}`:undefined,
        text:guard.message, delivery:l.channel==="email"?{ state:"off", note:"Confirmation of the unsubscribe; no further emails" }:undefined }]);
      return;
    }
    if(optOuts[l.id]) return;
    busy.current.add(l.id);
    setTypingId(l.id);
    let reply=null;
    if(USE_CLAUDE&&!demoMode){
      try{ reply=parseAgent(await callClaude(play.system(l,co,l.channel), toApi(history))); }catch{ reply=null; }
    }
    if(!reply){ await sleep(900); reply=leadReply(l,co,history); }
    const subject=history[0].subject?`Re: ${history[0].subject}`:undefined;
    const msg={ id:msgId(), role:"agent", text:reply.message, subject, time:now() };
    const full=[...history,msg];
    setConvo(l.id,()=>full);
    deliver(l, msg);
    setTypingId(t=>t===l.id?null:t);
    busy.current.delete(l.id);
    if(reply.status==="booked"&&reply.appointment) markBooked(l, reply.appointment, `via the ${l.channel==="email"?"email":"WhatsApp"} agent`, full);
    else if(reply.status==="warm") setLeadStatus(l.id,"Warm");
  }

  function markBooked(l, appointment, via, history){
    setLeadStatus(l.id,"Booked",{ appointment, via });
    flash(`✓ ${l.name} booked — ${appointment} 🎉`);
    celebrate("booked");
    log(`📅 ${l.name} booked ${appointment} ${via}`,"win");
    makeBrief(l, history, via);
  }

  async function makeBrief(l, history, via){
    const co=coOf(l);
    setBriefs(b=>({ ...b, [l.id]:"loading" }));
    let brief;
    try{
      if(!USE_CLAUDE||demoMode||!history.length) throw new Error("templates");
      const transcript=history.map(m=>`${m.role==="agent"?"Agent":"Lead"}: ${m.text}`).join("\n");
      const raw=await callClaude(BRIEF_SYSTEM,[{ role:"user", content:`Lead: ${l.name} (${l.seg}, ${l.kw} kW, quote ${eur(l.quote)}, stalled on "${l.lost}"${l.dm?`, decision-maker ${l.dm}`:""}). Booked ${via}.\n\nTranscript:\n${transcript}` }]);
      const t=raw.slice(raw.indexOf("{"), raw.lastIndexOf("}")+1);
      brief={ ...JSON.parse(t), ai:true };
    }catch{ brief=heuristicBrief(l, co, history, via); }
    setBriefs(b=>({ ...b, [l.id]:brief }));
    log(`📋 Advisor brief for ${l.name} pushed to CRM`,"sys");
  }

  // Bulk reactivation across every cold lead in the current view (replies are simulated).
  function runCampaign(){
    const targets=visibleLeads.filter(l=>l.status==="Cold");
    if(campaign) return;
    if(!targets.length){ flash("No cold leads left in this view",C.panel2); return; }
    setCampaign(true);
    log(`🚀 Campaign launched — ${targets.length} dormant lead${targets.length>1?"s":""} at ${company.name} (${segFilter==="All"?"B2C + B2B":PLAYBOOKS[segFilter].tag})`,"sys");
    let last=0;
    stampLang(targets.map(l=>l.id));
    targets.forEach((l0,i)=>{
      const l={ ...l0, lang:agentLang }, play=PLAYBOOKS[l.seg], rule=sendRule(l,true);
      if(rule&&rule.kind!=="quiet"){ later(()=>log(`🛡 Skipped: ${rule.text}`,"sys"),400+i*450); return; }
      if(!rule) noteSent(l.id);
      later(()=>{
        const msg={ ...openerMsg(l), delivery:rule?{ state:"held", note:rule.text }:undefined };
        setConvo(l.id,m=>m.length?m:[msg]);
        setLeadStatus(l.id,"Contacting");
        if(rule){ holdMsg("lead",l,msg,rule.at); log(`⏰ ${l.name}: ${rule.text}`,"sys"); }
        else{ deliver(l, msg); log(sentLog(l),"out"); }
      }, 400+i*450);
      if(!rule&&hash(l.id)<0.6){
        const pool=play.replies[agentLang], reply=pool[Math.floor(hash(l.id+"r")*pool.length)];
        const at=2600+i*700; last=Math.max(last,at);
        later(()=>{
          setConvo(l.id,m=>[...m,{ id:msgId(), role:"customer", text:reply, subject:m[0]&&m[0].subject?`Re: ${m[0].subject}`:undefined, time:now() }]);
          setLeadStatus(l.id,"Warm");
          log(`💬 ${l.name}: "${reply}"`,"in");
        }, at);
      }
    });
    later(()=>{ setCampaign(false); log("✅ Campaign wave sent — open a warm lead to watch the agent pick it up","sys"); }, Math.max(last, 400+targets.length*450)+600);

          <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
            <button onClick={()=>setDemoMode(d=>!d)} title="Rehearsal mode never sends real emails. Use it to practise the demo."
              style={{display:"inline-flex",alignItems:"center",gap:7,fontSize:12,fontWeight:700,cursor:"pointer",
                color:demoMode?C.night:C.sub,background:demoMode?C.gold:C.panel,border:`1px solid ${demoMode?C.gold:C.line}`,padding:"7px 12px",borderRadius:999}}>
              <span style={{width:7,height:7,borderRadius:999,background:demoMode?C.night:C.green}}/> {demoMode?"Rehearsal: nothing sent":"Live mode"}
            </button>

// Email channel: an inbox-style thread. You reply as the business; the agent answers by email.

  useEffect(()=>{ if(ref.current) ref.current.scrollTop=ref.current.scrollHeight; },[messages.length,typing]);
  const contact=biz&&lead.dm?dmName(lead):lead.name;
  const subject=messages[0]&&messages[0].subject;
  const canReply=started&&!typing&&lead.status!=="Booked";
  const submit=t=>{ if(!canReply||!(t||"").trim()) return; send(t); setDraft(""); };
  const ink="#1F2937", muted="#6B7280", line="#E5E7EB";

  return (
    <div style={{background:"#fff",borderRadius:16,overflow:"hidden",display:"flex",flexDirection:"column",height:656,boxShadow:"0 20px 50px rgba(0,0,0,.5)",color:ink}}>

        <span style={{fontSize:18}}>✉️</span>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontWeight:700,fontSize:14}}>Inbox · {agentEmail(co)}</div>
          <div style={{fontSize:11.5,opacity:.85,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{typing?"Lina is drafting a reply…":`Thread with ${contact} <${lead.email}> · fictional test contact`}</div>
        </div>
      </div>
      {subject&&<div style={{padding:"10px 14px",borderBottom:`1px solid ${line}`,fontWeight:800,fontSize:14.5}}>{subject}</div>}
      {optedOut&&started&&<div style={{padding:"7px 14px",background:"#FEE2E2",color:"#991B1B",fontSize:12.5,fontWeight:700}}>🚫 Unsubscribed on {fmtD(optedOut)}: no further emails will be sent.</div>}

      <div ref={ref} style={{flex:1,overflowY:"auto",padding:12,display:"flex",flexDirection:"column",gap:10,background:"#F3F4F6"}}>
        {!started&&(
          <div style={{margin:"auto",textAlign:"center",color:muted,maxWidth:270}}>
            {lead.status==="Booked" ? (
              <div style={{fontSize:13,lineHeight:1.5}}>✅ {lead.name} booked <b>{lead.appointment}</b> {lead.via||""}. No email needed.</div>
            ) : (
              <>
                <div style={{fontSize:13,marginBottom:14,lineHeight:1.5}}>
                  {biz?"Many businesses ignore vendor WhatsApps, so ":""}SolarWake will reach <b>{contact}</b> by email using the <b>{pb.label.toLowerCase()}</b>.
                </div>
                {optedOut ? <div style={{fontSize:13,fontWeight:700,color:"#B91C1C"}}>🚫 Unsubscribed on {fmtD(optedOut)}: no emails will be sent.</div>

                  : <button onClick={start} style={{background:"#1E3A8A",color:"#fff",border:"none",padding:"11px 20px",borderRadius:999,fontWeight:700,fontSize:14,cursor:"pointer"}}>✉️ Send reactivation email</button>}
              </>
            )}

        )}
        {messages.map((m,i)=>{

              {!mine&&<UnsubFooter lang={lead.lang} onUnsub={()=>openUnsub(lead.id)}/>}
            </div>

        {typing&&(
          <div style={{background:"#fff",border:`1px solid ${line}`,borderRadius:10,padding:"10px 12px",fontSize:12.5,color:muted}}>

          <div style={{display:"flex",gap:6,overflowX:"auto",marginBottom:8}}>
            {pb.quick[lead.lang||"en"].map(q=>(
              <button key={q} onClick={()=>submit(q)} disabled={!canReply}
                style={{whiteSpace:"nowrap",fontSize:12,background:"#EEF2FF",color:"#1E3A8A",border:"1px solid #C7D2FE",padding:"5px 10px",borderRadius:999,cursor:canReply?"pointer":"default",opacity:canReply?1:.5,fontWeight:600}}>{q}</button>
            ))}
          </div>
          <div style={{display:"flex",gap:8,alignItems:"flex-end"}}>
            <textarea value={draft} onChange={e=>setDraft(e.target.value)} disabled={!canReply} rows={2}
              onKeyDown={e=>{ if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)) submit(draft); }}
              placeholder={`Write a reply as ${contact}… (Ctrl+Enter to send)`}
              style={{flex:1,resize:"none",border:`1px solid ${line}`,borderRadius:10,padding:"8px 10px",fontSize:13.5,fontFamily:"inherit",outline:"none",color:ink}}/>
            <button onClick={()=>submit(draft)} disabled={!canReply||!draft.trim()}
              style={{background:"#1E3A8A",color:"#fff",border:"none",borderRadius:10,padding:"10px 14px",fontWeight:700,fontSize:13,cursor:"pointer",opacity:canReply&&draft.trim()?1:.5}}>Send</button>
          </div>
        </div>
      )}
    </div>
  );
}

function Slider({label:l, value, set, min, max, step=1, fmt, dark=true}){
  return (
    <label style={{display:"block",marginBottom:12}}>
      <div style={{display:"flex",justifyContent:"space-between",fontSize:12.5,marginBottom:4}}>
        <span style={{color:dark?C.sub:C.pSub}}>{l}</span><b style={{color:dark?C.text:C.pInk}}>{fmt?fmt(value):value}</b>
      </div>
      <input type="range" min={min} max={max} step={step} value={value} onChange={e=>set(Number(e.target.value))}/>
    </label>
  );
}

// Sales tool for pitching SolarWake to an installer: "what is your dead pipeline worth?"
function ROICalc(){
  const [n,setN]=useState(400), [avg,setAvg]=useState(16000), [book,setBook]=useState(10), [close,setClose]=useState(30);
  const bookings=Math.round(n*book/100), installs=Math.round(bookings*close/100);
  return (
    <div style={panel}>
      <div style={{...label,marginBottom:2}}>ROI calculator · for installers</div>
      <div style={{fontSize:16,fontWeight:800,marginBottom:12}}>What is your dead pipeline worth?</div>
      <Slider label="Dormant quotes in your CRM" value={n} set={setN} min={50} max={3000} step={50}/>
      <Slider label="Average quote value" value={avg} set={setAvg} min={6000} max={80000} step={1000} fmt={eur}/>
      <Slider label="Reactivated → booked call" value={book} set={setBook} min={2} max={25} fmt={v=>v+"%"}/>
      <Slider label="Booked call → signed install" value={close} set={setClose} min={10} max={60} fmt={v=>v+"%"}/>
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginTop:4}}>
        {[["Booked calls",bookings],["Signed installs",installs],["Recovered revenue",eur(installs*avg)]].map(([k,v],i)=>(
          <div key={k} style={{background:C.panel2,borderRadius:11,padding:"10px 11px"}}>
            <div style={{fontSize:i===2?17:22,fontWeight:800,color:i===2?C.gold:C.text}}>{v}</div>
            <div style={{fontSize:11,color:C.sub}}>{k}</div>
          </div>
        ))}
      </div>
      <div style={{fontSize:11,color:C.sub,marginTop:10}}>
        Replacing those calls with paid ads would cost ≈ <b style={{color:C.text}}>{eur(bookings*ASSUME.cpa.Residential)}</b> (at {eur(ASSUME.cpa.Residential)} per booked appointment). Rates are illustrative assumptions — plug in the installer's own numbers.
      </div>
    </div>
  );
}

              </div>

              <>
                <div style={{fontWeight:800,marginBottom:2}}>{biz?"Book a 20-minute call with our commercial advisor":"Book your free 15-minute advisor call"}</div>
                <div style={{fontSize:12.5,color:C.pSub,marginBottom:12}}>{biz?"Bring your CFO or decision-maker — we'll walk through the numbers together.":"No obligation. We'll go through your numbers and answer every question."}</div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(150px,1fr))",gap:10}}>
                  {days.map(d=>(
                    <div key={d.toISOString()}>
                      <div style={{fontSize:12,fontWeight:800,marginBottom:6}}>{dayLabel(d)}</div>
                      <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
                        {times.map(t=>{
                          const v=`${dayLabel(d)} at ${t}`, on=slot===v;
                          return <button key={t} onClick={()=>setSlot(v)} style={{fontSize:12,fontWeight:700,padding:"5px 8px",borderRadius:8,cursor:"pointer",
                            border:`1.5px solid ${on?brand:C.pLine}`,background:on?brand:"#fff",color:on?"#fff":C.pInk}}>{t}</button>;
                        })}
                      </div>
                    </div>
                  ))}
                </div>
                <button onClick={()=>slot&&onBook(lead,slot)} disabled={!slot}
                  style={{marginTop:14,width:"100%",padding:"12px 0",borderRadius:11,border:"none",fontWeight:800,fontSize:15,cursor:slot?"pointer":"default",
                    background:slot?brand:"#CBD5E1",color:"#fff"}}>
                  {slot?`Confirm ${slot}`:"Pick a time above"}
                </button>
              </>
            )}
          </div>

          <div style={{fontSize:11,color:C.pSub,padding:"14px 22px 0",lineHeight:1.5}}>
            Estimates use {ECON.yieldKwh[co.country]} kWh/kWp per year, {Math.round(e.price*100)} ct/kWh grid price rising {ECON.inflation*100}%/yr, {Math.round(e.feedIn*100)} ct/kWh feed-in and {ECON.degradation*100}%/yr panel degradation. Example financing rate. Your advisor will confirm exact figures.
          </div>
        </div>
      </div>
    </>
  );
}

function InvoicesView(p){
  const { companyId, setCompanyId, invoices, inv, setInvId, ladder, setLadder, convo, typing, sendReminder, sendDue, customerSend, markPaid, openPay, optOuts, openUnsub, sendNow } = p;
  const [filter,setFilter]=useState("All");
  const company=COMPANIES.find(c=>c.id===companyId);
  const coInv=invoices.filter(i=>i.co===companyId);
  const open=coInv.filter(i=>!i.paid), overdue=open.filter(i=>invDays(i)>0), paidList=coInv.filter(i=>i.paid);
  const avgDays=paidList.length?Math.round(paidList.reduce((s,i)=>s+daysBetween(parseYmd(i.issued),parseYmd(i.paid)),0)/paidList.length):0;
  const sum=l=>l.reduce((s,i)=>s+i.amount,0);
  const buckets=[["Not yet due",i=>invDays(i)<=0],["1–30 days late",i=>invDays(i)>=1&&invDays(i)<=30],["31–60 days late",i=>invDays(i)>=31&&invDays(i)<=60],["60+ days late",i=>invDays(i)>60]]
    .map(([k,f],n)=>({ k, v:sum(open.filter(f)), color:["#7DD3FC",C.goldSoft,"#FDBA74","#FCA5A5"][n] }));
  const maxB=Math.max(1,...buckets.map(b=>b.v));
  const FILTERS={ All:()=>true, Overdue:i=>!i.paid&&invDays(i)>0, "Due soon":i=>!i.paid&&invDays(i)<=0&&invDays(i)>=-7, Paid:i=>!!i.paid, "Needs attention":i=>!!i.flag&&!i.paid };
  const list=coInv.filter(FILTERS[filter]).sort((a,b)=>(a.paid?1:0)-(b.paid?1:0)||invDays(b)-invDays(a));
  const dueList=coInv.filter(i=>reminderDue(i,ladder)&&!optOuts[i.cid]);

  return (
    <>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,marginBottom:12,flexWrap:"wrap"}}>
        <div style={{display:"flex",alignItems:"center",gap:9,flexWrap:"wrap"}}>
          <span style={label}>Installer</span>
          <select aria-label="Installer" value={companyId} onChange={e=>setCompanyId(e.target.value)}
            style={{background:C.panel2,color:C.text,border:`1px solid ${C.line}`,borderRadius:9,padding:"7px 10px",fontSize:13,fontWeight:600,outline:"none"}}>
            {COMPANIES.map(c=><option key={c.id} value={c.id}>{c.name} — {c.city}</option>)}
          </select>
        </div>
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}} role="group" aria-label="Filter invoices">
          {Object.keys(FILTERS).map(k=>{
            const on=filter===k;
            return <button key={k} onClick={()=>setFilter(k)} aria-pressed={on} style={{fontSize:12,fontWeight:700,cursor:"pointer",padding:"6px 12px",borderRadius:999,
              background:on?C.gold:C.panel,color:on?C.night:C.sub,border:`1px solid ${on?C.gold:C.line}`}}>{k}</button>;
          })}
        </div>
      </div>

      <div className="sw-kpi" style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginBottom:12}}>
        {[
          {k:"Outstanding",v:eur(sum(open)),sub:`${open.length} open invoice${open.length===1?"":"s"}`},
          {k:"Overdue",v:eur(sum(overdue)),sub:`${overdue.length} invoice${overdue.length===1?"":"s"} past due`,hot:true},
          {k:"Average days to get paid",v:`${avgDays} days`,sub:`across ${paidList.length} paid invoices`},
          {k:"Needs attention",v:String(coInv.filter(i=>i.flag&&!i.paid).length),sub:"promises, plans, disputes"},
        ].map(s=>(
          <div key={s.k} style={{background:C.panel,border:`1px solid ${C.line}`,borderRadius:14,padding:"13px 14px"}}>
            <div style={{fontSize:s.v.length>9?20:24,fontWeight:800,color:s.hot?"#FCA5A5":C.text}}>{s.v}</div>
            <div style={{fontSize:12,fontWeight:600,marginTop:2}}>{s.k}</div>
            <div style={{fontSize:10.5,color:C.sub,marginTop:1}}>{s.sub}</div>
          </div>
        ))}
      </div>

      <div className="sw-2col" style={{display:"grid",gridTemplateColumns:"minmax(0,1fr) minmax(0,1fr)",gap:14,marginBottom:14}}>
        <div style={{...panel,padding:14}}>
          <div style={{...label,marginBottom:10}}>Unpaid by age</div>
          {buckets.map(b=>(
            <div key={b.k} style={{display:"grid",gridTemplateColumns:"120px 1fr 90px",alignItems:"center",gap:10,marginBottom:8,fontSize:12.5}}>
              <span style={{color:C.sub}}>{b.k}</span>
              <div style={{height:9,background:C.night,borderRadius:99,overflow:"hidden"}}><div style={{height:"100%",width:`${100*b.v/maxB}%`,background:b.color,borderRadius:99,transition:"width .5s"}}/></div>
              <b style={{textAlign:"right"}}>{eur(b.v)}</b>
            </div>
          ))}
          <button onClick={()=>sendDue(dueList)} style={{marginTop:6,width:"100%",background:dueList.length?C.gold:C.panel2,color:dueList.length?C.night:C.sub,border:"none",borderRadius:11,padding:"10px 14px",fontWeight:800,fontSize:13.5,cursor:"pointer"}}>
            📨 Send all due reminders ({dueList.length})
          </button>
        </div>
        <div style={{...panel,padding:14}}>
          <div style={{...label,marginBottom:4}}>Reminder schedule</div>
          <div style={{fontSize:11.5,color:C.sub,marginBottom:10}}>From a smile to a salute: each step gets firmer, never rude. Reminders stop the moment a customer pays, promises a date or reports a problem.</div>
          {ladder.map((st,k)=>(
            <label key={st.key} style={{display:"flex",alignItems:"center",gap:10,fontSize:12.5,padding:"5px 0",cursor:"pointer",opacity:st.on?1:.55}}>
              <input type="checkbox" checked={st.on} onChange={e=>setLadder(l=>l.map((x,j)=>j===k?{ ...x, on:e.target.checked }:x))} style={{accentColor:C.gold,width:16,height:16}}/>
              <span style={{width:74,color:C.sub,fontVariantNumeric:"tabular-nums"}}>{st.offset<0?`${-st.offset} days before`:st.offset===0?"On due date":`${st.offset} days after`}</span>
              <span aria-hidden="true" style={{fontSize:17,width:22,textAlign:"center"}}>{st.mood}</span>
              <b>{st.name}</b>
              <span style={{flex:1,height:4,borderRadius:9,marginLeft:4,background:`linear-gradient(90deg,#7DD3FC,${["#7DD3FC","#A7F3D0","#FDE68A","#FDBA74","#FCA5A5"][k]})`,opacity:.5}}/>
            </label>
          ))}
          <div style={{fontSize:11,color:C.sub,marginTop:6}}>B2B: after a final notice, EU late-payment rules allow a flat €40 compensation plus statutory interest. SolarWake flags it for you; it never adds fees on its own.</div>
        </div>
      </div>

      <div className="sw-grid" style={{display:"grid",gridTemplateColumns:"minmax(0,1fr) 400px",gap:18,alignItems:"start"}}>
        <div style={panel}>
          <div style={{...label,marginBottom:8}}>Invoices — {company.name}</div>
          <div style={{display:"flex",flexDirection:"column",gap:8,maxHeight:560,overflowY:"auto",paddingRight:2}}>
            {list.map(i=>{
              const st=invStatus(i), active=inv&&i.id===inv.id, step=ladderStep(i,ladder);
              return (
                <button key={i.id} onClick={()=>setInvId(i.id)} aria-pressed={active}
                  style={{textAlign:"left",display:"flex",alignItems:"center",gap:11,background:active?C.panel2:C.night,border:`1px solid ${active?C.gold:C.line}`,borderRadius:11,padding:"10px 12px",cursor:"pointer",width:"100%",color:C.text}}>
                  <div style={{width:30,height:30,borderRadius:999,background:"#243352",display:"grid",placeItems:"center",fontSize:14,flexShrink:0}}>{PLAYBOOKS[i.seg].icon}</div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{display:"flex",alignItems:"center",gap:6}}>
                      <span style={{fontSize:13,fontWeight:600,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{i.name}</span>
                      <SegBadge seg={i.seg} small/>
                    </div>
                    <div style={{fontSize:11,color:C.sub}}>{i.id} · {i.milestone} · due {fmtD(i.due)}{optOuts[i.cid]&&!i.paid?" · 🚫 unsubscribed":i.flag?` · ${i.flag}`:step&&!i.paid?` · next: ${step.mood} ${step.name}`:""}</div>
                  </div>
                  <div style={{textAlign:"right",flexShrink:0}}>
                    <div style={{fontSize:13,fontWeight:800}}>{eur(i.amount)}</div>
                    <div style={{fontSize:11,fontWeight:700,color:st.color}}>{st.label}</div>
                  </div>
                </button>
              );
            })}
            {!list.length&&<div style={{fontSize:12,color:C.sub,padding:10}}>No invoices match this filter.</div>}
          </div>
        </div>
        <InvoicePane key={inv?inv.id:"none"} optedOut={inv&&optOuts[inv.cid]} {...{inv,convo,typing,ladder,sendReminder,customerSend,markPaid,openPay,openUnsub,sendNow}}/>
      </div>
    </>
  );
}

function InvoicePane({ inv, convo, typing, ladder, sendReminder, customerSend, markPaid, openPay, optedOut, openUnsub, sendNow }){
  const [draft,setDraft]=useState("");
  const ref=useRef(null);
  useEffect(()=>{ if(ref.current) ref.current.scrollTop=ref.current.scrollHeight; },[convo.length,typing]);
  if(!inv) return <div style={panel}>No invoices for this installer.</div>;
  const co=coOf(inv), st=invStatus(inv), step=ladderStep(inv,ladder)||ladder[0];
  const started=convo.length>0, canReply=started&&!typing&&!inv.paid;
  const submit=t=>{ if(!canReply||!(t||"").trim()) return; customerSend(inv,t); setDraft(""); };
  const muted="#6B7280", line="#E5E7EB";
  const btn=(bg,fg)=>({ background:bg, color:fg, border:"none", borderRadius:9, padding:"8px 11px", fontWeight:700, fontSize:12.5, cursor:"pointer" });

  return (
    <div style={{background:"#fff",borderRadius:16,overflow:"hidden",display:"flex",flexDirection:"column",height:700,boxShadow:"0 20px 50px rgba(0,0,0,.5)",color:"#1F2937"}}>
      <div style={{background:"#1E3A8A",color:"#fff",padding:"11px 14px"}}>
        <div style={{fontWeight:700,fontSize:14}}>💶 Billing inbox · {billEmail(co)}</div>
        <div style={{fontSize:11.5,opacity:.85,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{typing?"Lina is drafting…":`${inv.contact} <${inv.email}> · fictional test contact`}</div>
      </div>
      <div style={{padding:"10px 14px",borderBottom:`1px solid ${line}`}}>
        <div style={{display:"flex",justifyContent:"space-between",gap:8,alignItems:"baseline"}}>
          <b style={{fontSize:14.5}}>{inv.id} · {inv.milestone} ({Math.round(inv.pct*100)}%)</b>
          <b style={{fontSize:16}}>{eur(inv.amount)}</b>
        </div>
        <div style={{fontSize:12,color:muted,marginTop:2}}>
          {inv.name}{inv.po?` · ${inv.po}`:""} · issued {fmtD(inv.issued)} · due {fmtD(inv.due)} · <b style={{color:inv.paid?"#15803D":invDays(inv)>0?"#B91C1C":muted}}>{inv.paid?`Paid ${fmtD(inv.paid)}`:st.label}</b>
        </div>
        {inv.flag&&!inv.paid&&<div style={{marginTop:6,display:"inline-block",fontSize:11.5,fontWeight:700,color:"#92400E",background:"#FEF3C7",padding:"3px 9px",borderRadius:999}}>⏸ {inv.flag}</div>}
        {!inv.paid&&(
          <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:8}}>
            {optedOut ? <span style={{...btn("#FEE2E2","#991B1B"),cursor:"default"}}>🚫 Unsubscribed {fmtD(optedOut)}</span>
              : <button onClick={()=>sendReminder(inv,step)} disabled={typing} style={{...btn("#1E3A8A","#fff"),opacity:typing?.5:1}}>{step.mood} Send “{step.name}”</button>}
            <button onClick={()=>markPaid(inv,"SEPA transfer","by bank transfer (marked manually)")} style={btn("#DCFCE7","#166534")}>✓ Mark as paid</button>
            <button onClick={()=>openPay(inv.id)} style={btn("#F3F4F6","#1F2937")}>Pay page ↗</button>
          </div>
        )}
        {!inv.paid&&!optedOut&&(
          <div style={{display:"flex",alignItems:"center",gap:8,marginTop:8,fontSize:11.5,color:muted}}>
            <span>Reminder tone</span><MoodMeter ladder={ladder} current={ladderStep(inv,ladder)}/>
          </div>
        )}
      </div>

      <div ref={ref} style={{flex:1,overflowY:"auto",padding:12,display:"flex",flexDirection:"column",gap:10,background:"#F3F4F6"}}>
        {!started&&(
          <div style={{margin:"auto",textAlign:"center",color:muted,maxWidth:280,fontSize:13,lineHeight:1.5}}>
            {inv.paid?`✅ Paid on ${fmtD(inv.paid)} by ${inv.method||"transfer"}. Nothing to chase.`
              :<>No reminders sent yet. The next step on the schedule is <b>{step.name}</b>, written for a {inv.seg==="Commercial"?"business accounts team":"homeowner"}.</>}
          </div>
        )}
        {convo.map(m=>{
          const mine=m.role==="customer";
          return <MailCard key={m.id} m={m} mine={mine} from={mine?inv.contact:`Lina · ${co.name} Billing`} onUnsub={()=>openUnsub(inv.cid)} onSendNow={()=>sendNow(m.id)}
            route={mine?`${inv.email} → ${billEmail(co)}`:`${billEmail(co)} → ${inv.email}`} openLink={openPay}/>;
        })}
        {typing&&<div style={{background:"#fff",border:`1px solid ${line}`,borderRadius:10,padding:"10px 12px",fontSize:12.5,color:muted}}><span className="sw-dots"><i/><i/><i/></span> Lina is drafting…</div>}
      </div>

      {started&&!inv.paid&&(
        <div style={{borderTop:`1px solid ${line}`,padding:10}}>
          <div style={{fontSize:11,color:muted,marginBottom:6}}>Reply as {inv.contact} · suggested:</div>
          <div style={{display:"flex",gap:6,overflowX:"auto",marginBottom:8}}>
            {PAY_QUICK.map(q=>(
              <button key={q} onClick={()=>submit(q)} disabled={!canReply}
                style={{whiteSpace:"nowrap",fontSize:12,background:"#EEF2FF",color:"#1E3A8A",border:"1px solid #C7D2FE",padding:"5px 10px",borderRadius:999,cursor:canReply?"pointer":"default",opacity:canReply?1:.5,fontWeight:600}}>{q}</button>
            ))}
          </div>
          <div style={{display:"flex",gap:8,alignItems:"flex-end"}}>
            <textarea aria-label={`Reply as ${inv.contact}`} value={draft} onChange={e=>setDraft(e.target.value)} disabled={!canReply} rows={2}
              onKeyDown={e=>{ if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)) submit(draft); }} placeholder={`Write a reply as ${inv.contact}… (Ctrl+Enter to send)`}
              style={{flex:1,resize:"none",border:`1px solid ${line}`,borderRadius:10,padding:"8px 10px",fontSize:13.5,fontFamily:"inherit",outline:"none",color:"#1F2937"}}/>
            <button onClick={()=>submit(draft)} disabled={!canReply||!draft.trim()} style={{...btn("#1E3A8A","#fff"),padding:"10px 14px",opacity:canReply&&draft.trim()?1:.5}}>Send</button>
          </div>
        </div>
      )}
    </div>
  );
}

                <>
                  <div style={{fontWeight:800,marginBottom:10}}>How would you like to pay?</div>
                  <div role="radiogroup" aria-label="Payment method" style={{display:"flex",flexDirection:"column",gap:8}}>
                    {opts.map(([k,t,s])=>(
                      <label key={k} style={{display:"flex",gap:10,alignItems:"center",padding:"10px 12px",border:`1.5px solid ${method===k?brand:C.pLine}`,borderRadius:11,cursor:"pointer",background:method===k?`${brand}10`:"#fff"}}>
                        <input type="radio" name="paymethod" checked={method===k} onChange={()=>setMethod(k)} style={{accentColor:brand}}/>
                        <span><b style={{fontSize:13.5}}>{t}</b><br/><span style={{fontSize:11.5,color:C.pSub}}>{s}</span></span>
                      </label>

                  </div>
                  {method==="sepa"&&<div style={{fontSize:12,color:C.pSub,background:C.pBg,borderRadius:9,padding:"8px 10px",marginTop:8}}>IBAN DE00 1234 5678 9000 0000 00 (example account) · reference <b>{inv.id}</b></div>}
                  <button onClick={pay} style={{marginTop:12,width:"100%",padding:"12px 0",borderRadius:11,border:"none",fontWeight:800,fontSize:15,cursor:"pointer",background:brand,color:"#fff"}}>
                    {method==="plan"?`Start plan · pay ${eur(inv.amount/3)} today`:`Pay ${eur(inv.amount)}`}
                  </button>
                  <div style={{fontSize:11,color:C.pSub,textAlign:"center",marginTop:6}}>Test payment: no money moves in this demo.</div>
                  <button onClick={()=>reportProblem(inv)} style={{marginTop:10,width:"100%",background:"none",border:`1px solid ${C.pLine}`,borderRadius:10,padding:"8px 0",fontSize:12.5,fontWeight:700,color:C.pInk,cursor:"pointer"}}>
                    Something wrong with the installation? Tell us first
                  </button>
                </>
              )}
            </div>
          </div>
        </div>
      </div>
    </>
  );
}

function RangeCalendar({ from, to, onPick, weekStart, counts }){
  const [view,setView]=useState(()=>{ const d=parseYmd(to); return new Date(d.getFullYear(), d.getMonth(), 1); });
  const [pending,setPending]=useState(null);
  useEffect(()=>{ if(!pending){ const d=parseYmd(to); setView(new Date(d.getFullYear(), d.getMonth(), 1)); } },[to]);
  const y=view.getFullYear(), m=view.getMonth();
  const lead=(new Date(y,m,1).getDay()-weekStart+7)%7, days=new Date(y,m+1,0).getDate();
  const cells=[...Array(lead).fill(null), ...Array.from({ length:days },(_,i)=>new Date(y,m,i+1))];
  const names=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], head=[...names.slice(weekStart),...names.slice(0,weekStart)];
  const todayS=ymd(today0());
  const pick=d=>{ const s=ymd(d); if(!pending){ setPending(s); onPick(s,s); } else { const [a,b]=pending<=s?[pending,s]:[s,pending]; onPick(a,b); setPending(null); } };
  const nav=k=>setView(new Date(y,m+k,1));
  const navBtn={ background:C.panel2, color:C.text, border:`1px solid ${C.line}`, borderRadius:8, width:30, height:30, cursor:"pointer", fontSize:15 };
  return (
    <div style={{background:C.night,border:`1px solid ${C.line}`,borderRadius:12,padding:12,width:"100%",maxWidth:330}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
        <button onClick={()=>nav(-1)} aria-label="Previous month" style={navBtn}>‹</button>
        <b style={{fontSize:13.5}} aria-live="polite">{MONTHS[m]} {y}</b>
        <button onClick={()=>nav(1)} aria-label="Next month" style={navBtn}>›</button>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3,textAlign:"center"}}>
        {head.map(h=><div key={h} style={{fontSize:10.5,color:C.sub,fontWeight:700,padding:"2px 0"}}>{h}</div>)}
        {cells.map((d,i)=>{
          if(!d) return <div key={`e${i}`}/>;
          const s=ymd(d), inR=s>=from&&s<=to, edge=s===from||s===to, n=counts[s]||0;
          return (
            <button key={s} onClick={()=>pick(d)} aria-pressed={inR} aria-label={`${d.getDate()} ${MONTHS[m]} ${y}${n?`, ${n} transaction${n>1?"s":""}`:""}`}
              style={{position:"relative",height:32,borderRadius:7,cursor:"pointer",fontSize:12.5,fontWeight:edge?800:500,
                border:s===todayS?`1px solid ${C.gold}`:"1px solid transparent",
                background:edge?C.gold:inR?"#3A2E12":"transparent",color:edge?C.night:s>todayS?"#55627c":C.text}}>
              {d.getDate()}
              {n>0&&<span style={{position:"absolute",bottom:3,left:"50%",transform:"translateX(-50%)",width:4,height:4,borderRadius:99,background:edge?C.night:"#7DD3FC"}}/>}
            </button>
          );
        })}
      </div>
      <div style={{fontSize:11,color:C.sub,marginTop:8}}>{pending?"Now pick the end date.":"Click a start date, then an end date. Dots mark days with transactions."}</div>
    </div>
  );
}

function exportCsv(rows, from, to, fmt){
  const head=["Date","Reference","Installer","Party","Segment","Type","Amount (EUR)","Method","Account","Document"];
  const esc=v=>`"${String(v==null?"":v).replace(/"/g,'""')}"`;
  const lines=[head, ...rows.map(r=>[fmtDate(r.date,fmt), r.ref, COMPANIES.find(c=>c.id===r.co).name, r.party, r.seg, r.type,
    (r.dir==="out"?-r.amount:r.amount).toFixed(2), r.method, r.account, r.doc||"MISSING"])].map(l=>l.map(esc).join(","));
  const blob=new Blob(["﻿"+lines.join("\r\n")],{ type:"text/csv;charset=utf-8" });
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=`solarwake-transactions_${from}_to_${to}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

function LedgerView({ txns }){
  const [cal,setCal]=useState(loadCal);
  const [preset,setPreset]=useState("fy");
  const [range,setRange]=useState(()=>presetRange("fy",loadCal()).map(ymd));
  const [co,setCo]=useState("All");
  const [dir,setDir]=useState("All");
  const [type,setType]=useState("All");
  const [q,setQ]=useState("");
  const [missingOnly,setMissingOnly]=useState(false);
  const [showSettings,setShowSettings]=useState(false);
  const [requested,setRequested]=useState({});
  const [from,to]=range;

  useEffect(()=>{ saveCal(cal); if(preset!=="custom") setRange(presetRange(preset,cal).map(ymd)); },[cal]);
  const applyPreset=k=>{ setPreset(k); setRange(presetRange(k,cal).map(ymd)); };
  const setCustom=(a,b)=>{ setPreset("custom"); setRange(a<=b?[a,b]:[b,a]); };

  const needle=q.trim().toLowerCase();
  const base=txns.filter(t=>(co==="All"||t.co===co)&&(dir==="All"||t.dir===dir)&&(type==="All"||t.type===type)
    &&(!needle||[t.party,t.ref,t.account,t.method,t.doc||""].some(v=>v.toLowerCase().includes(needle))));
  const counts={}; base.forEach(t=>{ counts[t.date]=(counts[t.date]||0)+1; });
  const inPeriod=base.filter(t=>t.date>=from&&t.date<=to);
  const rows=inPeriod.filter(t=>!missingOnly||!t.doc);
  const sumBy=f=>inPeriod.filter(f).reduce((s,t)=>s+t.amount,0);
  const moneyIn=sumBy(t=>t.dir==="in"), moneyOut=sumBy(t=>t.dir==="out"), invoiced=sumBy(t=>t.type==="Invoice issued");
  const missing=inPeriod.filter(t=>!t.doc).length;
  const sel={ background:C.panel2, color:C.text, border:`1px solid ${C.line}`, borderRadius:9, padding:"7px 10px", fontSize:13, fontWeight:600 };
  const dateIn={ ...sel, colorScheme:"dark", fontFamily:"inherit" };

  return (
    <>
      <div style={{...panel,padding:14,marginBottom:14}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,flexWrap:"wrap",marginBottom:10}}>
          <div>
            <div style={label}>Period</div>
            <div style={{fontSize:16,fontWeight:800,marginTop:2}}>{fmtDate(from,cal.fmt)} – {fmtDate(to,cal.fmt)}</div>
          </div>
          <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
            <label style={{fontSize:12,color:C.sub}}>From <input type="date" value={from} max={to} onChange={e=>e.target.value&&setCustom(e.target.value,to)} style={dateIn}/></label>
            <label style={{fontSize:12,color:C.sub}}>To <input type="date" value={to} min={from} onChange={e=>e.target.value&&setCustom(from,e.target.value)} style={dateIn}/></label>
            <button onClick={()=>setShowSettings(s=>!s)} aria-expanded={showSettings} style={{...sel,cursor:"pointer"}}>⚙ Calendar settings</button>
          </div>
        </div>
        {showSettings&&(
          <div className="sw-in" style={{display:"flex",gap:14,flexWrap:"wrap",background:C.night,border:`1px solid ${C.line}`,borderRadius:12,padding:12,marginBottom:10}}>
            <label style={{fontSize:12,color:C.sub}}>Financial year starts in<br/>
              <select value={cal.fyStart} onChange={e=>setCal(c=>({ ...c, fyStart:Number(e.target.value) }))} style={{...sel,marginTop:4}}>{MONTHS.map((n,i)=><option key={n} value={i}>{n}</option>)}</select>
            </label>
            <label style={{fontSize:12,color:C.sub}}>Week starts on<br/>
              <select value={cal.weekStart} onChange={e=>setCal(c=>({ ...c, weekStart:Number(e.target.value) }))} style={{...sel,marginTop:4}}><option value={1}>Monday</option><option value={0}>Sunday</option></select>
            </label>
            <label style={{fontSize:12,color:C.sub}}>Date format<br/>
              <select value={cal.fmt} onChange={e=>setCal(c=>({ ...c, fmt:e.target.value }))} style={{...sel,marginTop:4}}>
                <option value="DMY">31.12.2026</option><option value="ISO">2026-12-31</option><option value="MDY">12/31/2026</option>
              </select>
            </label>
            <div style={{fontSize:11.5,color:C.sub,alignSelf:"flex-end",maxWidth:260}}>Quarters and financial years follow your year start. Saved in this browser.</div>
          </div>
        )}
        <div style={{display:"flex",gap:14,flexWrap:"wrap",alignItems:"flex-start"}}>
          <RangeCalendar from={from} to={to} onPick={setCustom} weekStart={cal.weekStart} counts={counts}/>
          <div style={{flex:"1 1 300px"}}>
            <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:12}} role="group" aria-label="Quick periods">
              {PRESETS.map(([k,t])=>{
                const on=preset===k;
                return <button key={k} onClick={()=>applyPreset(k)} aria-pressed={on} style={{fontSize:12,fontWeight:700,cursor:"pointer",padding:"6px 11px",borderRadius:999,
                  background:on?C.gold:C.panel2,color:on?C.night:C.sub,border:`1px solid ${on?C.gold:C.line}`}}>{t}</button>;
              })}
            </div>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              <select aria-label="Installer" value={co} onChange={e=>setCo(e.target.value)} style={sel}><option value="All">All installers</option>{COMPANIES.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select>
              <select aria-label="Direction" value={dir} onChange={e=>setDir(e.target.value)} style={sel}><option value="All">Money in & out</option><option value="in">Money in</option><option value="out">Money out</option><option value="none">Invoices issued</option></select>
              <select aria-label="Type" value={type} onChange={e=>setType(e.target.value)} style={sel}><option value="All">All types</option>{TXN_TYPES.map(t=><option key={t}>{t}</option>)}</select>
              <input aria-label="Search" value={q} onChange={e=>setQ(e.target.value)} placeholder="Search party, reference, account…" style={{...sel,flex:"1 1 200px",fontWeight:500}}/>
              <label style={{display:"flex",alignItems:"center",gap:7,fontSize:12.5,fontWeight:700,color:missingOnly?"#FCA5A5":C.sub,cursor:"pointer"}}>
                <input type="checkbox" checked={missingOnly} onChange={e=>setMissingOnly(e.target.checked)} style={{accentColor:"#F87171",width:16,height:16}}/> Missing documents only
              </label>
            </div>
          </div>
        </div>
      </div>

      <div className="sw-kpi" style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:10,marginBottom:14}}>
        {[["Money in",`+${eur(moneyIn)}`,"#7BE0A6"],["Money out",`−${eur(moneyOut)}`,"#FCA5A5"],["Net cash",`${moneyIn-moneyOut<0?"−":"+"}${eur(Math.abs(moneyIn-moneyOut))}`,C.text],["Invoiced",eur(invoiced),C.text],["Missing documents",String(missing),missing?"#FCA5A5":"#7BE0A6"]].map(([k,v,c])=>(
          <button key={k} onClick={k==="Missing documents"?()=>setMissingOnly(s=>!s):undefined} style={{textAlign:"left",background:C.panel,border:`1px solid ${k==="Missing documents"&&missingOnly?"#FCA5A5":C.line}`,borderRadius:14,padding:"12px 14px",color:C.text,cursor:k==="Missing documents"?"pointer":"default"}}>
            <div style={{fontSize:v.length>10?17:21,fontWeight:800,color:c}}>{v}</div>
            <div style={{fontSize:12,fontWeight:600,marginTop:2}}>{k}</div>
            <div style={{fontSize:10.5,color:C.sub}}>{k==="Missing documents"?"click to filter":`${fmtDate(from,cal.fmt)} – ${fmtDate(to,cal.fmt)}`}</div>
          </button>
        ))}
      </div>

      <div style={panel}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,flexWrap:"wrap",marginBottom:10}}>
          <div style={label}>{rows.length} transaction{rows.length===1?"":"s"} in this period</div>
          <button onClick={()=>exportCsv(rows,from,to,cal.fmt)} disabled={!rows.length} style={{background:C.gold,color:C.night,border:"none",borderRadius:10,padding:"8px 14px",fontWeight:800,fontSize:13,cursor:"pointer",opacity:rows.length?1:.5}}>⬇ Export CSV for accountant</button>
        </div>
        <div style={{overflowX:"auto",maxHeight:520,overflowY:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:12.5,minWidth:860}}>
            <thead>
              <tr style={{position:"sticky",top:0,background:C.panel,textAlign:"left",color:C.sub}}>
                {["Date","Reference","Party","Type","Amount","Method","Account","Document"].map(h=><th key={h} scope="col" style={{padding:"8px 8px",fontSize:11,textTransform:"uppercase",letterSpacing:.5,borderBottom:`1px solid ${C.line}`,textAlign:h==="Amount"?"right":"left"}}>{h}</th>)}
              </tr>
            </thead>
            <tbody>
              {rows.map(t=>(
                <tr key={t.id} style={{borderBottom:`1px solid ${C.line}`}}>
                  <td style={{padding:"8px",whiteSpace:"nowrap",fontVariantNumeric:"tabular-nums"}}>{fmtDate(t.date,cal.fmt)}</td>
                  <td style={{padding:"8px",whiteSpace:"nowrap",color:C.sub}}>{t.ref}</td>
                  <td style={{padding:"8px"}}>{t.party}{co==="All"&&<div style={{fontSize:10.5,color:C.sub}}>{COMPANIES.find(c=>c.id===t.co).name}</div>}</td>
                  <td style={{padding:"8px",whiteSpace:"nowrap"}}>{t.type}</td>
                  <td style={{padding:"8px",textAlign:"right",fontWeight:800,whiteSpace:"nowrap",fontVariantNumeric:"tabular-nums",color:t.dir==="in"?"#7BE0A6":t.dir==="out"?"#FCA5A5":C.sub}}>
                    {t.dir==="in"?"+":t.dir==="out"?"−":""}{eur(t.amount)}
                  </td>
                  <td style={{padding:"8px",whiteSpace:"nowrap",color:C.sub}}>{t.method}</td>
                  <td style={{padding:"8px",color:C.sub}}>{t.account}</td>
                  <td style={{padding:"8px",whiteSpace:"nowrap"}}>
                    {t.doc ? <span style={{color:C.text}}>📎 {t.doc}</span>
                      : requested[t.id] ? <span style={{color:C.goldSoft,fontWeight:700}}>⏳ Requested</span>
                      : <button onClick={()=>setRequested(r=>({ ...r, [t.id]:true }))} style={{background:"#3B1D1D",color:"#FCA5A5",border:"1px solid #7F1D1D",borderRadius:8,padding:"3px 8px",fontSize:11.5,fontWeight:700,cursor:"pointer"}}>⚠ Missing · request</button>}
                  </td>
                </tr>
              ))}
              {!rows.length&&<tr><td colSpan={8} style={{padding:16,color:C.sub,textAlign:"center"}}>No transactions in this period. Try a wider range.</td></tr>}
            </tbody>
          </table>
        </div>
      </div>
    </>
  );
}
